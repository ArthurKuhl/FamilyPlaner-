<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Übersicht</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --soil: #3a2e1f; --moss: #4f6f45; --sage: #7fa476; --leaf: #bcd196;
    --cream: #faf6ec; --parchment: #ece0c7; --bark: #7d6339;
    --terracotta: #c46b41; --terracotta-text: #a8532e; --sky: #5b8bb5;
    --white: #fffdf8; --navbg: #2a2016;
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 18px; --radius-pill: 22px;
    --shadow-soft: 0 2px 10px rgba(59,47,30,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--soil); min-height: 100vh; padding-bottom: 40px; }
  button { font-family: inherit; -webkit-tap-highlight-color: transparent; }

  header.top { background: var(--navbg); color: var(--leaf); padding: 18px 16px 16px; }
  header.top .gruss { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; }
  header.top .datum { font-size: 0.8rem; color: var(--sage); margin-top: 2px; text-transform: capitalize; }

  main { padding: 14px; max-width: 640px; margin: 0 auto; }
  @media (min-width: 1000px) { main { max-width: 1200px; } }

  .kachel {
    background: var(--white); border-radius: var(--radius-md); padding: 14px; margin-bottom: 12px;
    box-shadow: var(--shadow-soft); cursor: pointer; transition: transform 0.1s;
  }
  .kachel:hover { transform: translateY(-1px); }
  .kachel-kopf { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .kachel-titel { display: flex; align-items: center; gap: 8px; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1rem; }
  .kachel-badge {
    background: var(--moss); color: var(--leaf); font-size: 0.72rem; font-weight: 700;
    padding: 2px 10px; border-radius: var(--radius-pill); min-width: 20px; text-align: center;
  }
  .kachel-badge.leer { background: var(--parchment); color: var(--bark); }
  .kachel-pfeil { color: var(--bark); opacity: 0.5; font-size: 0.9rem; }

  .mini-zeile { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 0.85rem; border-top: 1px solid var(--parchment); }
  .mini-zeile:first-of-type { border-top: none; }
  .mini-zeit { font-size: 0.72rem; font-weight: 700; color: var(--bark); min-width: 46px; }
  .mini-farbpunkt { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .mini-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini-leer { font-size: 0.8rem; color: var(--bark); opacity: 0.7; padding: 4px 0; }
  .haushalt-zeile { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px solid var(--parchment); font-size: 0.84rem; }
  .haushalt-zeile:first-child { border-top: none; }
  .haushalt-zeile .hz-icon { font-size: 1.05rem; flex-shrink: 0; }
  .haushalt-zeile .hz-titel { flex: 1; min-width: 0; }
  .haushalt-zeile .hz-wer { font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: var(--radius-pill); color: var(--white); flex-shrink: 0; }

  .garten-kachel { border-top: 3px solid var(--moss); }
  .garten-hinweis { font-size: 0.8rem; color: var(--bark); line-height: 1.4; }
  .warnung-chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 0.72rem; font-weight: 700;
    padding: 4px 10px; border-radius: var(--radius-pill); margin: 6px 6px 0 0;
    background: #fdf0da; color: #a8532e;
  }
  .kochen-rezept-info { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; font-weight: 600; }
  .kochen-rezept-info .icon { font-size: 1.3rem; }

  .fb-typ-reihe { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .fb-typ-btn { padding: 6px 12px; border-radius: var(--radius-pill); font-size: 0.75rem; font-weight: 600; border: 1px solid var(--parchment); background: var(--cream); color: var(--bark); cursor: pointer; }
  .fb-typ-btn.aktiv { background: var(--moss); color: var(--white); border-color: transparent; }
  .fb-textarea { width: 100%; min-height: 60px; padding: 8px; border: 1px solid var(--parchment); border-radius: var(--radius-sm); font-family: inherit; font-size: 0.85rem; resize: vertical; background: var(--cream); color: var(--soil); }
  .fb-btn-hinzufuegen { margin-top: 6px; background: var(--moss); color: var(--white); border: none; border-radius: var(--radius-pill); padding: 8px 16px; font-size: 0.82rem; font-weight: 700; cursor: pointer; }
  .fb-eintrag { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; border-top: 1px solid var(--parchment); }
  .fb-eintrag:first-of-type { border-top: none; }
  .fb-eintrag.erledigt { opacity: 0.55; }
  .fb-eintrag.erledigt .fb-eintrag-text { text-decoration: line-through; }
  .fb-eintrag-icon { font-size: 1.1rem; flex-shrink: 0; }
  .fb-eintrag-body { flex: 1; min-width: 0; }
  .fb-eintrag-text { font-size: 0.85rem; line-height: 1.35; word-break: break-word; }
  .fb-eintrag-datum { font-size: 0.68rem; color: var(--bark); opacity: 0.75; margin-top: 2px; }
  .fb-eintrag-btns { display: flex; gap: 4px; flex-shrink: 0; }
  .fb-eintrag-btns button { background: none; border: none; font-size: 0.95rem; cursor: pointer; padding: 2px 4px; opacity: 0.7; }
  .fb-eintrag-btns button:hover { opacity: 1; }
</style>
<script src="personen.js"></script>
<script src="sync.js"></script>
</head>
<body>

<header class="top">
  <div class="gruss" id="grussText">Hallo!</div>
  <div class="datum" id="datumText"></div>
</header>

<main>
  <div class="kachel" id="kachelTermine">
    <div class="kachel-kopf">
      <div class="kachel-titel">🗓️ Termine heute</div>
      <span class="kachel-badge" id="badgeTermine">0</span>
    </div>
    <div id="listeTermine"></div>
  </div>

  <div class="kachel" id="kachelEinkauf">
    <div class="kachel-kopf">
      <div class="kachel-titel">🛒 Einkauf offen</div>
      <span class="kachel-badge" id="badgeEinkauf">0</span>
    </div>
    <div id="listeEinkauf"></div>
  </div>

  <div class="kachel" id="kachelSport">
    <div class="kachel-kopf">
      <div class="kachel-titel">🏃 Sport heute</div>
      <span class="kachel-badge" id="badgeSport">0</span>
    </div>
    <div id="listeSport"></div>
  </div>

  <div class="kachel" id="kachelKochen" style="display:none;">
    <div class="kachel-kopf">
      <div class="kachel-titel">🍳 Heute kochen</div>
      <span class="kachel-pfeil">→</span>
    </div>
    <div id="kochenHeuteInfo"></div>
  </div>

  <div class="kachel garten-kachel" id="kachelGarten">
    <div class="kachel-kopf">
      <div class="kachel-titel">🌱 Garten</div>
      <span class="kachel-pfeil">→</span>
    </div>
    <div class="garten-hinweis" id="gartenHinweisText">Pflegeplan &amp; Tagesüberblick ansehen (Gieß-/Pflegeaufgaben, Wetterwarnungen)</div>
    <div id="gartenWarnungen"></div>
    <div class="garten-hinweis" id="gartenPflanzErnte" style="margin-top:6px;"></div>
  </div>

  <div class="kachel" id="kachelHaushalt">
    <div class="kachel-kopf">
      <div class="kachel-titel">🧹 Haushalt</div>
      <span class="kachel-badge leer" id="badgeHaushalt">0</span>
    </div>
    <div id="haushaltListe"></div>
  </div>

  <div class="kachel" id="kachelFeedback" style="cursor:default">
    <div class="kachel-kopf" id="feedbackToggle" style="cursor:pointer">
      <div class="kachel-titel">💬 Feedback &amp; Ideen</div>
      <span class="kachel-badge leer" id="badgeFeedback">0</span>
    </div>
    <div id="feedbackBody" style="display:none;margin-top:8px">
      <div class="fb-typ-reihe" id="feedbackTypReihe"></div>
      <textarea class="fb-textarea" id="feedbackText" placeholder="Was ist dir aufgefallen? Bug, Idee, Verbesserungsvorschlag ..."></textarea>
      <button class="fb-btn-hinzufuegen" id="btnFeedbackHinzufuegen">＋ Hinzufügen</button>
      <div id="feedbackListe" style="margin-top:6px"></div>
    </div>
  </div>
</main>

<script>
(function () {
  'use strict';

  function heute() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function toISODatum(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function ausISO(iso) { const [j, m, t] = iso.split('-').map(Number); return new Date(j, m - 1, t); }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function laden(key, fallback) {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch (e) { return fallback; }
  }
  function speichern(key, wert) {
    try { localStorage.setItem(key, JSON.stringify(wert)); }
    catch (e) { console.warn('Übersicht: Speichern fehlgeschlagen', key, e); alert('Speichern fehlgeschlagen – ist der Speicher voll?'); }
    if (window._sync) window._sync.melde();
  }
  function neueId(prefix) { return prefix + Date.now() + Math.random().toString(36).slice(2, 7); }
  function navigiere(modul) {
    try { window.parent.postMessage({ type: 'navigiere', modul: modul }, window.location.origin); } catch (e) {}
  }

  // --- Begrüßung ---
  const stunde = new Date().getHours();
  const gruss = stunde < 11 ? 'Guten Morgen!' : (stunde < 18 ? 'Guten Tag!' : 'Guten Abend!');
  document.getElementById('grussText').textContent = gruss;
  document.getElementById('datumText').textContent = new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });

  // ============================================================
  // TERMINE HEUTE
  // ============================================================
  const WER_OPTIONEN = window.PLANER_PERSONEN || [
    { id: 'familie', label: 'Familie', farbe: '#4f6f45' },
    { id: 'mama',    label: 'Mama',    farbe: '#c46b41' },
    { id: 'papa',    label: 'Papa',    farbe: '#5b8bb5' },
  ];
  function farbeFuerWer(wer) { return (WER_OPTIONEN.find(w => w.id === wer) || WER_OPTIONEN[0]).farbe; }

  function vorkommenHeute(ev, heuteISO) {
    let d = new Date(ev.date);
    const bisWiederholung = ev.recurrence && ev.recurrence.until ? new Date(ev.recurrence.until) : null;
    const freq = ev.recurrence ? ev.recurrence.freq : 'keine';
    const heuteDatum = ausISO(heuteISO);
    let sicherheitszaehler = 0;
    while (d <= heuteDatum && sicherheitszaehler < 500) {
      sicherheitszaehler++;
      if (bisWiederholung && d > bisWiederholung) return false;
      if (toISODatum(d) === heuteISO) return true;
      if (freq === 'keine') return false;
      if (freq === 'woechentlich') d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7);
      else if (freq === 'monatlich') d = new Date(d.getFullYear(), d.getMonth() + 1, d.getDate());
      else if (freq === 'jaehrlich') d = new Date(d.getFullYear() + 1, d.getMonth(), d.getDate());
      else return false;
    }
    return false;
  }

  function renderTermine() {
    const events = laden('termine_events_v1', []);
    const heuteISO = toISODatum(heute());
    const heutige = events.filter(ev => vorkommenHeute(ev, heuteISO))
      .sort((a, b) => (a.allDay ? '' : (a.startTime || '')).localeCompare(b.allDay ? '' : (b.startTime || '')));

    document.getElementById('badgeTermine').textContent = heutige.length;
    document.getElementById('badgeTermine').classList.toggle('leer', heutige.length === 0);
    const box = document.getElementById('listeTermine');
    if (!heutige.length) { box.innerHTML = '<div class="mini-leer">Keine Termine heute 🎉</div>'; return; }
    box.innerHTML = heutige.slice(0, 5).map(ev =>
      '<div class="mini-zeile"><span class="mini-zeit">' + (ev.allDay ? 'Ganztags' : (ev.startTime || '')) + '</span>' +
      '<span class="mini-farbpunkt" style="background:' + farbeFuerWer(ev.wer) + ';"></span>' +
      '<span class="mini-name">' + escapeHtml(ev.title) + '</span></div>'
    ).join('') + (heutige.length > 5 ? '<div class="mini-leer">+ ' + (heutige.length - 5) + ' weitere</div>' : '');
  }
  document.getElementById('kachelTermine').addEventListener('click', () => navigiere('termine'));

  // ============================================================
  // EINKAUF OFFEN
  // ============================================================
  function renderEinkauf() {
    const listen = laden('einkauf_listen', []);
    let gesamtOffen = 0;
    const zeilen = [];
    listen.forEach(l => {
      const offen = (l.items || []).filter(i => !i.erledigt).length;
      gesamtOffen += offen;
      if (offen > 0) zeilen.push({ name: l.name, offen: offen });
    });
    document.getElementById('badgeEinkauf').textContent = gesamtOffen;
    document.getElementById('badgeEinkauf').classList.toggle('leer', gesamtOffen === 0);
    const box = document.getElementById('listeEinkauf');
    if (!gesamtOffen) { box.innerHTML = '<div class="mini-leer">Alles erledigt 🎉</div>'; return; }
    box.innerHTML = zeilen.map(z =>
      '<div class="mini-zeile"><span class="mini-name">' + escapeHtml(z.name) + '</span>' +
      '<span class="mini-zeit">' + z.offen + ' offen</span></div>'
    ).join('');
  }
  document.getElementById('kachelEinkauf').addEventListener('click', () => navigiere('einkauf'));

  // ============================================================
  // SPORT HEUTE
  // ============================================================
  const SPORT_TYPEN = [
    { id: 'laufen', label: 'Laufen', icon: '🏃' }, { id: 'radfahren', label: 'Radfahren', icon: '🚴' },
    { id: 'kraft', label: 'Krafttraining', icon: '🏋️' }, { id: 'yoga', label: 'Yoga', icon: '🧘' },
    { id: 'schwimmen', label: 'Schwimmen', icon: '🏊' }, { id: 'wandern', label: 'Wandern', icon: '🥾' },
    { id: 'sonstiges', label: 'Sonstiges', icon: '🤸' },
  ];
  const PERSONEN_LABEL = {};
  (window.PLANER_PERSONEN || []).forEach(p => { PERSONEN_LABEL[p.id] = p.label; });
  if (!Object.keys(PERSONEN_LABEL).length) Object.assign(PERSONEN_LABEL, { mama: 'Mama', papa: 'Papa', familie: 'Familie' });
  function typInfo(id) { return SPORT_TYPEN.find(t => t.id === id) || SPORT_TYPEN[SPORT_TYPEN.length - 1]; }

  function renderSport() {
    const alle = laden('gesundheit_sport', []);
    const heuteISO = toISODatum(heute());
    const heutige = alle.filter(s => s.datum === heuteISO);
    document.getElementById('badgeSport').textContent = heutige.length;
    document.getElementById('badgeSport').classList.toggle('leer', heutige.length === 0);
    const box = document.getElementById('listeSport');
    if (!heutige.length) { box.innerHTML = '<div class="mini-leer">Noch keine Sport-Einheit heute</div>'; return; }
    box.innerHTML = heutige.map(s => {
      const t = typInfo(s.typ);
      return '<div class="mini-zeile"><span class="mini-zeit">' + t.icon + '</span>' +
        '<span class="mini-name">' + t.label + ' · ' + (PERSONEN_LABEL[s.person] || s.person) + '</span>' +
        '<span class="mini-zeit">' + s.dauer + ' Min.</span></div>';
    }).join('');
  }
  document.getElementById('kachelSport').addEventListener('click', () => navigiere('gesundheit'));

  // ============================================================
  // GARTEN – Wetterwarnungen (aus dem letzten Abruf im Garten-Modul auf diesem Gerät;
  // die genaue Gießaufgaben-Zahl bleibt bewusst aus, siehe Kommentar oben ursprünglich)
  // ============================================================
  document.getElementById('kachelGarten').addEventListener('click', () => navigiere('garten'));

  // Kompakte Kopie der Aussaat-/Erntezeiten-Richtwerte aus garten.html, nur für die
  // Kurzübersicht auf der Startseite (Zahlen, keine Namen/Symbole -> bewusst schlank gehalten).
  const SOWING_KURZ = {
    'Tomate':[null,[5,6]],'Paprika':[null,[5,6]],'Aubergine':[null,[5,6]],'Gurke':[[5,6],[5,6]],
    'Zucchini':[[5,6],[5,6]],'Kürbis':[[5,6],[5,6]],'Karotte':[[3,7],null],'Salat':[[3,8],[3,9]],
    'Radieschen':[[3,8],null],'Rettich':[[3,7],null],'Spinat':[[3,4],null],'Mangold':[[4,6],[4,6]],
    'Rucola':[[3,9],null],'Feldsalat':[[8,9],null],'Brokkoli':[null,[5,6]],'Blumenkohl':[null,[5,6]],
    'Weißkohl':[null,[5,6]],'Rotkohl':[null,[5,6]],'Kohlrabi':[[4,7],[3,8]],'Bohnen':[[5,7],null],
    'Erbsen':[[3,5],null],'Mais':[[5,5],[5,6]],'Kartoffel':[null,[4,5]],'Rote Bete':[[4,6],null],
    'Zwiebel':[[3,4],[4,5]],'Lauch (Porree)':[null,[5,6]],'Knoblauch':[null,[3,4]],'Sellerie':[null,[5,5]],
    'Fenchel':[[5,6],[5,6]],'Spargel':[null,[3,4]],'Süßkartoffel':[null,[5,6]],'Kräuter':[[4,6],[5,6]],
    'Basilikum':[null,[5,6]],'Petersilie':[[3,6],[4,6]],'Schnittlauch':[[3,5],[4,5]],'Dill':[[4,7],null],
    'Erdbeere':[null,[3,4]],
  };
  const HARVEST_KURZ = {
    'Tomate':[7,10],'Paprika':[7,10],'Aubergine':[7,10],'Gurke':[6,9],'Zucchini':[6,10],'Kürbis':[9,10],
    'Karotte':[6,10],'Salat':[5,10],'Radieschen':[4,10],'Rettich':[6,10],'Spinat':[4,6],'Mangold':[6,10],
    'Rucola':[5,10],'Feldsalat':[10,3],'Brokkoli':[6,10],'Blumenkohl':[6,10],'Weißkohl':[8,11],'Rotkohl':[8,11],
    'Kohlrabi':[5,10],'Bohnen':[7,9],'Erbsen':[6,7],'Mais':[8,9],'Kartoffel':[7,9],'Rote Bete':[7,10],
    'Zwiebel':[7,9],'Lauch (Porree)':[9,2],'Knoblauch':[6,7],'Sellerie':[9,10],'Fenchel':[8,10],'Spargel':[4,6],
    'Süßkartoffel':[9,10],'Kräuter':[5,9],'Basilikum':[6,9],'Petersilie':[5,10],'Schnittlauch':[4,9],
    'Dill':[6,9],'Erdbeere':[6,7],
  };
  function inFenster(r, monat) {
    if (!r) return false;
    if (r[0] <= r[1]) return monat >= r[0] && monat <= r[1];
    return monat >= r[0] || monat <= r[1];
  }
  function renderGartenPflanzErnte() {
    const box = document.getElementById('gartenPflanzErnte');
    const gartenDaten = laden('gartenplaner_v3', null);
    let klimaOffset = 0;
    if (gartenDaten && gartenDaten.currentGardenId && gartenDaten.gardens) {
      const zone = gartenDaten.gardens[gartenDaten.currentGardenId]?.climateZone;
      klimaOffset = zone === 'mild' ? -1 : (zone === 'rau' ? 1 : 0);
    }
    function verschieben(r) {
      if (!r || !klimaOffset) return r;
      return [Math.min(12,Math.max(1,r[0]+klimaOffset)), Math.min(12,Math.max(1,r[1]+klimaOffset))];
    }
    const monat = new Date().getMonth() + 1;
    const anzahlPflanzbar = Object.values(SOWING_KURZ).filter(([direkt, aus]) => inFenster(verschieben(direkt), monat) || inFenster(verschieben(aus), monat)).length;
    const anzahlErntbar = Object.values(HARVEST_KURZ).filter(r => inFenster(r, monat)).length;
    box.textContent = '🌱 ' + anzahlPflanzbar + ' Pflanzen aktuell pflanzbar · 🧺 ' + anzahlErntbar + ' erntbar';
  }

  function renderGartenWarnungen() {
    const hinweise = laden('gartenplaner_wetterHinweise', null);
    const box = document.getElementById('gartenWarnungen');
    box.innerHTML = '';
    if (!hinweise) return;
    // Warnungen älter als 6 Stunden nicht mehr als aktuell anzeigen
    const alterMs = Date.now() - new Date(hinweise.aktualisiertAm).getTime();
    if (alterMs > 6 * 60 * 60 * 1000) return;
    const chips = [];
    if (hinweise.frost) chips.push({ icon: '❄️', text: 'Frostwarnung' });
    if (hinweise.hitze) chips.push({ icon: '🌡️', text: 'Hitzewarnung' });
    if (hinweise.starkregen) chips.push({ icon: '🌧️', text: 'Starkregen' });
    if (hinweise.hagel) chips.push({ icon: '⛈️', text: 'Hagelwarnung' });
    box.innerHTML = chips.map(c => '<span class="warnung-chip">' + c.icon + ' ' + c.text + '</span>').join('');
  }

  // ============================================================
  // KOCHEN – heutiges Rezept aus dem Wochenplan
  // ============================================================
  const KOCHEN_KATEGORIE_ICONS = {
    fruehstueck: '🍳', hauptspeise: '🍲', beilage: '🥗', dessert: '🍰',
    gebaeck: '🥐', getraenke: '🥤', sonstiges: '📦',
  };
  function renderKochenHeute() {
    const wochenplan = laden('kochen_wochenplan', {});
    const rezepte = laden('kochen_rezepte', []);
    const heuteISO = toISODatum(heute());
    const rezeptId = wochenplan[heuteISO];
    const rezept = rezeptId ? rezepte.find(r => r.id === rezeptId) : null;
    const kachel = document.getElementById('kachelKochen');
    if (!rezept) { kachel.style.display = 'none'; return; }
    kachel.style.display = '';
    const icon = KOCHEN_KATEGORIE_ICONS[rezept.kategorie] || '🍽️';
    document.getElementById('kochenHeuteInfo').innerHTML =
      '<div class="kochen-rezept-info"><span class="icon">' + icon + '</span><span>' + escapeHtml(rezept.titel) + '</span></div>';
  }
  document.getElementById('kachelKochen').addEventListener('click', () => navigiere('kochen'));

  // ============================================================
  // HAUSHALT (fällige Aufgaben heute)
  // ============================================================
  document.getElementById('kachelHaushalt').addEventListener('click', () => navigiere('haushalt'));

  function haushaltPersonInfo(id) {
    const liste = window.PLANER_PERSONEN || [{ id: 'mama', label: 'Mama', farbe: '#c46b41' }, { id: 'papa', label: 'Papa', farbe: '#5b8bb5' }];
    return liste.find(p => p.id === id) || { id, label: id, farbe: '#7d6339' };
  }
  function haushaltIstFaelligOffen(a) {
    if (a.pausiert) return false;
    const heute = new Date().toISOString().slice(0, 10);
    const letzte = (a.erledigt && a.erledigt.length) ? a.erledigt[a.erledigt.length - 1] : null;
    const letzteDatum = letzte ? (letzte.datum || '').slice(0, 10) : null;
    const letzteMonat = letzte ? (letzte.datum || '').slice(0, 7) : null;
    if (a.turnus === 'taeglich') return !letzte || letzteDatum !== heute;
    if (a.turnus === 'woechentlich') {
      const heuteTag = new Date().getDay();
      if (!(a.wochentage || []).includes(heuteTag)) return false;
      return !letzte || letzteDatum !== heute;
    }
    if (a.turnus === 'monatlich') return !letzte || letzteMonat !== heute.slice(0, 7);
    if (a.turnus === 'einmalig') return !letzte;
    return false;
  }
  function haushaltZustaendigText(a) {
    if (a.zuweisung === 'fest' && a.person) return haushaltPersonInfo(a.person);
    if (a.zuweisung === 'rotation' && (a.rotationPersonen || []).length) {
      const idx = (a.rotationIndex || 0) % a.rotationPersonen.length;
      return haushaltPersonInfo(a.rotationPersonen[idx]);
    }
    return null;
  }
  function renderHaushalt() {
    const aufgaben = laden('haushalt_aufgaben', []);
    const faellige = aufgaben.filter(haushaltIstFaelligOffen);
    const badge = document.getElementById('badgeHaushalt');
    badge.textContent = String(faellige.length);
    badge.className = 'kachel-badge' + (faellige.length === 0 ? ' leer' : '');
    const box = document.getElementById('haushaltListe');
    if (!faellige.length) {
      box.innerHTML = '<div class="mini-leer">' + (aufgaben.length ? 'Heute nichts offen. 🎉' : 'Noch keine Aufgaben angelegt.') + '</div>';
      return;
    }
    box.innerHTML = faellige.slice(0, 5).map(a => {
      const wer = haushaltZustaendigText(a);
      const werHtml = wer ? '<span class="hz-wer" style="background:' + escapeHtml(wer.farbe || '#7d6339') + '">' + escapeHtml(wer.label) + '</span>' : '';
      return '<div class="haushalt-zeile"><span class="hz-icon">' + escapeHtml(a.icon || '🧹') + '</span><span class="hz-titel">' + escapeHtml(a.titel) + '</span>' + werHtml + '</div>';
    }).join('') + (faellige.length > 5 ? '<div class="mini-leer">+ ' + (faellige.length - 5) + ' weitere ...</div>' : '');
  }

  // ============================================================
  // FEEDBACK & IDEEN
  // ============================================================
  const KEY_FEEDBACK = 'app_feedback';
  const FEEDBACK_TYPEN = [
    { id: 'bug',   label: 'Bug',       icon: '🐛' },
    { id: 'idee',  label: 'Idee',      icon: '💡' },
    { id: 'sonstiges', label: 'Sonstiges', icon: '💬' },
  ];
  function feedbackTypInfo(id) { return FEEDBACK_TYPEN.find(t => t.id === id) || FEEDBACK_TYPEN[2]; }
  let feedbackEintraege = laden(KEY_FEEDBACK, []);
  let feedbackAusgewaehlterTyp = 'idee';

  function feedbackSpeichern() { speichern(KEY_FEEDBACK, feedbackEintraege); }

  function feedbackTypReiheRendern() {
    const box = document.getElementById('feedbackTypReihe');
    box.innerHTML = '';
    FEEDBACK_TYPEN.forEach(t => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'fb-typ-btn' + (t.id === feedbackAusgewaehlterTyp ? ' aktiv' : '');
      btn.textContent = t.icon + ' ' + t.label;
      btn.addEventListener('click', () => { feedbackAusgewaehlterTyp = t.id; feedbackTypReiheRendern(); });
      box.appendChild(btn);
    });
  }

  function feedbackDatumText(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' }) + ' · ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  }

  function feedbackListeRendern() {
    const box = document.getElementById('feedbackListe');
    box.innerHTML = '';
    const offenAnzahl = feedbackEintraege.filter(e => !e.erledigt).length;
    const badge = document.getElementById('badgeFeedback');
    badge.textContent = String(offenAnzahl);
    badge.className = 'kachel-badge' + (offenAnzahl === 0 ? ' leer' : '');
    if (!feedbackEintraege.length) {
      box.innerHTML = '<div class="mini-leer">Noch kein Feedback hinterlassen.</div>';
      return;
    }
    const sortiert = feedbackEintraege.slice().sort((a, b) => {
      if (a.erledigt !== b.erledigt) return a.erledigt ? 1 : -1;
      return new Date(b.erstellt) - new Date(a.erstellt);
    });
    sortiert.forEach(e => {
      const info = feedbackTypInfo(e.typ);
      const zeile = document.createElement('div');
      zeile.className = 'fb-eintrag' + (e.erledigt ? ' erledigt' : '');
      zeile.innerHTML =
        '<span class="fb-eintrag-icon">' + info.icon + '</span>' +
        '<div class="fb-eintrag-body">' +
          '<div class="fb-eintrag-text">' + escapeHtml(e.text) + '</div>' +
          '<div class="fb-eintrag-datum">' + feedbackDatumText(e.erstellt) + '</div>' +
        '</div>' +
        '<div class="fb-eintrag-btns">' +
          '<button class="fb-btn-erledigt" title="' + (e.erledigt ? 'Als offen markieren' : 'Als erledigt markieren') + '">' + (e.erledigt ? '↺' : '✓') + '</button>' +
          '<button class="fb-btn-loeschen" title="Löschen">🗑️</button>' +
        '</div>';
      zeile.querySelector('.fb-btn-erledigt').addEventListener('click', () => {
        e.erledigt = !e.erledigt;
        feedbackSpeichern();
        feedbackListeRendern();
      });
      zeile.querySelector('.fb-btn-loeschen').addEventListener('click', () => {
        if (!confirm('Diesen Eintrag wirklich löschen?')) return;
        feedbackEintraege = feedbackEintraege.filter(x => x.id !== e.id);
        feedbackSpeichern();
        feedbackListeRendern();
      });
      box.appendChild(zeile);
    });
  }

  document.getElementById('feedbackToggle').addEventListener('click', () => {
    const body = document.getElementById('feedbackBody');
    body.style.display = body.style.display === 'none' ? '' : 'none';
  });
  document.getElementById('btnFeedbackHinzufuegen').addEventListener('click', () => {
    const feld = document.getElementById('feedbackText');
    const text = feld.value.trim();
    if (!text) { feld.focus(); return; }
    feedbackEintraege.push({ id: neueId('fb'), typ: feedbackAusgewaehlterTyp, text, erstellt: new Date().toISOString(), erledigt: false });
    feedbackSpeichern();
    feld.value = '';
    feedbackListeRendern();
  });

  feedbackTypReiheRendern();
  feedbackListeRendern();

  if (window.PlanerSync) {
    window._sync = window.PlanerSync.starteSync({
      modul: 'home',
      keys: [KEY_FEEDBACK],
      onRemoteChange: function () { feedbackEintraege = laden(KEY_FEEDBACK, feedbackEintraege); feedbackListeRendern(); },
    });
  }

  renderTermine();
  renderEinkauf();
  renderSport();
  renderGartenWarnungen();
  renderGartenPflanzErnte();
  renderKochenHeute();
  renderHaushalt();

  // Bei Rückkehr auf die Startseite (z.B. nach Bearbeitung in einem anderen Modul) neu laden
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { renderTermine(); renderEinkauf(); renderSport(); renderGartenWarnungen(); renderGartenPflanzErnte(); renderKochenHeute(); renderHaushalt(); feedbackEintraege = laden(KEY_FEEDBACK, feedbackEintraege); feedbackListeRendern(); }
  });
})();
</script>
</body>
</html>
