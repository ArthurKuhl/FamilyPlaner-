<!DOCTYPE html>
<html lang="de">
<head>
<script>(function(){try{var m=localStorage.getItem('planer_darkMode');if(m==='dunkel'||(m==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-dark','1');}var s=localStorage.getItem('planer_schriftgroesse');if(s==='gross'){document.documentElement.style.fontSize='19px';}var f=localStorage.getItem('planer_farbschema');if(f&&f!=='wald'){document.documentElement.setAttribute('data-farbschema',f);}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wunschliste</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500;600&display=swap');
  :root {
    --soil: #3a2e1f; --moss: #4f6f45; --sage: #7fa476; --leaf: #bcd196;
    --cream: #faf6ec; --parchment: #ece0c7; --bark: #7d6339;
    --terracotta: #c46b41; --terracotta-text: #a8532e; --sky: #5b8bb5; --gold: #c99a3a; --white: #fffdf8; --navbg: #2a2016; --navbg2: #3a2e1f;
    --shadow-soft: 0 2px 10px rgba(59,47,30,0.08); --shadow-md: 0 6px 20px rgba(59,47,30,0.14);
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 18px; --radius-pill: 22px;
  }
  html[data-dark="1"] {
    --soil: #f0e8d8; --moss: #6fae5e; --sage: #9bc98a; --leaf: #cfe3b8;
    --cream: #1e1b16; --parchment: #2b261e; --bark: #c2b393;
    --terracotta: #d9855a; --terracotta-text: #e8a37e; --sky: #7fa8cc; --gold: #dcb158;
    --white: #2f2a22; --navbg: #14100c; --navbg2: #221a12;
  }

  /* ---- Farbschemata (global, familienweit synchronisiert) ---- */
  html[data-farbschema="ozean"] {
    --navbg: #1c1f24; --navbg2: #2b2f36; --sage: #8fd4c9; --leaf: #8fd4c9; --moss: #4fa89c;
  }
  html[data-farbschema="schnee"] {
    --navbg: #1c1f24; --navbg2: #2b2f36; --sage: #c9cdd3; --leaf: #f0f0f2; --moss: #5b5f66;
  }
  html[data-farbschema="fjord"] {
    --navbg: #1c1f24; --navbg2: #2b2f36; --sage: #9cc0ec; --leaf: #9cc0ec; --moss: #5b8bc9;
  }
  html[data-farbschema="bernstein"] {
    --navbg: #1c1f24; --navbg2: #2b2f36; --sage: #e6c878; --leaf: #e6c878; --moss: #c9a24d;
  }
  /* Im Dunkelmodus soll der Hauptbereich bei allen Nicht-Wald-Farbthemen ebenfalls
     neutral-anthrazit statt warm-braun sein, damit Header und Inhalt zusammenpassen. */
  html[data-dark="1"][data-farbschema] {
    --cream: #191b1f; --parchment: #24262c; --white: #2a2d33;
    --soil: #eceef0; --bark: #a7acb5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--soil); min-height: 100vh; padding-bottom: 24px; }

  .theme-btn { background: none; border: none; color: var(--leaf); font-size: 0.95rem; cursor: pointer; padding: 3px 4px; flex-shrink: 0; }
  .theme-popup { display: none; position: absolute; right: 12px; top: 54px; background: var(--white, #fff); border-radius: var(--radius-md, 10px); box-shadow: var(--shadow-md, 0 8px 26px rgba(59,47,30,0.2)); padding: 10px; z-index: 50; }
  .theme-popup.zeigen { display: flex; gap: 8px; flex-wrap: wrap; max-width: 216px; }
  .theme-swatch { width: 40px; height: 40px; border-radius: var(--radius-sm, 8px); border: 2px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; background: var(--cream); }
  .theme-swatch.aktiv { border-color: var(--moss); }
  .theme-farbe-trenner { flex-basis: 100%; height: 1px; background: rgba(0,0,0,0.08); margin: 2px 0; }
  .theme-swatch.farbe { border: 2px solid rgba(0,0,0,0.1); }
  .theme-swatch.farbe.aktiv { border-color: var(--moss); border-width: 3px; }
  .theme-farbe-custom { position: relative; overflow: hidden; background: conic-gradient(red,yellow,lime,cyan,blue,magenta,red); }
  .theme-farbe-custom-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; border: none; padding: 0; }
  .theme-foto-swatch { border: 2px dashed var(--bark); background: var(--cream); position: relative; overflow: hidden; }
  .theme-foto-input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  body.bg-kalender {
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22190%22%20height%3D%22190%22%20viewBox%3D%220%200%20190%20190%22%3E%3Cg%20opacity%3D%220.1%22%3E%3Cg%20transform%3D%22translate%2815%2C15%29%20scale%280.75%29%20rotate%28-6%29%22%3E%3Crect%20x%3D%22-16%22%20y%3D%22-14%22%20width%3D%2232%22%20height%3D%2230%22%20rx%3D%223%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22/%3E%3Cline%20x1%3D%22-16%22%20y1%3D%22-4%22%20x2%3D%2216%22%20y2%3D%22-4%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22%20stroke-linecap%3D%22round%22/%3E%3Cline%20x1%3D%22-9%22%20y1%3D%22-18%22%20x2%3D%22-9%22%20y2%3D%22-10%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22%20stroke-linecap%3D%22round%22/%3E%3Cline%20x1%3D%229%22%20y1%3D%22-18%22%20x2%3D%229%22%20y2%3D%22-10%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22%20stroke-linecap%3D%22round%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28115%2C25%29%20scale%280.7%29%20rotate%280%29%22%3E%3Ccircle%20cx%3D%220%22%20cy%3D%220%22%20r%3D%2216%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22/%3E%3Cline%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%22-9%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22%20stroke-linecap%3D%22round%22/%3E%3Cline%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%227%22%20y2%3D%224%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22%20stroke-linecap%3D%22round%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2860%2C115%29%20scale%280.7%29%20rotate%288%29%22%3E%3Crect%20x%3D%22-16%22%20y%3D%22-14%22%20width%3D%2232%22%20height%3D%2230%22%20rx%3D%223%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22/%3E%3Cline%20x1%3D%22-16%22%20y1%3D%22-4%22%20x2%3D%2216%22%20y2%3D%22-4%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22%20stroke-linecap%3D%22round%22/%3E%3Cline%20x1%3D%22-9%22%20y1%3D%22-18%22%20x2%3D%22-9%22%20y2%3D%22-10%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22%20stroke-linecap%3D%22round%22/%3E%3Cline%20x1%3D%229%22%20y1%3D%22-18%22%20x2%3D%229%22%20y2%3D%22-10%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22%20stroke-linecap%3D%22round%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    background-repeat: repeat;
  }
  body.bg-sterne {
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22190%22%20height%3D%22190%22%20viewBox%3D%220%200%20190%20190%22%3E%3Cg%20opacity%3D%220.1%22%3E%3Cg%20transform%3D%22translate%2815%2C15%29%20scale%280.75%29%20rotate%280%29%22%3E%3Cpolygon%20points%3D%220.0%2C-14.0%20-3.5%2C-4.9%20-13.3%2C-4.3%20-5.7%2C1.9%20-8.2%2C11.3%20-0.0%2C6.0%208.2%2C11.3%205.7%2C1.9%2013.3%2C-4.3%203.5%2C-4.9%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22%20stroke-linejoin%3D%22round%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28115%2C25%29%20scale%280.55%29%20rotate%2820%29%22%3E%3Cpolygon%20points%3D%220.0%2C-14.0%20-3.5%2C-4.9%20-13.3%2C-4.3%20-5.7%2C1.9%20-8.2%2C11.3%20-0.0%2C6.0%208.2%2C11.3%205.7%2C1.9%2013.3%2C-4.3%203.5%2C-4.9%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22%20stroke-linejoin%3D%22round%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2860%2C115%29%20scale%280.65%29%20rotate%28-15%29%22%3E%3Cpolygon%20points%3D%220.0%2C-14.0%20-3.5%2C-4.9%20-13.3%2C-4.3%20-5.7%2C1.9%20-8.2%2C11.3%20-0.0%2C6.0%208.2%2C11.3%205.7%2C1.9%2013.3%2C-4.3%203.5%2C-4.9%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22%20stroke-linejoin%3D%22round%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    background-repeat: repeat;
  }
  :focus-visible { outline: 2px solid var(--terracotta); outline-offset: 2px; border-radius: 4px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

  header.top { position: relative; background: linear-gradient(135deg, var(--navbg2), var(--navbg)); color: var(--leaf); padding: 8px 16px 8px; }

  header.top::after { content: ''; position: absolute; left: 0; right: 0; bottom: -3px; height: 3px; background: linear-gradient(90deg, var(--moss), var(--sage) 35%, var(--leaf) 65%, var(--moss)); opacity: 0.85; z-index: 1; }
  .top-titel-zeile { display: flex; align-items: center; justify-content: space-between; }
  header.top h1 { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; }
  .ics-btn { background: none; border: 1px solid #4a3a28; color: var(--sage); border-radius: var(--radius-pill); font-size: 0.72rem; font-weight: 600; padding: 5px 12px; cursor: pointer; }
  .view-toggle { display: flex; gap: 6px; margin-top: 10px; }
  .view-toggle button {
    flex: 1; padding: 7px; border-radius: var(--radius-pill); border: 1px solid #4a3a28;
    background: transparent; color: var(--sage); font-size: 0.75rem; font-weight: 600;
    font-family: 'Inter', sans-serif; cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .view-toggle button.active { background: var(--moss); color: var(--on-moss, var(--leaf)); border-color: var(--moss); }

  .filter-row { display: flex; gap: 6px; padding: 10px 14px 0; flex-wrap: wrap; }
  .filter-chip {
    padding: 5px 12px; border-radius: var(--radius-pill); font-size: 0.72rem; font-weight: 600;
    border: 1px solid var(--parchment); background: var(--white); color: var(--bark); cursor: pointer;
  }
  .filter-chip.active { color: var(--white); border-color: transparent; }

  main { padding: 12px 14px 90px; max-width: 1000px; margin: 0 auto; }
  @media (min-width: 1000px) {
    #wunschlisteInhalt { column-count: 2; column-gap: 22px; }
    #wunschlisteInhalt .termin-card { break-inside: avoid; }
    .cal-grid { max-width: 820px; margin: 0 auto; }
  }

  /* Kalender */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px; }
  .cal-nav button { background: none; border: 1px solid var(--parchment); border-radius: var(--radius-pill); width: 34px; height: 34px; font-size: 1rem; color: var(--moss-text, var(--moss)); cursor: pointer; }
  .cal-nav .monat-label { font-family: 'Playfair Display', serif; font-size: 1.05rem; color: var(--moss-text, var(--moss)); font-weight: 600; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-wd { text-align: center; font-size: 0.62rem; font-weight: 700; color: var(--bark); text-transform: uppercase; padding-bottom: 4px; }
  .cal-day {
    aspect-ratio: 1; background: var(--white); border-radius: var(--radius-sm); border: 1px solid var(--parchment);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 4px 2px;
    cursor: pointer; position: relative; font-size: 0.78rem; color: var(--soil); transition: all .12s;
  }
  .cal-day.andermonat { opacity: 0.35; }
  .cal-day.heute { border: 2px solid var(--terracotta); font-weight: 700; }
  .cal-day.feiertag span:first-child { color: #c0392b; font-weight: 700; }
  .cal-day.feiertag { background: #fdf1ee; }
  .cal-day:hover { box-shadow: var(--shadow-soft); }
  .cal-dots { display: flex; gap: 2px; margin-top: 3px; flex-wrap: wrap; justify-content: center; }
  .cal-dot { width: 6px; height: 6px; border-radius: 50%; }

  /* Tagesliste (Kalender als eine Spalte, jeder Tag eine Zeile) */
  .monat-label-gruppe { display: flex; align-items: center; gap: 8px; }
  .cal-nav .ansicht-umschalter { width: 30px; height: 30px; font-size: 0.9rem; }
  .tagesliste { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 3px; padding-bottom: 90px; /* Platz für den ＋-Knopf */ }
  .tl-kw { font-size: 0.66rem; font-weight: 700; color: var(--bark); text-transform: uppercase; letter-spacing: .05em; padding: 10px 2px 3px; border-bottom: 1px solid var(--parchment); margin-bottom: 3px; }
  .tl-kw:first-child { padding-top: 0; }
  .tl-tag { display: flex; gap: 10px; align-items: stretch; background: var(--white); border: 1px solid var(--parchment); border-radius: var(--radius-sm); padding: 6px 8px; cursor: pointer; min-height: 38px; }
  .tl-tag.wochenende { background: var(--parchment); }
  /* Im Dunkelmodus sind --white und --parchment fast gleich – Wochenende dort mit eigenem, leicht grünlichen Ton und Akzentkante */
  html[data-dark="1"] .tl-tag.wochenende { background: rgba(111,174,94,0.10); border-color: rgba(111,174,94,0.28); }
  .tl-tag.heute { border: 2px solid var(--terracotta); }
  .tl-tag.feiertag { background: #fdf1ee; }
  html[data-dark="1"] .tl-tag.feiertag { background: #3a2622; }
  .tl-datum { width: 46px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  .tl-wd { font-size: 0.62rem; font-weight: 700; color: var(--bark); text-transform: uppercase; }
  .tl-nr { font-size: 1.05rem; font-weight: 700; color: var(--soil); }
  .tl-tag.feiertag .tl-nr, .tl-tag.feiertag .tl-wd { color: #c0392b; }
  .tl-inhalt { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
  .tl-feiertag { font-size: 0.68rem; color: #c0392b; font-weight: 600; }
  .tl-termin { display: flex; gap: 8px; align-items: baseline; font-size: 0.82rem; color: var(--soil); border-left: 3px solid var(--moss); padding: 2px 0 2px 7px; border-radius: 2px; }
  .tl-termin .tl-zeit { font-size: 0.7rem; font-weight: 700; color: var(--bark); min-width: 38px; flex-shrink: 0; }
  .tl-termin .tl-titel { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-leer { font-size: 0.75rem; color: var(--bark); opacity: 0.45; }

  /* Liste */
  .tag-gruppe { margin-bottom: 14px; }
  .tag-titel { font-size: 0.72rem; font-weight: 700; color: var(--bark); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; padding-left: 2px; }
  /* Wunsch-Karten: untereinander statt nebeneinander (mehr Platz für den Namen) */
  #wunschlisteInhalt .termin-card { display: block; }
  .termin-card {
    background: var(--white); border-radius: var(--radius-md); padding: 11px 13px; margin-bottom: 8px;
    box-shadow: var(--shadow-soft); border-left: 4px solid var(--moss); display: flex; gap: 10px; align-items: flex-start;
    cursor: pointer;
  }
  .termin-zeit { font-size: 0.72rem; font-weight: 700; color: var(--bark); min-width: 44px; padding-top: 1px; }
  .termin-info { flex: 1; }
  .termin-titel { font-size: 0.88rem; font-weight: 600; margin-bottom: 2px; }
  .termin-meta { font-size: 0.72rem; color: var(--bark); display: flex; gap: 8px; flex-wrap: wrap; }
  .wer-badge { display: inline-block; font-size: 0.62rem; font-weight: 700; padding: 1px 8px; border-radius: var(--radius-pill); color: var(--white); }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--soil); font-weight: 500; }
  .empty-state .em { font-size: 2.4rem; display: block; margin-bottom: 10px; }

  /* FAB */
  .fab {
    position: fixed; bottom: 20px; right: 18px; width: 54px; height: 54px; border-radius: 50%;
    background: var(--terracotta); color: var(--white); font-size: 1.6rem; border: none;
    box-shadow: var(--shadow-md); cursor: pointer; z-index: 40; display: flex; align-items: center; justify-content: center;
  }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(30,23,14,0.5); z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-bg.zeigen { display: flex; }
  .modal { background: var(--white); border-radius: var(--radius-lg); padding: 22px; width: min(400px, 100%); max-height: 88vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.22); }
  .modal h2 { font-family: 'Playfair Display', serif; color: var(--moss-text, var(--moss)); margin-bottom: 14px; font-size: 1.05rem; }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--bark); margin-bottom: 4px; }
  .form-row input, .form-row select, .form-row textarea {
    border: 1px solid var(--parchment); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 0.85rem;
    font-family: 'Inter', sans-serif; color: var(--soil); background: var(--cream); width: 100%;
  }
  .form-row textarea { resize: vertical; min-height: 50px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chip-select { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip-select .opt {
    padding: 6px 13px; border-radius: var(--radius-pill); font-size: 0.75rem; font-weight: 600;
    border: 1px solid var(--parchment); background: var(--cream); color: var(--bark); cursor: pointer;
  }
  .chip-select .opt.active { color: var(--white); border-color: transparent; }
  .check-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .check-row input { width: auto; }
  .btn-primary { background: var(--moss); color: var(--on-moss, var(--white)); border: none; border-radius: var(--radius-pill); padding: 10px; font-size: 0.85rem; font-weight: 700; cursor: pointer; width: 100%; font-family: 'Inter', sans-serif; }
  .btn-secondary { background: transparent; color: var(--moss-text, var(--moss)); border: 1px solid var(--moss); border-radius: var(--radius-pill); padding: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px; font-family: 'Inter', sans-serif; }
  .btn-delete { background: transparent; color: var(--terracotta); border: 1px solid var(--terracotta); border-radius: var(--radius-pill); padding: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px; font-family: 'Inter', sans-serif; }
  .modal-actions { display: flex; gap: 8px; margin-top: 4px; }

  /* Sehr breite Bildschirme: Content etwas breiter + dezente Deko-Streifen im Rand */
  .deko-rand { display: none; position: fixed; top: 0; bottom: 0; width: 220px; background-repeat: repeat-y; background-position: center top; pointer-events: none; z-index: -1; }
  .deko-rand.links { left: 0; }
  .deko-rand.rechts { right: 0; transform: scaleX(-1); }
  @media (min-width: 1600px) {
    main { max-width: 1280px; }

  <script>
  // ---------- HANDY-ZURÜCK-TASTE ABFANGEN ----------
  // Ohne eigene Behandlung navigiert der native Zurück-Knopf des Smartphones durch die
  // Browser-Historie "hindurch" und die App landet auf einer leeren Zwischenseite.
  // Stattdessen: schließt zuerst jedes offene Fenster/Popup; ist nichts offen, passiert
  // bewusst gar nichts (statt die App zu verlassen bzw. leerzuräumen).
  function zurueckTasteUeberlagerungenSchliessen() {
    let geschlossen = false;
    document.querySelectorAll('.modal-bg, .theme-popup').forEach(el => {
      const sichtbar = el.style.display === 'flex' || el.style.display === 'block' || el.classList.contains('zeigen');
      if (sichtbar) { el.style.display = 'none'; el.classList.remove('zeigen'); geschlossen = true; }
    });
    return geschlossen;
  }
  try {
    history.pushState({ zurueckBasis: true }, '', location.href);
    window.addEventListener('popstate', function () {
      zurueckTasteUeberlagerungenSchliessen();
      history.pushState({ zurueckBasis: true }, '', location.href);
    });
  } catch (e) {}
  // ---------- KURZE STATUSMELDUNG (TOAST), optional mit Rückgängig-Aktion ----------
  function showTempStatus(text, sekunden, optionen) {
    optionen = optionen || {};
    let el = document.getElementById('tempStatus');
    if (!el) { el = document.createElement('div'); el.id = 'tempStatus'; document.body.appendChild(el); }
    el.style.cssText =
      'position:fixed;left:50%;bottom:24px;transform:translate(-50%,0);' +
      'background:#2a2016;color:#bcd196;padding:10px 18px;border-radius:22px;' +
      'font-size:0.85rem;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,0.25);' +
      'opacity:1;pointer-events:' + (optionen.rueckgaengig ? 'auto' : 'none') + ';transition:opacity .2s, transform .2s;z-index:9999;' +
      'max-width:88vw;text-align:center;font-family:Inter,system-ui,sans-serif;' +
      'display:flex;align-items:center;gap:12px;';
    el.innerHTML = '';
    const textSpan = document.createElement('span');
    textSpan.textContent = text;
    el.appendChild(textSpan);
    if (typeof optionen.rueckgaengig === 'function') {
      const btn = document.createElement('button');
      btn.textContent = 'Rückgängig';
      btn.style.cssText = 'background:none;border:none;color:#e8c98a;font-weight:700;font-size:0.85rem;cursor:pointer;padding:2px 4px;flex-shrink:0;text-decoration:underline;';
      btn.addEventListener('click', () => {
        clearTimeout(el._timeout);
        try { optionen.rueckgaengig(); } catch (e) { console.warn('showTempStatus: Rückgängig-Aktion fehlgeschlagen', e); }
        el.style.opacity = '0';
        el.style.transform = 'translate(-50%,20px)';
      });
      el.appendChild(btn);
    }
    clearTimeout(el._timeout);
    el._timeout = setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translate(-50%,20px)';
    }, (sekunden || 2.5) * 1000);
  }

  function __pullToRefreshModalOffen() {
    return !!document.querySelector('.modal-bg.zeigen') ||
      Array.from(document.querySelectorAll('.modal-bg')).some(el => el.style.display === 'flex' || el.style.display === 'block');
  }
  // ---------- PULL-TO-REFRESH (von oben nach unten wischen) ----------
  (function () {
    let startY = 0, ziehend = false, ausgeloest = false;
    const SCHWELLE = 130;
    let indikator = null;
    function indikatorZeigen(strecke) {
      if (!indikator) {
        indikator = document.createElement('div');
        indikator.id = '__pullToRefreshIndikator';
        indikator.style.cssText =
          'position:fixed;top:8px;left:50%;transform:translate(-50%,-40px) rotate(0deg);' +
          'width:34px;height:34px;border-radius:50%;background:#2a2016;color:#bcd196;' +
          'display:flex;align-items:center;justify-content:center;font-size:1.1rem;' +
          'z-index:9998;transition:opacity .15s;box-shadow:0 3px 10px rgba(0,0,0,0.25);opacity:0;';
        document.body.appendChild(indikator);
      }
      const anteil = Math.min(1, strecke / SCHWELLE);
      indikator.style.opacity = String(anteil);
      indikator.style.transform = 'translate(-50%,' + (-40 + anteil * 56) + 'px) rotate(' + (anteil * 180) + 'deg)';
      indikator.textContent = anteil >= 1 ? '↻' : '↓';
    }
    function indikatorAusblenden() { if (indikator) indikator.style.opacity = '0'; }
    document.addEventListener('touchstart', (e) => {
      if (window.scrollY > 0 || e.touches.length !== 1 || __pullToRefreshModalOffen()) { ziehend = false; return; }
      startY = e.touches[0].clientY; ziehend = true; ausgeloest = false;
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      if (!ziehend) return;
      const strecke = e.touches[0].clientY - startY;
      if (strecke <= 0) { indikatorAusblenden(); return; }
      if (window.scrollY > 0 || __pullToRefreshModalOffen()) { ziehend = false; indikatorAusblenden(); return; }
      indikatorZeigen(strecke);
      if (strecke >= SCHWELLE) ausgeloest = true;
    }, { passive: true });
    document.addEventListener('touchend', () => {
      if (ziehend && ausgeloest) {
        if (indikator) { indikator.textContent = '↻'; indikator.style.opacity = '1'; }
        location.reload();
      } else { indikatorAusblenden(); }
      ziehend = false;
    }, { passive: true });
  })();
  (function(){
    // ============================================================
    // 🎁 WUNSCHLISTE – eigenes Modul (bis v413 ein Reiter in „Termine“).
    // Die Daten bleiben unverändert im Schlüssel 'termine_wunschliste' und im
    // Cloud-Dokument „termine“ – so ging beim Umzug nichts verloren.
    // ============================================================
    const WER_OPTIONEN = window.PLANER_PERSONEN || [
      { id: 'familie', label: 'Familie', farbe: '#4f6f45' },
      { id: 'mama',    label: 'Mama',    farbe: '#c46b41' },
      { id: 'papa',    label: 'Papa',    farbe: '#5b8bb5' },
    ];
    let aktiverFilter = 'alle';
    function escapeHtml(s) {
      const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML;
    }

    // --- Filter-Chips ---
    const filterRow = document.getElementById('filterRow');
    function renderFilter() {
      filterRow.innerHTML = '';
      const alle = document.createElement('button');
      alle.className = 'filter-chip' + (aktiverFilter==='alle' ? ' active' : '');
      alle.textContent = 'Alle';
      alle.style.background = aktiverFilter==='alle' ? 'var(--soil)' : '';
      alle.addEventListener('click', () => { aktiverFilter='alle'; renderFilter(); renderWunschliste(); });
      filterRow.appendChild(alle);
      WER_OPTIONEN.forEach(w => {
        const chip = document.createElement('button');
        chip.className = 'filter-chip' + (aktiverFilter===w.id ? ' active' : '');
        chip.textContent = w.label;
        if (aktiverFilter===w.id) chip.style.background = w.farbe;
        chip.addEventListener('click', () => { aktiverFilter=w.id; renderFilter(); renderWunschliste(); });
        filterRow.appendChild(chip);
      });
    }

    // ============================================================
    // WUNSCHLISTE (Geburtstage, Weihnachten, Ostern & Co.)
    // ============================================================
    const KEY_WUNSCHLISTE = 'termine_wunschliste';
    function ladenWunschliste() {
      try { const raw = localStorage.getItem(KEY_WUNSCHLISTE); return raw ? JSON.parse(raw) : []; } catch(e) { return []; }
    }
    function speichernWunschliste(arr) {
      try { localStorage.setItem(KEY_WUNSCHLISTE, JSON.stringify(arr)); } catch(e) {}
      if (window._sync) window._sync.melde();
    }
    let wunschliste = ladenWunschliste();
    const ANLAESSE = [
      { id: 'geburtstag', label: '🎂 Geburtstag' },
      { id: 'weihnachten', label: '🎄 Weihnachten' },
      { id: 'ostern', label: '🐣 Ostern' },
      { id: 'sonstiges', label: '✨ Sonstiges' },
    ];
    let anlassFilter = 'alle';
    function anlassLabel(id) { const a = ANLAESSE.find(x=>x.id===id); return a ? a.label : id; }
    function personLabel(id) { const p = WER_OPTIONEN.find(x=>x.id===id); return p ? p.label : id; }
    function personFarbe(id) { const p = WER_OPTIONEN.find(x=>x.id===id); return p ? p.farbe : 'var(--moss)'; }

    function renderAnlassFilter() {
      const box = document.getElementById('anlassFilterRow');
      box.innerHTML = '';
      const alle = document.createElement('button');
      alle.className = 'opt' + (anlassFilter==='alle' ? ' active' : '');
      alle.textContent = 'Alle Anlässe';
      if (anlassFilter==='alle') alle.style.background = 'var(--soil)';
      alle.addEventListener('click', () => { anlassFilter='alle'; renderAnlassFilter(); renderWunschliste(); });
      box.appendChild(alle);
      ANLAESSE.forEach(a => {
        const btn = document.createElement('button');
        btn.className = 'opt' + (anlassFilter===a.id ? ' active' : '');
        btn.textContent = a.label;
        if (anlassFilter===a.id) btn.style.background = 'var(--moss)';
        btn.addEventListener('click', () => { anlassFilter=a.id; renderAnlassFilter(); renderWunschliste(); });
        box.appendChild(btn);
      });
    }

    let wunschGruppierung = 'keine';
    let wunschSortierung = 'alpha';
    function wunschPreisZahl(w) {
      const treffer = (w.preis || '').match(/[\d]+(?:[.,]\d+)?/);
      if (!treffer) return -1; // ohne erkennbaren Preis ans Ende
      return parseFloat(treffer[0].replace(',', '.'));
    }
    function wunschSortFn(a, b) {
      if (wunschSortierung === 'preis') return wunschPreisZahl(b) - wunschPreisZahl(a);
      if (wunschSortierung === 'event') return ANLAESSE.findIndex(x=>x.id===a.anlass) - ANLAESSE.findIndex(x=>x.id===b.anlass) || (a.name||'').localeCompare(b.name||'','de');
      return (a.name||'').localeCompare(b.name||'','de');
    }
    function wunschGruppenSchluessel(w) {
      if (wunschGruppierung === 'jahr') return w.jahr ? String(w.jahr) : 'Ohne Jahr';
      if (wunschGruppierung === 'event') return anlassLabel(w.anlass);
      if (wunschGruppierung === 'name') return personLabel(w.person);
      return '';
    }
    function wunschGruppenReihenfolge(schluessel) {
      if (wunschGruppierung === 'jahr') {
        return schluessel.slice().sort((a,b) => {
          if (a === 'Ohne Jahr') return 1;
          if (b === 'Ohne Jahr') return -1;
          return Number(b) - Number(a); // neuestes/zukünftiges Jahr zuerst
        });
      }
      if (wunschGruppierung === 'event') {
        return schluessel.slice().sort((a,b) => ANLAESSE.findIndex(x=>x.label===a) - ANLAESSE.findIndex(x=>x.label===b));
      }
      if (wunschGruppierung === 'name') {
        return schluessel.slice().sort((a,b) => {
          const ia = WER_OPTIONEN.findIndex(x=>x.label===a), ib = WER_OPTIONEN.findIndex(x=>x.label===b);
          return ia - ib;
        });
      }
      return schluessel;
    }
    function wunschKarteHtml(w) {
      const prioIcon = w.prioritaet==='hoch' ? '🔴' : w.prioritaet==='niedrig' ? '🟢' : '🟡';
      const linkHtml = w.link ? `<a href="${escapeHtml(w.link)}" target="_blank" rel="noopener" style="font-size:0.75rem;color:var(--moss)">🔗 Link öffnen</a>` : '';
      return `<div class="termin-card" data-id="${w.id}" style="cursor:pointer;${w.reserviert?'opacity:0.65':''}">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="background:${personFarbe(w.person)};color:#fff;border-radius:12px;padding:2px 9px;font-size:0.7rem;font-weight:600">${escapeHtml(personLabel(w.person))}</span>
          <span style="font-size:0.75rem">${anlassLabel(w.anlass)}</span>
          ${w.jahr ? `<span style="font-size:0.7rem;opacity:0.65">${escapeHtml(w.jahr)}</span>` : ''}
          <span>${prioIcon}</span>
          ${w.reserviert ? '<span style="font-size:0.7rem;background:#e4efe0;color:var(--moss);border-radius:10px;padding:1px 8px">✅ reserviert' + (w.reserviertVon ? ' von ' + escapeHtml(personLabel(w.reserviertVon)) : '') + '</span>' : ''}
          ${w.versteckenVor && w.versteckenVor.length ? '<span style="font-size:0.7rem;background:#f3e6c9;color:#8a6a1f;border-radius:10px;padding:1px 8px">🔒 versteckt vor ' + w.versteckenVor.map(personLabel).map(escapeHtml).join(', ') + '</span>' : ''}
        </div>
        <div style="font-weight:700;margin-top:4px">${escapeHtml(w.name)}${w.preis ? ' <span style="font-weight:400;opacity:0.7;font-size:0.8rem">· ca. ' + escapeHtml(w.preis) + '</span>' : ''}</div>
        ${w.notiz ? `<div style="font-size:0.8rem;opacity:0.8;margin-top:2px">${escapeHtml(w.notiz)}</div>` : ''}
        ${linkHtml ? `<div style="margin-top:4px">${linkHtml}</div>` : ''}
      </div>`;
    }
    function geraetIdentitaet() {
      try { return localStorage.getItem('planer_geraetIdentitaet') || ''; } catch (e) { return ''; }
    }
    function renderWunschliste() {
      renderAnlassFilter();
      const box = document.getElementById('wunschlisteInhalt');
      let liste = wunschliste.slice();
      if (aktiverFilter !== 'alle') liste = liste.filter(w => w.person === aktiverFilter);
      if (anlassFilter !== 'alle') liste = liste.filter(w => w.anlass === anlassFilter);
      const meineIdentitaet = geraetIdentitaet();
      if (meineIdentitaet) liste = liste.filter(w => !w.versteckenVor || !w.versteckenVor.includes(meineIdentitaet));

      if (!liste.length) {
        box.innerHTML = '<p style="opacity:0.6;font-size:0.85rem;padding:14px 0">Noch keine Wünsche erfasst.</p>';
      } else if (wunschGruppierung === 'keine') {
        liste.sort(wunschSortFn);
        box.innerHTML = liste.map(wunschKarteHtml).join('');
      } else {
        const gruppen = {};
        liste.forEach(w => { const k = wunschGruppenSchluessel(w); (gruppen[k] = gruppen[k] || []).push(w); });
        const reihenfolge = wunschGruppenReihenfolge(Object.keys(gruppen));
        box.innerHTML = reihenfolge.map(schluessel => {
          const eintraege = gruppen[schluessel].slice().sort(wunschSortFn);
          return `<details class="wunsch-gruppe" open>
            <summary>${escapeHtml(schluessel)} <span class="wunsch-gruppe-anzahl">(${eintraege.length})</span></summary>
            ${eintraege.map(wunschKarteHtml).join('')}
          </details>`;
        }).join('');
      }
      box.querySelectorAll('.termin-card').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.tagName === 'A') return;
          wunschFormOeffnen(el.dataset.id);
        });
      });
      renderWunschAggregation();
    }
    document.getElementById('wunschGruppierung').addEventListener('change', (e) => { wunschGruppierung = e.target.value; renderWunschliste(); });
    document.getElementById('wunschSortierung').addEventListener('change', (e) => { wunschSortierung = e.target.value; renderWunschliste(); });

    // --- Sammelübersicht: liest (nur lesend) aus Garten- und Gaming-Wunschlisten mit ---
    function renderWunschAggregation() {
      const box = document.getElementById('wunschlisteAggregation');
      let html = '';
      try {
        const gartenListe = JSON.parse(localStorage.getItem('gartenplaner_wishlist') || '[]').filter(g => !g.gekauft);
        if (gartenListe.length) {
          html += '<div class="sidebar-title" style="margin:18px 0 8px">🌱 Aus der Garten-Wunschliste</div>';
          html += gartenListe.map(g => `<div class="termin-card">${escapeHtml(g.name)}${g.variety ? ' – ' + escapeHtml(g.variety) : ''}${g.preis ? ' · ca. ' + escapeHtml(g.preis) : ''}</div>`).join('');
          html += '<p style="font-size:0.7rem;opacity:0.6">Bearbeiten im Garten-Modul (Shops &amp; Dienstleister → Wunschliste).</p>';
        }
      } catch(e) {}
      try {
        const spieleListe = JSON.parse(localStorage.getItem('gaming_spiele') || '[]').filter(s => s.status === 'wunschliste');
        if (spieleListe.length) {
          html += '<div class="sidebar-title" style="margin:18px 0 8px">🎮 Aus der Gaming-Wunschliste</div>';
          html += spieleListe.map(s => `<div class="termin-card">${escapeHtml(s.titel)}${s.person ? ' – ' + escapeHtml(personLabel(s.person)) : ''}${s.geschaetzteDauer ? ' · ca. ' + escapeHtml(s.geschaetzteDauer) + ' Std.' : ''}</div>`).join('');
          html += '<p style="font-size:0.7rem;opacity:0.6">Bearbeiten im Gaming-Modul.</p>';
        }
      } catch(e) {}
      box.innerHTML = html;
    }

    // --- Formular ---
    let wunschEditPerson = 'familie', wunschEditAnlass = 'geburtstag', wunschEditReserviertVon = 'familie';
    let wunschEditVersteckenVor = [];
    function optReiheRendernLokal(boxId, optionen, aktiv, onSelect, labelKey, idKey) {
      const box = document.getElementById(boxId);
      box.innerHTML = '';
      optionen.forEach(o => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'opt' + (o[idKey]===aktiv ? ' active' : '');
        btn.textContent = o[labelKey];
        if (o[idKey]===aktiv) btn.style.background = o.farbe || 'var(--moss)';
        btn.addEventListener('click', () => onSelect(o[idKey]));
        box.appendChild(btn);
      });
    }
    function renderWunschPersonReihe() { optReiheRendernLokal('wunschPersonReihe', WER_OPTIONEN, wunschEditPerson, (id)=>{wunschEditPerson=id;renderWunschPersonReihe();}, 'label', 'id'); }
    function renderWunschAnlassReihe() { optReiheRendernLokal('wunschAnlassReihe', ANLAESSE, wunschEditAnlass, (id)=>{wunschEditAnlass=id;renderWunschAnlassReihe();}, 'label', 'id'); }
    function renderWunschReserviertVonReihe() { optReiheRendernLokal('wunschReserviertVonReihe', WER_OPTIONEN, wunschEditReserviertVon, (id)=>{wunschEditReserviertVon=id;renderWunschReserviertVonReihe();}, 'label', 'id'); }
    function renderWunschVersteckenReihe() {
      const box = document.getElementById('wunschVersteckenReihe');
      box.innerHTML = '';
      WER_OPTIONEN.forEach(o => {
        const btn = document.createElement('button');
        btn.type = 'button';
        const aktiv = wunschEditVersteckenVor.includes(o.id);
        btn.className = 'opt' + (aktiv ? ' active' : '');
        btn.textContent = o.label;
        if (aktiv) btn.style.background = o.farbe || 'var(--moss)';
        btn.addEventListener('click', () => {
          if (wunschEditVersteckenVor.includes(o.id)) {
            wunschEditVersteckenVor = wunschEditVersteckenVor.filter(x => x !== o.id);
          } else {
            wunschEditVersteckenVor.push(o.id);
          }
          renderWunschVersteckenReihe();
        });
        box.appendChild(btn);
      });
    }

    document.getElementById('wunschReserviert').addEventListener('change', (e) => {
      document.getElementById('wunschReserviertVonFeld').style.display = e.target.checked ? '' : 'none';
    });

    function wunschFormOeffnen(id) {
      const w = id ? wunschliste.find(x=>x.id===id) : null;
      document.getElementById('wunschModalTitel').textContent = w ? 'Wunsch bearbeiten' : 'Neuer Wunsch';
      document.getElementById('wunschId').value = id || '';
      document.getElementById('wunschName').value = w ? w.name : '';
      document.getElementById('wunschPreis').value = w ? (w.preis||'') : '';
      document.getElementById('wunschJahr').value = w ? (w.jahr||'') : '';
      document.getElementById('wunschPrioritaet').value = w ? (w.prioritaet||'mittel') : 'mittel';
      document.getElementById('wunschLink').value = w ? (w.link||'') : '';
      document.getElementById('wunschNotiz').value = w ? (w.notiz||'') : '';
      document.getElementById('wunschReserviert').checked = w ? !!w.reserviert : false;
      document.getElementById('wunschReserviertVonFeld').style.display = (w && w.reserviert) ? '' : 'none';
      wunschEditPerson = w ? w.person : (aktiverFilter!=='alle' ? aktiverFilter : 'familie');
      wunschEditAnlass = w ? w.anlass : (anlassFilter !== 'alle' ? anlassFilter : 'geburtstag');
      wunschEditReserviertVon = w ? (w.reserviertVon || 'familie') : 'familie';
      wunschEditVersteckenVor = w && Array.isArray(w.versteckenVor) ? w.versteckenVor.slice() : [];
      renderWunschPersonReihe(); renderWunschAnlassReihe(); renderWunschReserviertVonReihe(); renderWunschVersteckenReihe();
      document.getElementById('btnWunschLoeschen').style.display = w ? '' : 'none';
      document.getElementById('wunschModal').style.display = 'flex';
    }
    document.getElementById('btnWunschHinzufuegen').addEventListener('click', () => wunschFormOeffnen(null));
    document.getElementById('btnWunschAbbrechen').addEventListener('click', () => document.getElementById('wunschModal').style.display='none');
    document.getElementById('wunschModal').addEventListener('click', (e) => { if (e.target.id==='wunschModal') e.currentTarget.style.display='none'; });
    document.getElementById('btnWunschSpeichern').addEventListener('click', () => {
      const name = document.getElementById('wunschName').value.trim();
      if (!name) { alert('Bitte einen Namen für den Wunsch eingeben.'); return; }
      const id = document.getElementById('wunschId').value;
      const daten = {
        person: wunschEditPerson, anlass: wunschEditAnlass, name,
        preis: document.getElementById('wunschPreis').value.trim(),
        jahr: document.getElementById('wunschJahr').value.trim(),
        prioritaet: document.getElementById('wunschPrioritaet').value,
        link: document.getElementById('wunschLink').value.trim(),
        notiz: document.getElementById('wunschNotiz').value.trim(),
        reserviert: document.getElementById('wunschReserviert').checked,
        reserviertVon: document.getElementById('wunschReserviert').checked ? wunschEditReserviertVon : '',
        versteckenVor: wunschEditVersteckenVor.slice(),
      };
      if (id) {
        const w = wunschliste.find(x=>x.id===id);
        if (w) Object.assign(w, daten);
      } else {
        daten.id = 'wunsch_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
        wunschliste.push(daten);
      }
      speichernWunschliste(wunschliste);
      document.getElementById('wunschModal').style.display='none';
      renderWunschliste();
    });
    document.getElementById('btnWunschLoeschen').addEventListener('click', () => {
      const id = document.getElementById('wunschId').value;
      if (!id) return;
      const index = wunschliste.findIndex(x => x.id === id);
      if (index === -1) return;
      const entfernt = wunschliste[index];
      wunschliste.splice(index, 1);
      speichernWunschliste(wunschliste);
      document.getElementById('wunschModal').style.display='none';
      renderWunschliste();
      showTempStatus('Gelöscht: „' + entfernt.name + '"', 6, {
        rueckgaengig: () => { wunschliste.splice(index, 0, entfernt); speichernWunschliste(wunschliste); renderWunschliste(); }
      });
    });

    renderFilter();
    renderWunschliste();

    // ＋ Schnell festhalten / Homescreen-Kurzbefehl: neuen Wunsch anlegen (Text vorausgefüllt)
    window.addEventListener('message', (e) => {
      if (e.origin !== window.location.origin || !e.data || e.data.type !== 'shortcutAktion') return;
      if (e.data.aktion === 'zeige' && e.data.ziel && wunschliste.some(w => w.id === e.data.ziel)) { wunschFormOeffnen(e.data.ziel); return; }
      if (e.data.aktion === 'neu') { wunschFormOeffnen(null); if (e.data.text) document.getElementById('wunschName').value = e.data.text; }
    });

    if (window.PlanerSync) {
      // Gleiches Cloud-Dokument wie bisher („termine“), aber nur der Wunschlisten-Schlüssel
      window._sync = window.PlanerSync.starteSync({
        modul: 'termine',
        keys: [KEY_WUNSCHLISTE],
        onRemoteChange: function () { wunschliste = ladenWunschliste(); renderWunschliste(); },
      });
    }
  })();
  </script>

<script>
(function() {
  var KEY_THEME = 'wunschliste_hintergrundThema';
  var KEY_FOTO = KEY_THEME.replace('hintergrundThema', 'hintergrundBildEigenes');
  var klassen = ['bg-kalender', 'bg-sterne'];
  function themeAnwenden(id) {
    document.body.classList.remove.apply(document.body.classList, klassen);
    document.body.style.backgroundColor = '';
    document.body.style.backgroundImage = '';
    document.body.style.backgroundSize = '';
    document.body.style.backgroundPosition = '';
    document.body.style.backgroundRepeat = '';
    var eigenesFoto = '';
    try { eigenesFoto = localStorage.getItem(KEY_FOTO) || ''; } catch(e) {}
    if (id === 'foto' && eigenesFoto) {
      document.body.style.backgroundImage = 'linear-gradient(rgba(250,246,236,0.82),rgba(250,246,236,0.82)), url("' + eigenesFoto + '")';
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center';
      document.body.style.backgroundRepeat = 'no-repeat';
    }
    else if (id && id.indexOf('farbe:') === 0) { document.body.style.backgroundColor = id.slice(6) + 'b3'; }
    else if (id) document.body.classList.add(id);
    document.querySelectorAll('.theme-swatch').forEach(function(s) { s.classList.toggle('aktiv', s.dataset.theme === id); });
  }
  var aktivesTheme = '';
  try { aktivesTheme = localStorage.getItem(KEY_THEME) || ''; } catch(e) {}
  themeAnwenden(aktivesTheme);
  var customFarbeInput = document.querySelector('.theme-farbe-custom-input');
  if (customFarbeInput) {
    customFarbeInput.addEventListener('input', function() {
      var neueId = 'farbe:' + customFarbeInput.value;
      themeAnwenden(neueId);
      try { localStorage.setItem(KEY_THEME, neueId); } catch(e) {}
    });
  }
  var fotoInput = document.querySelector('.theme-foto-input');
  if (fotoInput) {
    fotoInput.addEventListener('change', function(e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        var img = new Image();
        img.onload = function() {
          var maxW = 900;
          var scale = Math.min(1, maxW / img.width);
          var canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          var dataUrl = canvas.toDataURL('image/jpeg', 0.65);
          try {
            localStorage.setItem(KEY_FOTO, dataUrl);
            localStorage.setItem(KEY_THEME, 'foto');
          } catch(err) { alert('Foto konnte nicht gespeichert werden (evtl. zu groß oder Speicher voll).'); return; }
          themeAnwenden('foto');
        };
        img.onerror = function() { alert('Datei ist kein gültiges Bild.'); };
        img.src = ev.target.result;
      };
      reader.onerror = function() { alert('Foto konnte nicht gelesen werden.'); };
      reader.readAsDataURL(file);
    });
  }
  var btn = document.getElementById('btnThemeAuswahl');
  var popup = document.getElementById('themePopup');
  if (btn && popup) {
    btn.addEventListener('click', function() { popup.classList.toggle('zeigen'); });
    document.querySelectorAll('.theme-swatch:not(.theme-farbe-custom):not(.theme-foto-swatch)').forEach(function(swatch) {
      swatch.addEventListener('click', function() {
        var id = swatch.dataset.theme;
        themeAnwenden(id);
        try { localStorage.setItem(KEY_THEME, id); } catch(e) {}
        popup.classList.remove('zeigen');
      });
    });
    document.addEventListener('click', function(e) {
      if (popup.classList.contains('zeigen') && !popup.contains(e.target) && e.target.id !== 'btnThemeAuswahl') {
        popup.classList.remove('zeigen');
      }
    });
  }
})();
</script>
</body>
</html>
