<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --soil: #3a2e1f; --moss: #4f6f45; --sage: #7fa476; --leaf: #bcd196;
    --cream: #faf6ec; --parchment: #ece0c7; --bark: #7d6339;

    --white: #fffdf8; --navbg: #2a2016; --navbg2: #3a2e1f;
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 18px; --radius-pill: 22px;
    --shadow-soft: 0 2px 10px rgba(59,47,30,0.08); --shadow-md: 0 8px 26px rgba(59,47,30,0.2);
  }
  html[data-dark="1"] {

    --terracotta: #d9855a; --terracotta-text: #e8a37e; --sky: #7fa8cc; --gold: #dcb158;
    --white: #2f2a22; --navbg: #14100c; --navbg2: #221a12;
  }

  /* ---- Farbschemata (global, familienweit synchronisiert) ---- */
  html[data-farbschema="ozean"] {
    --navbg: #1c1f24; --navbg2: #2b2f36; --sage: #8fd4c9; --leaf: #8fd4c9; --moss: #4fa89c;
  }
  html[data-farbschema="schnee"] {
    --navbg: #1c1f24; --navbg2: #2b2f36; --sage: #c9cdd3; --leaf: #f0f0f2; --moss: #5b5f66;
  }
  html[data-farbschema="fjord"] {
    --navbg: #1c1f24; --navbg2: #2b2f36; --sage: #9cc0ec; --leaf: #9cc0ec; --moss: #5b8bc9;

  html[data-farbschema="bernstein"] {

  /* Im Dunkelmodus soll der Hauptbereich bei allen Nicht-Wald-Farbthemen ebenfalls
     neutral-anthrazit statt warm-braun sein, damit Header und Inhalt zusammenpassen. */
  html[data-dark="1"][data-farbschema] {
    --cream: #191b1f; --parchment: #24262c; --white: #2a2d33;
    --soil: #eceef0; --bark: #a7acb5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--soil); min-height: 100vh; padding-bottom: 40px; }
  /* Nichts darf breiter als der Bildschirm werden – sonst lässt sich die ganze Seite seitlich wegschieben */
  html, body { overflow-x: hidden; max-width: 100%; }

  header.top { position: relative; background: linear-gradient(135deg, var(--navbg2), var(--navbg)); color: var(--leaf); padding: 6px 12px 0; }

  .titel-zeile { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 8px; }

  .theme-popup { display: none; position: absolute; right: 12px; top: 54px; background: var(--white); border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: 10px; z-index: 50; }
  .theme-popup.zeigen { display: flex; gap: 8px; flex-wrap: wrap; max-width: 216px; }

  .theme-swatch.aktiv { border-color: var(--moss); }
  .theme-farbe-trenner { flex-basis: 100%; height: 1px; background: rgba(0,0,0,0.08); margin: 2px 0; }

  }

  .theme-foto-swatch { border: 2px dashed var(--bark); background: var(--cream); position: relative; overflow: hidden; }
  .theme-foto-input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

  /* Reiter-Leiste: bei wenig Platz seitlich wischbar statt die Seite zu verbreitern */
  .view-toggle { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .view-toggle::-webkit-scrollbar { display: none; }
  .view-toggle button {
    flex: 1 0 auto; padding: 8px 12px; border-radius: var(--radius-pill); border: 1px solid #4a3a28;
    background: transparent; color: var(--sage); font-size: 0.78rem; font-weight: 600;
    font-family: 'Inter', sans-serif; cursor: pointer; white-space: nowrap;
  }
  .view-toggle button.active { background: var(--moss); color: var(--on-moss, var(--leaf)); border-color: var(--moss); }

  main { padding: 14px; }
  .filter-chip { flex: 0 0 auto; background: transparent; border: 1px solid var(--parchment); color: var(--bark); font-size: 0.72rem; font-weight: 600; padding: 6px 13px; border-radius: var(--radius-pill); cursor: pointer; white-space: nowrap; }
  .filter-chip.active { background: var(--moss); color: var(--on-moss, var(--leaf)); border-color: var(--moss); }
  .filter-reihe { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; scrollbar-width: none; margin-bottom: 10px; }
  .filter-reihe::-webkit-scrollbar { display: none; }

  .einstellungen-box { display:none; background: var(--parchment); border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 10px; }
  .einstellungen-box label { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:0.85rem; }

  .leer-hinweis { text-align: center; color: var(--soil); font-size: 0.85rem; padding: 46px 16px; font-weight: 500; }
  .leer-hinweis .em { font-size: 2.2rem; display: block; margin-bottom: 8px; }

  .news-eintrag { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--parchment); }
  .news-eintrag img { width:56px; height:56px; object-fit:cover; border-radius:8px; flex-shrink:0; }
  .news-eintrag a { color: var(--moss-text, var(--moss)); font-weight:600; text-decoration:none; font-size:0.9rem; }
  .news-eintrag.gelesen a { color: var(--bark); font-weight:500; opacity:0.75; }
  .news-eintrag .datum { font-size:0.7rem; color: var(--bark); opacity:0.85; margin-top:2px; }
  .news-eintrag .news-inhalt { flex:1; min-width:0; }
  .news-merk-btn { background:none; border:none; font-size:1.05rem; cursor:pointer; opacity:0.5; flex-shrink:0; padding:2px; align-self:flex-start; }
  .news-merk-btn.aktiv { opacity:1; }
  .quelle-fuszeile { margin-top:8px; font-size:0.68rem; color: var(--bark); opacity:0.85; }
  .quelle-fuszeile button { background:none; border:none; color:inherit; text-decoration:underline; cursor:pointer; padding:0; font-size:inherit; }

  .news-eintrag img { background: var(--parchment); }
  .news-eintrag .neu-marke { font-size: 0.6rem; font-weight: 800; color: var(--terracotta-text); margin-right: 4px; }
  .news-aktionen { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .news-aktionen button { background: none; border: none; font-size: 0.95rem; cursor: pointer; opacity: 0.55; padding: 2px; }
  .news-aktionen button.aktiv { opacity: 1; }
  .na-link { background: none; border: none; color: inherit; text-decoration: underline; cursor: pointer; padding: 0; font-size: inherit; }
  .quelle-label { font-weight: 700; }
  .such-leiste { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .such-leiste input { flex: 1 1 160px; min-width: 0; padding: 8px 12px; border-radius: var(--radius-pill); border: 1px solid var(--parchment); background: var(--white); color: var(--soil); font-size: 0.85rem; }
  .eigen-zeile { display: flex; gap: 6px; margin-top: 8px; }
  .eigen-zeile input { flex: 1; min-width: 0; padding: 7px 10px; border-radius: var(--radius-sm); border: 1px solid var(--parchment); background: var(--white); color: var(--soil); font-size: 0.85rem; }
  .eigen-zeile button, .einstellungen-box .weg { border: 1px solid var(--parchment); background: var(--white); color: var(--soil); border-radius: var(--radius-pill); padding: 5px 12px; cursor: pointer; font-weight: 700; }
  .einstellungen-box .weg { padding: 0 8px; margin-left: auto; font-size: 0.75rem; }
  .warn-box { border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 12px; font-size: 0.84rem; }
  .warn-box.ok { background: rgba(127,164,118,0.16); color: var(--soil); font-size: 0.78rem; padding: 7px 12px; }
  .warnung { border-left: 4px solid #e6c229; background: rgba(230,194,41,0.14); border-radius: var(--radius-sm); padding: 8px 10px; margin-bottom: 6px; }
  .warnung.s2 { border-color: #f08c00; background: rgba(240,140,0,0.15); }
  .warnung.s3 { border-color: #e03131; background: rgba(224,49,49,0.14); }
  .warnung.s4 { border-color: #9c36b5; background: rgba(156,54,181,0.16); }
  .warnung b { display: block; }
  .warnung .w-zeit { font-size: 0.72rem; color: var(--bark); }
  .warnung details { font-size: 0.78rem; margin-top: 4px; }
  .tipp { background: var(--white); border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 8px; box-shadow: var(--shadow-soft); }
  .tipp a { color: var(--moss-text, var(--moss)); font-weight: 700; text-decoration: none; }
  .tipp .t-kommentar { font-size: 0.84rem; margin: 4px 0; }
  .tipp .t-meta { font-size: 0.7rem; color: var(--bark); display: flex; gap: 6px; align-items: center; }
  .tipp .t-meta button { margin-left: auto; background: none; border: none; color: var(--bark); cursor: pointer; }
  .tab-badge { display: inline-block; min-width: 16px; padding: 0 5px; border-radius: 999px; background: var(--terracotta); color: #fff; font-size: 0.62rem; margin-left: 4px; }

  /* Kopfzeile kompakter: Modulname bleibt immer einzeilig (notfalls mit ...),
     Icons rücken näher zusammen. Ergänzt auf Arthurs Wunsch, robust über alle
     leicht unterschiedlichen Header-Varianten der Module hinweg. */
  header.top .titel-zeile, header .hdr-right { gap: 4px !important; }
  header.top .titel-zeile h1, header h1 { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Dark-Mode-Kontrast (alle Module gleich): Akzentfarbe als Text heller,
     Text auf Akzent-Knöpfen dunkel – außer bei „Schnee“, dort ist der Knopf selbst dunkel. */
  html[data-dark="1"] { --moss-text: var(--sage); --on-moss: #16140f; }
  html[data-dark="1"][data-farbschema="schnee"] { --on-moss: #f4f5f6; }

  /* Lesbarkeit im Dunkelmodus: Links/Knöpfe in Fehlermeldungen der Feeds */
  html[data-dark="1"] :where(a:not([class])) { color: #9cc9e8; }
  html[data-dark="1"] :where([id$="Inhalt"]) :where(button:not([class])) { color: var(--soil); background: var(--cream); border: 1px solid var(--parchment); border-radius: 999px; padding: 2px 10px; font: inherit; }
</style>
</head>
<body>

<header class="top">
  <div class="titel-zeile">
    <h1>📰 Nachrichten</h1>
    <div style="display:flex;align-items:center;gap:2px;">

<script>
(function(){
  // ---------- HANDY-ZURÜCK-TASTE ABFANGEN ----------
  // Ohne eigene Behandlung navigiert der native Zurück-Knopf des Smartphones durch die
  // Browser-Historie "hindurch" und die App landet auf einer leeren Zwischenseite.
  // Stattdessen: schließt zuerst jedes offene Fenster/Popup; ist nichts offen, passiert
  // bewusst gar nichts (statt die App zu verlassen bzw. leerzuräumen).
  function zurueckTasteUeberlagerungenSchliessen() {
    let geschlossen = false;
    document.querySelectorAll('.modal-bg, .theme-popup').forEach(el => {
      const sichtbar = el.style.display === 'flex' || el.style.display === 'block' || el.classList.contains('zeigen');
      if (sichtbar) { el.style.display = 'none'; el.classList.remove('zeigen'); geschlossen = true; }
    });
    return geschlossen;
  }
  try {
    history.pushState({ zurueckBasis: true }, '', location.href);
    window.addEventListener('popstate', function () {
      zurueckTasteUeberlagerungenSchliessen();
      history.pushState({ zurueckBasis: true }, '', location.href);
    });
  } catch (e) {}
  // ---------- KURZE STATUSMELDUNG (TOAST), optional mit Rückgängig-Aktion ----------
  function showTempStatus(text, sekunden, optionen) {
    optionen = optionen || {};
    let el = document.getElementById('tempStatus');
    if (!el) { el = document.createElement('div'); el.id = 'tempStatus'; document.body.appendChild(el); }
    el.style.cssText =
      'position:fixed;left:50%;bottom:24px;transform:translate(-50%,0);' +
      'background:#2a2016;color:#bcd196;padding:10px 18px;border-radius:22px;' +
      'font-size:0.85rem;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,0.25);' +
      'opacity:1;pointer-events:' + (optionen.rueckgaengig ? 'auto' : 'none') + ';transition:opacity .2s, transform .2s;z-index:9999;' +
      'max-width:88vw;text-align:center;font-family:Inter,system-ui,sans-serif;' +
      'display:flex;align-items:center;gap:12px;';
    el.innerHTML = '';
    const textSpan = document.createElement('span');
    textSpan.textContent = text;
    el.appendChild(textSpan);
    if (typeof optionen.rueckgaengig === 'function') {
      const btn = document.createElement('button');
      btn.textContent = 'Rückgängig';
      btn.style.cssText = 'background:none;border:none;color:#e8c98a;font-weight:700;font-size:0.85rem;cursor:pointer;padding:2px 4px;flex-shrink:0;text-decoration:underline;';
      btn.addEventListener('click', () => {
        clearTimeout(el._timeout);
        try { optionen.rueckgaengig(); } catch (e) { console.warn('showTempStatus: Rückgängig-Aktion fehlgeschlagen', e); }
        el.style.opacity = '0'; el.style.pointerEvents = 'none';
        el.style.transform = 'translate(-50%,20px)';
      });
      el.appendChild(btn);
    }
    clearTimeout(el._timeout);
    el._timeout = setTimeout(() => {
      el.style.opacity = '0'; el.style.pointerEvents = 'none';
      el.style.transform = 'translate(-50%,20px)';
    }, (sekunden || 2.5) * 1000);
  }

  function __pullToRefreshModalOffen() {
    return !!document.querySelector('.modal-bg.zeigen') ||
      Array.from(document.querySelectorAll('.modal-bg')).some(el => el.style.display === 'flex' || el.style.display === 'block');
  }
  // ---------- PULL-TO-REFRESH (von oben nach unten wischen) ----------
  (function () {
    let startY = 0, ziehend = false, ausgeloest = false;
    const SCHWELLE = 130;
    let indikator = null;
    function indikatorZeigen(strecke) {
      if (!indikator) {
        indikator = document.createElement('div');
        indikator.id = '__pullToRefreshIndikator';
        indikator.style.cssText =
          'position:fixed;top:8px;left:50%;transform:translate(-50%,-40px) rotate(0deg);' +
          'width:34px;height:34px;border-radius:50%;background:#2a2016;color:#bcd196;' +
          'display:flex;align-items:center;justify-content:center;font-size:1.1rem;' +
          'z-index:9998;transition:opacity .15s;box-shadow:0 3px 10px rgba(0,0,0,0.25);opacity:0;';
        document.body.appendChild(indikator);
      }
      const anteil = Math.min(1, strecke / SCHWELLE);
      indikator.style.opacity = String(anteil);
      indikator.style.transform = 'translate(-50%,' + (-40 + anteil * 56) + 'px) rotate(' + (anteil * 180) + 'deg)';
      indikator.textContent = anteil >= 1 ? '↻' : '↓';
    }
    function indikatorAusblenden() { if (indikator) indikator.style.opacity = '0'; }
    document.addEventListener('touchstart', (e) => {
      if (window.scrollY > 0 || e.touches.length !== 1 || __pullToRefreshModalOffen()) { ziehend = false; return; }
      startY = e.touches[0].clientY; ziehend = true; ausgeloest = false;
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      if (!ziehend) return;
      const strecke = e.touches[0].clientY - startY;
      if (strecke <= 0) { indikatorAusblenden(); return; }
      if (window.scrollY > 0 || __pullToRefreshModalOffen()) { ziehend = false; indikatorAusblenden(); return; }
      indikatorZeigen(strecke);
      if (strecke >= SCHWELLE) ausgeloest = true;
    }, { passive: true });
    document.addEventListener('touchend', () => {
      if (ziehend && ausgeloest) {
        if (indikator) { indikator.textContent = '↻'; indikator.style.opacity = '1'; }
        location.reload();
      } else { indikatorAusblenden(); }
      ziehend = false;
    }, { passive: true });
  })();

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function entitiesDekodieren(str) { if (!str) return str; const ta = document.createElement('textarea'); ta.innerHTML = str; return ta.value; }



  // ---------- Hintergrundmuster (🎨) ----------
  const themeBtn = document.getElementById('btnThemeAuswahl');
  const themePopup = document.getElementById('themePopup');
  themeBtn.addEventListener('click', () => themePopup.classList.toggle('zeigen'));
  document.addEventListener('click', (e) => { if (!themePopup.contains(e.target) && e.target !== themeBtn) themePopup.classList.remove('zeigen'); });
  const KEY_THEME_NACHRICHTEN = 'nachrichten_hintergrundThema';
  const KEY_FOTO_NACHRICHTEN = 'nachrichten_hintergrundBildEigenes';
  const NACHRICHTEN_MUSTER_KLASSEN = ['bg-zeitung', 'bg-globus'];
  function themeAnwenden(id) {
    document.body.classList.remove.apply(document.body.classList, NACHRICHTEN_MUSTER_KLASSEN);
    document.body.style.backgroundColor = '';
    document.body.style.backgroundImage = '';
    document.body.style.backgroundSize = '';
    document.body.style.backgroundPosition = '';
    document.body.style.backgroundRepeat = '';
    let eigenesFoto = '';
    try { eigenesFoto = localStorage.getItem(KEY_FOTO_NACHRICHTEN) || ''; } catch (e) {}
    if (id === 'foto' && eigenesFoto) {
      document.body.style.backgroundImage = 'linear-gradient(rgba(250,246,236,0.82),rgba(250,246,236,0.82)), url("' + eigenesFoto + '")';
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center';
      document.body.style.backgroundRepeat = 'no-repeat';
    } else if (id && id.indexOf('farbe:') === 0) {
      document.body.style.backgroundColor = id.slice(6) + 'b3';
    } else if (id) {
      document.body.classList.add(id);
    }
    try { localStorage.setItem(KEY_THEME_NACHRICHTEN, id || ''); } catch (e) {}
    document.querySelectorAll('.theme-swatch').forEach(s => s.classList.toggle('aktiv', s.dataset.theme === id));
  }
  document.querySelectorAll('.theme-swatch[data-theme]').forEach(s => s.addEventListener('click', () => { themeAnwenden(s.dataset.theme); themePopup.classList.remove('zeigen'); }));
  const customFarbeInput = document.querySelector('.theme-farbe-custom-input');
  if (customFarbeInput) customFarbeInput.addEventListener('input', () => themeAnwenden('farbe:' + customFarbeInput.value));
  const fotoInput = document.querySelector('.theme-foto-input');
  if (fotoInput) {
    fotoInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const maxW = 900;
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
          try { localStorage.setItem(KEY_FOTO_NACHRICHTEN, dataUrl); } catch (err) { alert('Foto konnte nicht gespeichert werden (evtl. zu groß oder Speicher voll).'); return; }
          themeAnwenden('foto');
        };
        img.onerror = () => alert('Datei ist kein gültiges Bild.');
        img.src = ev.target.result;
      };
      reader.onerror = () => alert('Foto konnte nicht gelesen werden.');
      reader.readAsDataURL(file);
    });
  }
  try { const gespeichertesTheme = localStorage.getItem(KEY_THEME_NACHRICHTEN); if (gespeichertesTheme) themeAnwenden(gespeichertesTheme); } catch (e) {}

  // ============================================================
  // Grundlagen
  // ============================================================
  const RSS2JSON_KEY = 'khhvce1zda9u9uia1due0cbu8xjiexqpbvqqql2s'; // eigener Key, separat vom Rest der App, wegen Kontingent-Trennung
  const KEY_GELESEN = 'nachrichten_gelesen_v1';
  const KEY_MERKLISTE = 'nachrichten_merkliste_v1';
  const KEY_THEMEN = 'nachrichten_themen';       // familienweit: { orte: [{id,label,q}], themen: [{id,label,q}], dwd: ['Pforzheim', …] }
  const KEY_TIPPS = 'nachrichten_tipps';         // familienweit: [{ id, link, title, quelle, kommentar, von, am }]
  const KEY_TIPPS_GESEHEN = 'nachrichten_tippsGesehen'; // geräte-lokal
  const KEY_BESUCH = 'nachrichten_letzterBesuch';       // geräte-lokal { kategorie: ms }
  const KEY_GELESEN_AUS = 'nachrichten_gelesenAusblenden';
  const lies = (k, f) => { try { const r = localStorage.getItem(k); return r === null ? f : JSON.parse(r); } catch (e) { return f; } };
  const schreib = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  // 🛡️ Nur echte Web-Adressen öffnen/anzeigen (schützt vor manipulierten Feeds)
  function sichererLink(u) { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : ''; }
  function ichBin() { try { return localStorage.getItem('planer_geraetIdentitaet') || ''; } catch (e) { return ''; } }
  function personName(id) { const p = (window.PLANER_PERSONEN || []).find(x => x.id === id); return p ? p.label : (id || 'Jemand'); }
  function neueId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function zeitText(pub) {
    if (!pub) return '';
    const d = new Date(String(pub).replace(' ', 'T') + (/Z|[+-]\d\d:?\d\d$/.test(pub) || String(pub).indexOf('T') !== -1 ? '' : 'Z'));
    if (isNaN(d)) return '';
    const min = Math.round((Date.now() - d) / 60000);
    if (min < 1) return 'gerade eben';
    if (min < 60) return 'vor ' + min + ' Min.';
    if (min < 24 * 60) return 'vor ' + Math.round(min / 60) + ' Std.';
    return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ', ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  }
  function zeitMs(pub) { const d = new Date(String(pub || '').replace(' ', 'T') + (/Z|[+-]\d\d:?\d\d$/.test(pub || '') || String(pub || '').indexOf('T') !== -1 ? '' : 'Z')); return isNaN(d) ? 0 : d.getTime(); }

  // Gelesen & Merkliste (nur auf diesem Gerät)
  function gelesenListe() { return lies(KEY_GELESEN, []); }
  function istGelesen(link) { return gelesenListe().includes(link); }
  function alsGelesenMarkieren(links) {
    let liste = gelesenListe();
    [].concat(links).forEach(l => { if (l && !liste.includes(l)) liste.push(l); });
    if (liste.length > 800) liste = liste.slice(liste.length - 800);
    schreib(KEY_GELESEN, liste);
  }
  function merklisteListe() { return lies(KEY_MERKLISTE, []); }
  function istGemerkt(link) { return merklisteListe().some(m => m.link === link); }
  function merklisteUmschalten(item) {
    let liste = merklisteListe();
    if (liste.some(m => m.link === item.link)) liste = liste.filter(m => m.link !== item.link);
    else liste.unshift({ link: item.link, title: item.title, quelle: item.quelle || '', datum: item.pubDate || '', gemerktAm: new Date().toISOString() });
    schreib(KEY_MERKLISTE, liste);
  }

  // ============================================================
  // Quellen
  // ============================================================
  const gn = (q) => 'https://news.google.com/rss/search?q=' + encodeURIComponent(q) + '&hl=de&gl=DE&ceid=DE:de';
  const STANDARD_ORTE = [{ id: 'pforzheim', label: 'Pforzheim', q: 'Pforzheim' }, { id: 'calw', label: 'Calw', q: 'Calw' }, { id: 'karlsruhe', label: 'Karlsruhe', q: 'Karlsruhe' }, { id: 'stuttgart', label: 'Stuttgart', q: 'Stuttgart' }];
  function themenDaten() {
    const d = lies(KEY_THEMEN, null) || {};
    return { orte: Array.isArray(d.orte) ? d.orte : STANDARD_ORTE.slice(), themen: Array.isArray(d.themen) ? d.themen : [], dwd: Array.isArray(d.dwd) ? d.dwd : ['Pforzheim', 'Enzkreis', 'Calw'] };
  }
  let sync = null;
  function themenSpeichern(d) { schreib(KEY_THEMEN, d); if (sync) sync.melde(); }
  const NATIONAL_QUELLEN = {
    tagesschau: { url: 'https://www.tagesschau.de/xml/rss2', label: 'Tagesschau', linkZielseite: 'https://www.tagesschau.de' },
    spiegel: { url: 'https://www.spiegel.de/schlagzeilen/index.rss', label: 'Spiegel', linkZielseite: 'https://www.spiegel.de' },
    faz: { url: 'https://www.faz.net/rss/aktuell/', label: 'FAZ', linkZielseite: 'https://www.faz.net' },
    welt: { url: 'https://www.welt.de/feeds/latest.rss', label: 'Welt', linkZielseite: 'https://www.welt.de' },
  };
  const INTERNATIONAL_QUELLEN = {
    bbc: { url: 'https://feeds.bbci.co.uk/news/rss.xml', label: '🇬🇧 BBC (Englisch)', linkZielseite: 'https://www.bbc.com/news' },
    aljazeera: { url: 'https://www.aljazeera.com/xml/rss/all.xml', label: '🇶🇦 Al Jazeera (Englisch)', linkZielseite: 'https://www.aljazeera.com' },
    xinhua: { url: 'http://www.xinhuanet.com/english/rss/worldrss.xml', label: '🇨🇳 Xinhua', linkZielseite: 'https://english.news.cn' },
    cgtn: { url: 'https://www.cgtn.com/subscribe/rss/section/china.xml', label: '🇨🇳 CGTN', linkZielseite: 'https://www.cgtn.com' },
    ria: { url: 'https://ria.ru/export/rss2/index.xml', label: '🇷🇺 RIA Nowosti', linkZielseite: 'https://ria.ru' },
    rt: { url: 'https://russian.rt.com/rss', label: '🇷🇺 RT', linkZielseite: 'https://russian.rt.com' },
    sputnik: { url: 'https://sputnikglobe.com/export/rss2/index.xml', label: '🇷🇺 Sputnik (Englisch)', linkZielseite: 'https://sputnikglobe.com' },
    nhk: { url: 'https://www3.nhk.or.jp/rss/news/cat0.xml', label: '🇯🇵 NHK', linkZielseite: 'https://www3.nhk.or.jp/news/' },
  };
  // Quellenliste je Kategorie (Orte/Themen kommen aus den Familien-Einstellungen)
  function quellenVon(kat) {
    if (kat === 'national') return Object.keys(NATIONAL_QUELLEN).map(k => Object.assign({ id: k, cacheKey: 'nachrichten_national_' + k }, NATIONAL_QUELLEN[k]));
    if (kat === 'international') return Object.keys(INTERNATIONAL_QUELLEN).map(k => Object.assign({ id: k, cacheKey: 'nachrichten_international_' + k }, INTERNATIONAL_QUELLEN[k]));
    const liste = kat === 'regional' ? themenDaten().orte : themenDaten().themen;
    return liste.map(o => ({ id: o.id, label: o.label, url: gn(o.q || o.label), cacheKey: 'nachrichten_' + kat + '_' + o.id + '_' + String(o.q || o.label).toLowerCase().replace(/[^a-z0-9äöüß]+/g, '-'), linkZielseite: 'https://news.google.com/search?q=' + encodeURIComponent(o.q || o.label) + '&hl=de&gl=DE', google: true }));
  }

  // ============================================================
  // Laden (rss2json, 3 Std. zwischengespeichert)
  // ============================================================
  function googleTitelAufteilen(titel) {
    const i = titel.lastIndexOf(' - ');
    return i > 10 ? { titel: titel.slice(0, i).trim(), quelle: titel.slice(i + 3).trim() } : { titel, quelle: '' };
  }
  async function quelleLaden(q, erzwingen) {
    if (!erzwingen) {
      const cache = lies(q.cacheKey, null);
      if (cache && cache.items && cache.items.length && (Date.now() - cache.fetchedAt) < 3 * 3600e3) return cache.items;
    }
    let url = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(q.url) + '&count=' + (q.count || 10);
    if (RSS2JSON_KEY) url += '&api_key=' + encodeURIComponent(RSS2JSON_KEY);
    const res = await fetch(url);
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message || 'Fehler');
    const items = (data.items || []).map(i => {
      let bild = i.thumbnail || (i.enclosure && i.enclosure.link) || i.image;
      if (!bild) { const t = (i.description || i.content || '').match(/<img[^>]+src=["']([^"']+)["']/i); if (t) bild = t[1]; }
      let titel = entitiesDekodieren(i.title || ''), quelle = q.label;
      if (q.google) { const g = googleTitelAufteilen(titel); titel = g.titel; if (g.quelle) quelle = g.quelle; }
      return { title: titel, link: sichererLink(i.link), pubDate: i.pubDate, thumbnail: sichererLink(bild), quelle };
    }).filter(i => i.link);
    schreib(q.cacheKey, { items, fetchedAt: Date.now() });
    return items;
  }

  // ============================================================
  // Anzeige je Kategorie
  // ============================================================
  const KATEGORIEN = ['regional', 'national', 'international', 'themen'];
  const aktiveQuelle = {};
  KATEGORIEN.forEach(k => { aktiveQuelle[k] = lies('nachrichten_' + k + '_quelle', 'alle') || 'alle'; });
  const geladen = {}; // kat -> items der aktuellen Auswahl
  let suchtext = '', gelesenAus = !!lies(KEY_GELESEN_AUS, false);
  let aktiveAnsicht = 'regional';
  function versteckt(kat) { return lies('nachrichten_' + kat + '_versteckt', []); }
  function sichtbareQuellen(kat) { const v = versteckt(kat); return quellenVon(kat).filter(q => !v.includes(q.id)); }

  function quellenReiheRendern(kat) {
    const box = document.getElementById(kat + 'QuellenReihe');
    const q = sichtbareQuellen(kat);
    if (aktiveQuelle[kat] !== 'alle' && !q.some(x => x.id === aktiveQuelle[kat])) aktiveQuelle[kat] = 'alle';
    box.innerHTML = q.length ? ['<button type="button" class="filter-chip' + (aktiveQuelle[kat] === 'alle' ? ' active' : '') + '" data-q="alle">📰 Alle</button>']
      .concat(q.map(x => '<button type="button" class="filter-chip' + (x.id === aktiveQuelle[kat] ? ' active' : '') + '" data-q="' + escapeHtml(x.id) + '">' + escapeHtml(x.label) + '</button>')).join('') : '';
    box.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => {
      aktiveQuelle[kat] = b.dataset.q; schreib('nachrichten_' + kat + '_quelle', b.dataset.q);
      quellenReiheRendern(kat); kategorieLaden(kat);
    }));
  }
  function einstellungenRendern(kat) {
    const box = document.getElementById(kat + 'EinstellungenBox');
    const v = versteckt(kat);
    const eigen = kat === 'regional' || kat === 'themen';
    const liste = quellenVon(kat);
    let html = '<div style="font-weight:700;font-size:0.85rem;margin-bottom:6px;">' + (kat === 'themen' ? 'Eure Themen (für die ganze Familie)' : kat === 'regional' ? 'Orte (für die ganze Familie) – Häkchen nur auf diesem Gerät' : 'Quellen anzeigen (nur auf diesem Gerät)') + '</div>';
    html += liste.map(q => '<label><input type="checkbox" data-sicht="' + escapeHtml(q.id) + '"' + (v.includes(q.id) ? '' : ' checked') + '> ' + escapeHtml(q.label) +
      (eigen ? '<button type="button" class="weg" data-weg="' + escapeHtml(q.id) + '" title="Entfernen">✕</button>' : '') + '</label>').join('') || '<div style="font-size:0.82rem;">Noch nichts eingetragen.</div>';
    if (eigen) html += '<div class="eigen-zeile"><input type="text" id="' + kat + 'Neu" placeholder="' + (kat === 'themen' ? 'z.B. Dacia Jogger, REACH Verordnung' : 'z.B. Enzkreis, Mühlacker') + '"><button type="button" data-neu="1">＋</button></div>';
    if (kat === 'regional') {
      const d = themenDaten();
      html += '<div style="font-weight:700;font-size:0.85rem;margin:12px 0 4px;">🚨 Unwetterwarnungen (DWD) für</div><div style="font-size:0.75rem;color:var(--bark);margin-bottom:4px;">Kreis- oder Stadtnamen, mit Komma getrennt</div>' +
        '<div class="eigen-zeile"><input type="text" id="dwdKreise" value="' + escapeHtml(d.dwd.join(', ')) + '"><button type="button" id="btnDwdSpeichern">✓</button></div>';
    }
    box.innerHTML = html;
    box.querySelectorAll('[data-sicht]').forEach(cb => cb.addEventListener('change', () => {
      let vv = versteckt(kat);
      if (cb.checked) vv = vv.filter(x => x !== cb.dataset.sicht); else if (!vv.includes(cb.dataset.sicht)) vv.push(cb.dataset.sicht);
      schreib('nachrichten_' + kat + '_versteckt', vv);
      quellenReiheRendern(kat); kategorieLaden(kat);
    }));
    box.querySelectorAll('[data-weg]').forEach(b => b.addEventListener('click', (e) => {
      e.preventDefault();
      const d = themenDaten(), feld = kat === 'regional' ? 'orte' : 'themen';
      d[feld] = d[feld].filter(x => x.id !== b.dataset.weg);
      themenSpeichern(d); einstellungenRendern(kat); quellenReiheRendern(kat); kategorieLaden(kat);
    }));
    const neuBtn = box.querySelector('[data-neu]');
    if (neuBtn) {
      const feld = document.getElementById(kat + 'Neu');
      const neu = () => {
        const teile = feld.value.split(',').map(t => t.trim()).filter(Boolean);
        if (!teile.length) return;
        const d = themenDaten(), f = kat === 'regional' ? 'orte' : 'themen';
        teile.forEach(t => { if (!d[f].some(x => x.label.toLowerCase() === t.toLowerCase())) d[f].push({ id: neueId(f.slice(0, 2)), label: t, q: t }); });
        themenSpeichern(d); feld.value = '';
        einstellungenRendern(kat); quellenReiheRendern(kat); kategorieLaden(kat);
      };
      neuBtn.addEventListener('click', neu);
      feld.addEventListener('keydown', (e) => { if (e.key === 'Enter') neu(); });
    }
    const dwdBtn = document.getElementById('btnDwdSpeichern');
    if (dwdBtn) dwdBtn.addEventListener('click', () => {
      const d = themenDaten(); d.dwd = document.getElementById('dwdKreise').value.split(',').map(t => t.trim()).filter(Boolean);
      themenSpeichern(d); try { localStorage.removeItem('nachrichten_dwdCache'); } catch (e) {} dwdLaden(true);
    });
  }
  async function kategorieLaden(kat, erzwingen) {
    const el = document.getElementById(kat + 'Inhalt');
    const quellen = sichtbareQuellen(kat);
    if (!quellen.length) {
      el.innerHTML = '<div class="leer-hinweis"><span class="em">' + (kat === 'themen' ? '⭐' : '🙈') + '</span>' + (kat === 'themen' ? 'Noch keine Themen. Unter „⚙️ Themen verwalten“ eigene Suchbegriffe eintragen, z.B. „Dacia Jogger“ oder „Kita Pforzheim“.' : 'Keine Quelle ausgewählt.') + '</div>';
      geladen[kat] = []; return;
    }
    const auswahl = aktiveQuelle[kat] === 'alle' ? quellen : quellen.filter(q => q.id === aktiveQuelle[kat]);
    if (!el.innerHTML || !geladen[kat]) el.innerHTML = '<div class="leer-hinweis">Lädt…</div>';
    const fehler = [];
    const ergebnisse = await Promise.all(auswahl.map(q => quelleLaden(q, erzwingen).catch(e => { fehler.push({ q, e }); return []; })));
    let items = [].concat(...ergebnisse);
    // Doppelte Meldungen (gleicher Link oder Titel) nur einmal
    const gesehen = new Set();
    items = items.filter(i => { const k = i.link + '|' + i.title.toLowerCase().slice(0, 60); const t = i.title.toLowerCase().slice(0, 60); if (gesehen.has(i.link) || gesehen.has(t)) return false; gesehen.add(i.link); gesehen.add(t); return true; });
    if (auswahl.length > 1) items.sort((a, b) => zeitMs(b.pubDate) - zeitMs(a.pubDate));
    geladen[kat] = items.slice(0, auswahl.length > 1 ? 60 : 30);
    geladen[kat]._fehler = fehler;
    geladen[kat]._auswahl = auswahl;
    feedRendern(kat);
  }
  function feedRendern(kat) {
    const el = document.getElementById(kat + 'Inhalt');
    const alle = geladen[kat] || [];
    const fehler = alle._fehler || [], auswahl = alle._auswahl || [];
    const letzterBesuch = (lies(KEY_BESUCH, {}) || {})[kat] || 0;
    let items = alle.filter(i => (!suchtext || i.title.toLowerCase().includes(suchtext) || (i.quelle || '').toLowerCase().includes(suchtext)) && (!gelesenAus || !istGelesen(i.link)));
    let html = '';
    if (!alle.length && fehler.length) {
      el.innerHTML = '<div style="padding:8px 0;">⚠ News konnten gerade nicht geladen werden (' + escapeHtml(String(fehler[0].e.message || fehler[0].e)) + '). <a href="' + escapeHtml(sichererLink(fehler[0].q.linkZielseite)) + '" target="_blank" rel="noopener">Direkt zur Quelle →</a></div>';
      return;
    }
    if (!items.length) html = '<div class="leer-hinweis">' + (alle.length ? 'Nichts gefunden' + (gelesenAus ? ' – oder schon alles gelesen 🎉' : '.') : 'Aktuell keine News verfügbar.') + '</div>';
    html += items.map((i, idx) => {
      const neu = letzterBesuch && zeitMs(i.pubDate) > letzterBesuch && !istGelesen(i.link);
      return '<div class="news-eintrag' + (istGelesen(i.link) ? ' gelesen' : '') + '">' + (i.thumbnail ? '<img src="' + escapeHtml(i.thumbnail) + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
        '<div class="news-inhalt"><a href="' + escapeHtml(i.link) + '" target="_blank" rel="noopener noreferrer" data-idx="' + idx + '">' + (neu ? '<span class="neu-marke">🆕</span>' : '') + escapeHtml(i.title) + '</a>' +
        '<div class="datum">' + (auswahl.length > 1 || i.quelle !== (auswahl[0] || {}).label ? '<span class="quelle-label">' + escapeHtml(i.quelle || '') + '</span> · ' : '') + escapeHtml(zeitText(i.pubDate)) + '</div></div>' +
        '<div class="news-aktionen"><button type="button" class="na-btn' + (istGemerkt(i.link) ? ' aktiv' : '') + '" data-merk="' + idx + '" title="Merken">🔖</button>' +
        '<button type="button" class="na-btn" data-tipp="' + idx + '" title="Als Familien-Lesetipp teilen">👪</button><button type="button" class="na-btn" data-teilen="' + idx + '" title="Teilen">📤</button></div></div>';
    }).join('');
    html += '<div class="quelle-fuszeile">' + (auswahl.length > 1 ? auswahl.length + ' Quellen' : 'Quelle: ' + escapeHtml((auswahl[0] || {}).label || '')) + (fehler.length && alle.length ? ' · ⚠ ' + fehler.length + ' nicht erreichbar' : '') +
      ' · <button type="button" class="na-link" id="btnAktualisieren_' + kat + '">aktualisieren</button></div>';
    el.innerHTML = html;
    el.querySelectorAll('a[data-idx]').forEach(a => a.addEventListener('click', () => { alsGelesenMarkieren(items[+a.dataset.idx].link); a.closest('.news-eintrag').classList.add('gelesen'); }));
    el.querySelectorAll('[data-merk]').forEach(b => b.addEventListener('click', () => { merklisteUmschalten(items[+b.dataset.merk]); b.classList.toggle('aktiv', istGemerkt(items[+b.dataset.merk].link)); }));
    el.querySelectorAll('[data-tipp]').forEach(b => b.addEventListener('click', () => tippTeilen(items[+b.dataset.tipp])));
    el.querySelectorAll('[data-teilen]').forEach(b => b.addEventListener('click', () => normalTeilen(items[+b.dataset.teilen])));
    const akt = document.getElementById('btnAktualisieren_' + kat);
    if (akt) akt.addEventListener('click', () => kategorieLaden(kat, true));
  }

  // ============================================================
  // 👪 Familien-Lesetipps & Teilen
  // ============================================================
  function tippsListe() { return lies(KEY_TIPPS, []) || []; }
  function tippTeilen(item) {
    const tipps = tippsListe();
    if (tipps.some(t => t.link === item.link)) { showTempStatus('👪 Steht schon bei den Lesetipps', 3); return; }
    const kommentar = prompt('Lesetipp für die Familie – kurzer Kommentar (optional):', '');
    if (kommentar === null) return;
    tipps.unshift({ id: neueId('tp'), link: item.link, title: item.title, quelle: item.quelle || '', kommentar: kommentar.trim(), von: ichBin(), am: new Date().toISOString() });
    schreib(KEY_TIPPS, tipps.slice(0, 60));
    if (sync) sync.melde();
    tippsBadge();
    showTempStatus('👪 Als Lesetipp geteilt', 3);
  }
  async function normalTeilen(item) {
    try { if (navigator.share) { await navigator.share({ title: item.title, url: item.link }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(item.title + '\n' + item.link); showTempStatus('🔗 Link kopiert', 2); } catch (e) { prompt('Link zum Kopieren:', item.link); }
  }
  function tippsBadge() {
    const gesehen = lies(KEY_TIPPS_GESEHEN, 0) || 0, ich = ichBin();
    const n = tippsListe().filter(t => new Date(t.am).getTime() > gesehen && t.von !== ich).length;
    const b = document.getElementById('tippsBadge');
    b.style.display = n ? '' : 'none'; b.textContent = n;
  }
  function tippsRendern() {
    const box = document.getElementById('tippsInhalt');
    const tipps = tippsListe().filter(t => !suchtext || (t.title + ' ' + (t.kommentar || '')).toLowerCase().includes(suchtext));
    schreib(KEY_TIPPS_GESEHEN, Date.now()); tippsBadge();
    if (!tipps.length) { box.innerHTML = '<div class="leer-hinweis"><span class="em">👪</span>Noch keine Lesetipps. Mit 👪 an einer Meldung teilst du sie mit der Familie.</div>'; return; }
    box.innerHTML = tipps.map(t => '<div class="tipp"><a href="' + escapeHtml(sichererLink(t.link)) + '" target="_blank" rel="noopener noreferrer" data-l="' + escapeHtml(t.link) + '">' + escapeHtml(t.title) + '</a>' +
      (t.kommentar ? '<div class="t-kommentar">💬 ' + escapeHtml(t.kommentar) + '</div>' : '') +
      '<div class="t-meta"><span>' + escapeHtml(personName(t.von)) + ' · ' + escapeHtml(zeitText(t.am)) + (t.quelle ? ' · ' + escapeHtml(t.quelle) : '') + '</span><button type="button" class="na-btn" data-weg="' + escapeHtml(t.id) + '" title="Entfernen">✕</button></div></div>').join('');
    box.querySelectorAll('a[data-l]').forEach(a => a.addEventListener('click', () => alsGelesenMarkieren(a.dataset.l)));
    box.querySelectorAll('[data-weg]').forEach(b => b.addEventListener('click', () => {
      const alle = tippsListe(); const i = alle.findIndex(x => x.id === b.dataset.weg); if (i === -1) return;
      const weg = alle.splice(i, 1)[0]; schreib(KEY_TIPPS, alle); if (sync) sync.melde(); tippsRendern();
      showTempStatus('Lesetipp entfernt', 5, { rueckgaengig: () => { const a2 = tippsListe(); a2.splice(i, 0, weg); schreib(KEY_TIPPS, a2); if (sync) sync.melde(); tippsRendern(); } });
    }));
  }

  // ============================================================
  // 🔖 Merkliste
  // ============================================================
  function renderMerkliste() {
    const box = document.getElementById('gemerktInhalt');
    const liste = merklisteListe().filter(m => !suchtext || (m.title || '').toLowerCase().includes(suchtext));
    if (!liste.length) { box.innerHTML = '<div class="leer-hinweis"><span class="em">🔖</span>Noch nichts gemerkt. Mit 🔖 an einer Meldung kannst du sie hier sammeln (nur auf diesem Gerät).</div>'; return; }
    box.innerHTML = liste.map((m, idx) => '<div class="news-eintrag' + (istGelesen(m.link) ? ' gelesen' : '') + '">' +
      '<div class="news-inhalt"><a href="' + escapeHtml(sichererLink(m.link)) + '" target="_blank" rel="noopener noreferrer" data-l="' + escapeHtml(m.link) + '">' + escapeHtml(m.title) + '</a>' +
      '<div class="datum">' + escapeHtml(m.quelle || '') + (m.datum ? ' · ' + escapeHtml(zeitText(m.datum)) : '') + '</div></div>' +
      '<div class="news-aktionen"><button type="button" class="na-btn aktiv" data-unmerk="' + idx + '" title="Aus Merkliste entfernen">🔖</button><button type="button" class="na-btn" data-tipp="' + idx + '" title="Als Lesetipp teilen">👪</button></div></div>').join('');

    box.querySelectorAll('[data-tipp]').forEach(b => b.addEventListener('click', () => { const m = liste[+b.dataset.tipp]; tippTeilen({ link: m.link, title: m.title, quelle: m.quelle }); }));
  }

  // ============================================================
  // 🚨 DWD-Unwetterwarnungen (JSONP: warnWetter.loadWarnings)
  // ============================================================
  const DWD_STUFE = { 1: 'Wetterwarnung', 2: 'Markante Wetterwarnung', 3: 'Unwetterwarnung', 4: 'Extreme Unwetterwarnung' };
  function dwdLaden(erzwingen) {
    const box = document.getElementById('dwdBox');
    const begriffe = themenDaten().dwd.map(b => b.toLowerCase()).filter(Boolean);
    if (!begriffe.length) { box.innerHTML = ''; return; }
    const cache = lies('nachrichten_dwdCache', null);
    if (!erzwingen && cache && Date.now() - cache.zeit < 15 * 60e3) { dwdRendern(cache.warnungen); return; }
    let fertig = false;
    window.warnWetter = { loadWarnings: (d) => {
      fertig = true;
      const liste = [];
      const alle = Object.assign({}, (d && d.warnings) || {});
      Object.keys(alle).forEach(id => (alle[id] || []).forEach(w => {
        const name = String(w.regionName || '').toLowerCase();
        if (begriffe.some(b => name.includes(b))) liste.push({ region: w.regionName, event: w.event, headline: w.headline, description: w.description, level: w.level, start: w.start, end: w.end });
      }));
      liste.sort((a, b) => (b.level || 0) - (a.level || 0));
      schreib('nachrichten_dwdCache', { zeit: Date.now(), warnungen: liste, begriffe });
      dwdRendern(liste);
    } };
    const sc = document.createElement('script');
    sc.src = 'https://www.dwd.de/DWD/warnungen/warnapp/json/warnings.json?' + Date.now();
    sc.onerror = () => { if (!fertig) box.innerHTML = cache ? '' : '<div class="warn-box ok">⚠ DWD-Warnungen gerade nicht erreichbar.</div>'; if (cache) dwdRendern(cache.warnungen); };
    sc.onload = () => sc.remove();
    document.head.appendChild(sc);
  }
  function dwdRendern(liste) {
    const box = document.getElementById('dwdBox');
    const begriffe = themenDaten().dwd;
    const fmt = ms => ms ? new Date(ms).toLocaleString('de-DE', { weekday: 'short', day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
    if (!liste || !liste.length) { box.innerHTML = '<div class="warn-box ok">✅ Keine Wetterwarnungen für ' + escapeHtml(begriffe.join(', ')) + ' (DWD)</div>'; return; }
    // gleiche Warnung für mehrere Kreise zusammenfassen
    const gruppen = {};
    liste.forEach(w => { const k = w.event + '|' + w.start + '|' + w.end + '|' + w.level; (gruppen[k] = gruppen[k] || Object.assign({ regionen: [] }, w)).regionen.push(w.region); });
    box.innerHTML = '<div class="warn-box" style="padding:0;">' + Object.values(gruppen).map(w => '<div class="warnung s' + Math.min(4, Math.max(1, w.level || 1)) + '"><b>🚨 ' + escapeHtml(w.headline || w.event || 'Warnung') + '</b>' +
      '<span class="w-zeit">' + escapeHtml(DWD_STUFE[w.level] || '') + ' · ' + escapeHtml(fmt(w.start)) + (w.end ? ' – ' + escapeHtml(fmt(w.end)) : '') + ' · ' + escapeHtml(w.regionen.join(', ')) + '</span>' +
      (w.description ? '<details><summary>Details</summary>' + escapeHtml(w.description) + '</details>' : '') + '</div>').join('') + '<div style="font-size:0.66rem;color:var(--bark);">Quelle: Deutscher Wetterdienst</div></div>';
  }

  // ============================================================
  // Ansichten
  // ============================================================
  const ANSICHTEN = ['regional', 'national', 'international', 'themen', 'tipps', 'gemerkt'];
  const tabId = n => 'btnView' + n.charAt(0).toUpperCase() + n.slice(1);
  const ansichtId = n => 'ansicht' + n.charAt(0).toUpperCase() + n.slice(1);
  function besuchMerken(kat) { const b = lies(KEY_BESUCH, {}) || {}; b[kat] = Date.now(); schreib(KEY_BESUCH, b); }
  function zeigeAnsicht(name) {
    if (!ANSICHTEN.includes(name)) name = 'regional';
    if (KATEGORIEN.includes(aktiveAnsicht) && aktiveAnsicht !== name) besuchMerken(aktiveAnsicht);
    aktiveAnsicht = name;
    ANSICHTEN.forEach(n => {
      document.getElementById(ansichtId(n)).style.display = n === name ? '' : 'none';
      const t = document.getElementById(tabId(n)); t.classList.toggle('active', n === name); t.setAttribute('aria-selected', n === name);
    });
    document.getElementById('btnAllesGelesen').style.display = KATEGORIEN.includes(name) ? '' : 'none';
    document.getElementById('btnGelesenAusblenden').style.display = KATEGORIEN.includes(name) ? '' : 'none';
    try { localStorage.setItem('nachrichten_aktiveAnsicht', name); } catch (e) {}
    if (KATEGORIEN.includes(name)) { quellenReiheRendern(name); einstellungenRendern(name); if (!geladen[name]) kategorieLaden(name); else feedRendern(name); }
    if (name === 'regional') dwdLaden(false);
    if (name === 'tipps') tippsRendern();
    if (name === 'gemerkt') renderMerkliste();
  }
  ANSICHTEN.forEach(n => document.getElementById(tabId(n)).addEventListener('click', () => zeigeAnsicht(n)));
  KATEGORIEN.forEach(k => {
    const btn = document.getElementById(k + 'EinstellungenToggle') || document.getElementById('btn' + k.charAt(0).toUpperCase() + k.slice(1) + 'EinstellungenToggle');
    btn.addEventListener('click', () => { const box = document.getElementById(k + 'EinstellungenBox'); box.style.display = box.style.display === 'block' ? 'none' : 'block'; });
  });
  document.getElementById('fNewsSuche').addEventListener('input', (e) => {
    suchtext = e.target.value.trim().toLowerCase();
    if (KATEGORIEN.includes(aktiveAnsicht)) feedRendern(aktiveAnsicht); else if (aktiveAnsicht === 'tipps') tippsRendern(); else renderMerkliste();
  });
  function gelesenKnopf() { document.getElementById('btnGelesenAusblenden').classList.toggle('active', gelesenAus); }
  document.getElementById('btnGelesenAusblenden').addEventListener('click', () => { gelesenAus = !gelesenAus; schreib(KEY_GELESEN_AUS, gelesenAus); gelesenKnopf(); if (KATEGORIEN.includes(aktiveAnsicht)) feedRendern(aktiveAnsicht); });
  document.getElementById('btnAllesGelesen').addEventListener('click', () => {
    const items = geladen[aktiveAnsicht] || [];
    const vorher = gelesenListe();
    alsGelesenMarkieren(items.map(i => i.link));
    besuchMerken(aktiveAnsicht);
    feedRendern(aktiveAnsicht);
    showTempStatus('✓ ' + items.length + ' Meldungen als gelesen markiert', 5, { rueckgaengig: () => { schreib(KEY_GELESEN, vorher); feedRendern(aktiveAnsicht); } });
  });
  window.addEventListener('pagehide', () => { if (KATEGORIEN.includes(aktiveAnsicht)) besuchMerken(aktiveAnsicht); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && KATEGORIEN.includes(aktiveAnsicht)) besuchMerken(aktiveAnsicht); });

  gelesenKnopf();
  if (window.PlanerSync) {
    sync = window.PlanerSync.starteSync({ modul: 'nachrichten', keys: [KEY_THEMEN, KEY_TIPPS], onRemoteChange: () => {
      tippsBadge();
      if (aktiveAnsicht === 'tipps') tippsRendern();
      if (aktiveAnsicht === 'regional' || aktiveAnsicht === 'themen') { einstellungenRendern(aktiveAnsicht); quellenReiheRendern(aktiveAnsicht); }
    } });
  }
  tippsBadge();
  zeigeAnsicht(lies('nachrichten_aktiveAnsicht_x', null) || (function () { try { return localStorage.getItem('nachrichten_aktiveAnsicht') || 'regional'; } catch (e) { return 'regional'; } })());
})();
</script>
