  button, input, select, textarea { font-family: inherit; -webkit-tap-highlight-color: transparent; }

  header.top { position: relative; background: linear-gradient(135deg, var(--navbg2), var(--navbg)); color: var(--leaf); padding: 10px 12px; }

  header.top::after { content: ''; position: absolute; left: 0; right: 0; bottom: -3px; height: 3px; background: linear-gradient(90deg, var(--moss), var(--sage) 35%, var(--leaf) 65%, var(--moss)); opacity: 0.85; z-index: 1; }

  .filter-reihe { display: flex; gap: 5px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; scrollbar-width: none; }
  .filter-reihe::-webkit-scrollbar { display: none; }
  .filter-chip { flex: 0 0 auto; background: transparent; border: 1px solid #4a3a28; color: var(--sage); font-size: 0.72rem; font-weight: 600; padding: 5px 12px; border-radius: var(--radius-pill); cursor: pointer; white-space: nowrap; }

  main { padding: 12px 14px; max-width: 680px; margin: 0 auto; }

    main { max-width: 1200px; }
    .notiz-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  }

  .notiz-suche { width: 100%; padding: 10px 14px; border: 1px solid var(--parchment); border-radius: var(--radius-pill); font-size: 0.85rem; background: var(--white); color: var(--soil); margin-bottom: 12px; }
  .notiz-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .notiz-karte { border-radius: var(--radius-md); padding: 14px; box-shadow: var(--shadow-soft); cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 90px; background: var(--white); }
  .notiz-titel { font-weight: 700; font-size: 0.95rem; color: var(--soil); font-family: 'Playfair Display', serif; }
  .notiz-text { font-size: 0.82rem; color: var(--soil); white-space: pre-wrap; line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; }
  .notiz-datum { font-size: 0.65rem; color: var(--bark); opacity: 0.75; margin-top: auto; padding-top: 4px; }
  .farbe-punkt { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.1); cursor: pointer; flex-shrink: 0; }
  .farbe-punkt.aktiv { border-color: var(--moss); border-width: 3px; }
  .farbe-punkt-reihe { display: flex; gap: 8px; flex-wrap: wrap; }

  .leer-hinweis { text-align: center; color: var(--bark); font-size: 0.85rem; padding: 46px 16px; opacity: 0.75; }
  .leer-hinweis .em { font-size: 2.2rem; display: block; margin-bottom: 8px; }

  .modal-bg { position: fixed; inset: 0; background: rgba(42,32,22,0.45); display: none; align-items: flex-end; justify-content: center; z-index: 100; padding-top: 6vh; }
  .modal-bg.zeigen { display: flex; }
  .modal { background: var(--cream); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 18px 18px 24px; width: 100%; max-width: 540px; max-height: 92vh; overflow-y: auto; box-shadow: var(--shadow-md); }
  @media (min-width: 600px) { .modal-bg { align-items: center; } .modal { border-radius: var(--radius-lg); } }
  .modal h2 { font-family: 'Playfair Display', serif; font-size: 1.15rem; margin-bottom: 12px; }

  .feld { margin-bottom: 12px; }
  .feld label { display: block; font-size: 0.7rem; font-weight: 700; color: var(--bark); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
  .feld input, .feld select, .feld textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--parchment); border-radius: var(--radius-sm); font-size: 0.9rem; background: var(--white); color: var(--soil); }
  .opt-reihe { display: flex; gap: 6px; flex-wrap: wrap; }
  .opt { padding: 6px 12px; border-radius: var(--radius-pill); font-size: 0.75rem; font-weight: 600; border: 1px solid var(--parchment); background: var(--white); color: var(--bark); cursor: pointer; }
  .opt.aktiv { color: var(--white); border-color: transparent; background: var(--moss); }
  .opt.klein { padding: 5px 10px; font-size: 0.72rem; }

  .modal-btns { display: flex; gap: 8px; margin-top: 18px; }
  .btn { flex: 1; padding: 11px; border-radius: var(--radius-pill); border: none; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
  .btn-primary { background: var(--moss); color: var(--leaf); }
  .btn-secondary { background: var(--white); color: var(--bark); border: 1px solid var(--parchment); }
  .btn-danger { background: transparent; color: var(--terracotta-text); border: 1px solid var(--terracotta); }

  .unterliste-titel { font-size: 0.72rem; font-weight: 700; color: var(--bark); text-transform: uppercase; letter-spacing: 0.03em; margin: 16px 0 6px; }
  .verlauf-liste { list-style: none; }
  .verlauf-liste li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--parchment); font-size: 0.8rem; }
  .verlauf-liste .v-wer { font-weight: 700; }
  .verlauf-leer { font-size: 0.8rem; color: var(--bark); opacity: 0.7; padding: 4px 0; }

e%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2860%2C810%29%20scale%280.85%29%20rotate%28-15%29%22%3E%3Cpath%20d%3D%22M%20-16%200%20L%200%20-16%20L%2016%200%20L%2016%2020%20L%20-16%2020%20Z%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28150%2C980%29%20scale%280.85%29%20rotate%286%29%22%3E%3Crect%20x%3D%22-12%22%20y%3D%22-4%22%20width%3D%2224%22%20height%3D%224%22%20rx%3D%221%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.4%22/%3E%3Cpath%20d%3D%22M%20-14%200%20C%20-14%20-2%2C%20-12%20-4%2C%20-8%20-4%20L%208%20-4%20C%2012%20-4%2C%2014%20-2%2C%2014%200%20L%2014%2030%20C%2014%2034%2C%2010%2036%2C%200%2036%20C%20-10%2036%2C%20-14%2034%2C%20-14%2030%20Z%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2860%2C1180%29%20scale%280.85%29%20rotate%28-10%29%22%3E%3Cline%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%2222%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.4%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M%20-10%2022%20L%2010%2022%20L%206%2038%20L%20-6%2038%20Z%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28150%2C1340%29%20scale%280.85%29%20rotate%2812%29%22%3E%3Cpath%20d%3D%22M%20-16%200%20L%200%20-16%20L%2016%200%20L%2016%2020%20L%20-16%2020%20Z%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
  }
  .ansicht-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .ansicht-tab { flex: 1; background: transparent; border: 1px solid #4a3a28; color: var(--sage); font-size: 0.78rem; font-weight: 700; padding: 7px 10px; border-radius: var(--radius-pill); cursor: pointer; }
  .ansicht-tab.active { background: var(--terracotta); color: var(--white); border-color: var(--terracotta); }
  .info-karte { background: var(--white); border-radius: var(--radius-md); margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); overflow: hidden; }
  .info-karte summary { padding: 14px; font-weight: 700; color: var(--soil); cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; }
  .info-karte summary::-webkit-details-marker { display: none; }
  .info-karte summary::after { content: '▾'; color: var(--terracotta); transition: transform 0.2s; flex-shrink: 0; margin-left: 8px; }
  .info-karte[open] summary::after { transform: rotate(180deg); }
  .info-inhalt { padding: 0 14px 16px; font-size: 0.82rem; color: var(--bark); line-height: 1.55; }
  .info-inhalt p { margin: 0 0 10px; }
  .info-inhalt ul { margin: 0 0 10px; padding-left: 18px; }
  .info-inhalt li { margin-bottom: 5px; }
  .info-inhalt strong { color: var(--soil); }
  .info-disclaimer { background: #fff3d9; border: 1px solid #e0c27a; border-radius: var(--radius-md); padding: 12px 14px; font-size: 0.78rem; color: #6b5220; margin-bottom: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="deko-rand links" aria-hidden="true"></div>
<div class="deko-rand rechts" aria-hidden="true"></div>


<header class="top">
  <div class="titel-zeile">
    <h1>📝 Notizblock</h1>
    <button class="theme-btn" id="btnThemeAuswahl" title="Hintergrundmuster wählen">🎨</button>
    <button class="add-btn" id="btnNeu">＋ Neu</button>
  </div>
</header>
  <div class="theme-popup" id="themePopup">
    <div class="theme-swatch" data-theme="" title="Kein Muster">✕</div>
    <div class="theme-swatch" data-theme="bg-stifte" title="Stifte">✏️</div>
    <div class="theme-swatch" data-theme="bg-zettel" title="Notizzettel">🗒️</div>
    <div class="theme-farbe-trenner"></div>
    <div class="theme-swatch farbe" data-theme="farbe:#f7d9dd" style="background:#f7d9dd" title="Pastell Rosa"></div>
    <div class="theme-swatch farbe" data-theme="farbe:#d9ebf7" style="background:#d9ebf7" title="Pastell Blau"></div>
    <div class="theme-swatch farbe" data-theme="farbe:#dcefd9" style="background:#dcefd9" title="Pastell Grün"></div>
    <div class="theme-swatch farbe" data-theme="farbe:#f7ecd9" style="background:#f7ecd9" title="Pastell Gelb"></div>
    <div class="theme-swatch farbe" data-theme="farbe:#e8d9f7" style="background:#e8d9f7" title="Pastell Lila"></div>
    <div class="theme-swatch farbe" data-theme="farbe:#f7d9c4" style="background:#f7d9c4" title="Pastell Pfirsich"></div>
    <div class="theme-swatch farbe" data-theme="farbe:#a8dadc" style="background:#a8dadc" title="Türkis"></div>
    <div class="theme-swatch farbe" data-theme="farbe:#f4a261" style="background:#f4a261" title="Koralle"></div>
    <label class="theme-swatch farbe theme-farbe-custom" title="Eigene Farbe">
      <input type="color" class="theme-farbe-custom-input" value="#f7d9dd">
    </label>
    <label class="theme-swatch theme-foto-swatch" title="Eigenes Foto hochladen">
      📷<input type="file" accept="image/*" class="theme-foto-input">
    </label>
  </div>

<main>
  <input type="text" class="notiz-suche" id="notizSuche" placeholder="🔍 Notizen durchsuchen ...">
  <div class="notiz-grid" id="notizGrid"></div>
  <div class="leer-hinweis" id="leerHinweis" style="display:none;">
    <span class="em">📝</span>
    Noch keine Notizen. Tippe auf „＋ Neu", um loszulegen.
  </div>
</main>

<!-- Neu / Bearbeiten -->
<div class="modal-bg" id="modalEdit">
  <div class="modal">
    <h2 id="editTitelKopf">Neue Notiz</h2>
    <input type="hidden" id="editId" value="">
    <div class="feld">
      <label for="fTitel">Titel (optional)</label>
      <input type="text" id="fTitel" placeholder="z.B. Einkaufsideen, Gedanken zum Urlaub ...">
    </div>
    <div class="feld">
      <label for="fText">Text</label>
      <textarea id="fText" rows="8" placeholder="Stichpunkte oder ganze Sätze ..."></textarea>
    </div>
    <div class="feld">
      <label>Farbe</label>
      <div class="farbe-punkt-reihe" id="farbeReihe"></div>
    </div>

    <div class="modal-btns">
      <button class="btn btn-secondary" id="btnEditAbbrechen">Abbrechen</button>
      <button class="btn btn-primary" id="btnEditSpeichern">💾 Speichern</button>
    </div>
    <div class="modal-btns" id="editLoeschZeile" style="display:none;">
      <button class="btn btn-danger" id="btnEditLoeschen">Notiz löschen</button>
    </div>
  </div>
</div>


<script>
(function () {
  'use strict';

  const KEY_NOTIZEN = 'notizblock_liste';

  function laden(key, fallback) {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch (e) { return fallback; }
  }
  function speichern(key, wert) {
    try { localStorage.setItem(key, JSON.stringify(wert)); }
    catch (e) { console.warn('Notizblock: Speichern fehlgeschlagen', key, e); alert('Speichern fehlgeschlagen – ist der Speicher voll?'); }
    if (window._sync) window._sync.melde();
  }
  function neueId(prefix) { return prefix + Date.now() + Math.random().toString(36).slice(2, 7); }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function zeitpunktAnzeige(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear() + ', ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  const NOTIZ_FARBEN = ['#fffdf8', '#f7d9dd', '#d9ebf7', '#dcefd9', '#f7ecd9', '#e8d9f7', '#f7d9c4'];

  let notizen = laden(KEY_NOTIZEN, []);
  let suchtext = '';

  function gefiltert() {
    if (!suchtext) return notizen;
    const s = suchtext.toLowerCase();
    return notizen.filter(n => (n.titel || '').toLowerCase().includes(s) || (n.text || '').toLowerCase().includes(s));
  }

  function renderNotizen() {
    const box = document.getElementById('notizGrid');
    const leer = document.getElementById('leerHinweis');
    const liste = gefiltert().slice().sort((a, b) => (b.geaendert || '') < (a.geaendert || '') ? -1 : 1);
    box.innerHTML = '';
    leer.style.display = liste.length ? 'none' : '';
    liste.forEach(n => {
      const karte = document.createElement('div');
      karte.className = 'notiz-karte';
      karte.style.background = n.farbe || '#fffdf8';
      karte.innerHTML =
        (n.titel ? '<div class="notiz-titel">' + escapeHtml(n.titel) + '</div>' : '') +
        '<div class="notiz-text">' + escapeHtml(n.text) + '</div>' +
        '<div class="notiz-datum">' + zeitpunktAnzeige(n.geaendert) + '</div>';
      karte.addEventListener('click', () => editOeffnen(n.id));
      box.appendChild(karte);
    });
  }
  document.getElementById('notizSuche').addEventListener('input', (e) => {
    suchtext = e.target.value.trim();
    renderNotizen();
  });

  // ---------- Neu / Bearbeiten ----------
  let editId = null;
  let gewaehlteFarbe = NOTIZ_FARBEN[0];

  function farbeReiheRendern() {
    const box = document.getElementById('farbeReihe');
    box.innerHTML = '';
    NOTIZ_FARBEN.forEach(f => {
      const punkt = document.createElement('div');
      punkt.className = 'farbe-punkt' + (gewaehlteFarbe === f ? ' aktiv' : '');
      punkt.style.background = f;
      punkt.title = f === '#fffdf8' ? 'Neutral' : f;
      punkt.addEventListener('click', () => { gewaehlteFarbe = f; farbeReiheRendern(); });
      box.appendChild(punkt);
    });
  }

  function editOeffnen(id) {
    editId = id || null;
    const n = editId ? notizen.find(x => x.id === editId) : null;
    document.getElementById('editTitelKopf').textContent = n ? 'Notiz bearbeiten' : 'Neue Notiz';
    document.getElementById('editId').value = editId || '';
    document.getElementById('fTitel').value = n ? (n.titel || '') : '';
    document.getElementById('fText').value = n ? n.text : '';
    gewaehlteFarbe = n ? (n.farbe || NOTIZ_FARBEN[0]) : NOTIZ_FARBEN[0];
    farbeReiheRendern();
    document.getElementById('editLoeschZeile').style.display = n ? '' : 'none';
    document.getElementById('modalEdit').classList.add('zeigen');
    setTimeout(() => document.getElementById('fText').focus(), 50);
  }
  document.getElementById('btnNeu').addEventListener('click', () => editOeffnen(null));
  document.getElementById('btnEditAbbrechen').addEventListener('click', () => document.getElementById('modalEdit').classList.remove('zeigen'));
  document.getElementById('modalEdit').addEventListener('click', (e) => { if (e.target.id === 'modalEdit') e.currentTarget.classList.remove('zeigen'); });

  document.getElementById('btnEditSpeichern').addEventListener('click', () => {
    const text = document.getElementById('fText').value.trim();
    if (!text) { document.getElementById('fText').focus(); return; }
    let n = editId ? notizen.find(x => x.id === editId) : null;
    if (!n) {
      n = { id: neueId('notiz'), erstellt: new Date().toISOString() };
      notizen.push(n);
    }
    n.titel = document.getElementById('fTitel').value.trim();
    n.text = text;
    n.farbe = gewaehlteFarbe;
    n.geaendert = new Date().toISOString();
    speichern(KEY_NOTIZEN, notizen);
    document.getElementById('modalEdit').classList.remove('zeigen');
    renderNotizen();
  });
  document.getElementById('btnEditLoeschen').addEventListener('click', () => {
    if (!editId) return;
    if (!confirm('Diese Notiz wirklich löschen?')) return;
    notizen = notizen.filter(n => n.id !== editId);
    speichern(KEY_NOTIZEN, notizen);
    document.getElementById('modalEdit').classList.remove('zeigen');
    renderNotizen();
  });


  // --- Hintergrundmuster ---
  (function () {
    const KEY_THEME = 'notizblock_hintergrundThema';
    const KEY_FOTO = KEY_THEME.replace('hintergrundThema', 'hintergrundBildEigenes');
    const klassen = ['bg-stifte', 'bg-zettel'];
    function themeAnwenden(id) {
      document.body.classList.remove.apply(document.body.classList, klassen);
      document.body.style.backgroundColor = '';
    document.body.style.backgroundImage = '';
    document.body.style.backgroundSize = '';
    document.body.style.backgroundPosition = '';
    document.body.style.backgroundRepeat = '';
    var eigenesFoto = '';
    try { eigenesFoto = localStorage.getItem(KEY_FOTO) || ''; } catch(e) {}
    if (id === 'foto' && eigenesFoto) {
      document.body.style.backgroundImage = 'linear-gradient(rgba(250,246,236,0.82),rgba(250,246,236,0.82)), url("' + eigenesFoto + '")';
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center';
      document.body.style.backgroundRepeat = 'no-repeat';
    }
    else if (id && id.indexOf('farbe:') === 0) { document.body.style.backgroundColor = id.slice(6) + 'b3'; }
    else if (id) document.body.classList.add(id);
      document.querySelectorAll('.theme-swatch').forEach(s => s.classList.toggle('aktiv', s.dataset.theme === id));
    }
    let aktivesTheme = '';
    try { aktivesTheme = localStorage.getItem(KEY_THEME) || ''; } catch (e) {}
    themeAnwenden(aktivesTheme);
  var customFarbeInput = document.querySelector('.theme-farbe-custom-input');
  if (customFarbeInput) {
    customFarbeInput.addEventListener('input', function() {
      var neueId = 'farbe:' + customFarbeInput.value;
      themeAnwenden(neueId);
      try { localStorage.setItem(KEY_THEME, neueId); } catch(e) {}
    });
  }
  var fotoInput = document.querySelector('.theme-foto-input');
  if (fotoInput) {
    fotoInput.addEventListener('change', function(e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        var img = new Image();
        img.onload = function() {
          var maxW = 900;
          var scale = Math.min(1, maxW / img.width);
          var canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          var dataUrl = canvas.toDataURL('image/jpeg', 0.65);
          try {
            localStorage.setItem(KEY_FOTO, dataUrl);
            localStorage.setItem(KEY_THEME, 'foto');
          } catch(err) { alert('Foto konnte nicht gespeichert werden (evtl. zu groß oder Speicher voll).'); return; }
          themeAnwenden('foto');
        };
        img.onerror = function() { alert('Datei ist kein gültiges Bild.'); };
        img.src = ev.target.result;
      };
      reader.onerror = function() { alert('Foto konnte nicht gelesen werden.'); };
      reader.readAsDataURL(file);
    });
  }
    const btn = document.getElementById('btnThemeAuswahl');
    const popup = document.getElementById('themePopup');
    btn.addEventListener('click', () => popup.classList.toggle('zeigen'));
    document.querySelectorAll('.theme-swatch:not(.theme-farbe-custom):not(.theme-foto-swatch)').forEach(swatch => {
      swatch.addEventListener('click', () => {
        const id = swatch.dataset.theme;
        themeAnwenden(id);
        try { localStorage.setItem(KEY_THEME, id); } catch (e) {}
        popup.classList.remove('zeigen');
      });
    });
    document.addEventListener('click', (e) => {
      if (popup.classList.contains('zeigen') && !popup.contains(e.target) && e.target.id !== 'btnThemeAuswahl') popup.classList.remove('zeigen');
    });
  })();

  renderNotizen();

  if (window.PlanerSync) {
    window._sync = window.PlanerSync.starteSync({
      modul: 'notizblock',
      keys: [KEY_NOTIZEN],
      onRemoteChange: function () { notizen = laden(KEY_NOTIZEN, notizen); renderNotizen(); },
    });
  }
})();
</script>
</body>
</html>
