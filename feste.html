<!DOCTYPE html>
<html lang="de">
<head>
<script>(function(){try{var m=localStorage.getItem('planer_darkMode');if(m==='dunkel'||(m==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-dark','1');}var s=localStorage.getItem('planer_schriftgroesse');if(s==='gross'){document.documentElement.style.fontSize='19px';}var f=localStorage.getItem('planer_farbschema');if(f&&f!=='wald'){document.documentElement.setAttribute('data-farbschema',f);}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feste</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --soil: #3a2e1f; --moss: #4f6f45; --sage: #7fa476; --leaf: #bcd196;
    --cream: #faf6ec; --parchment: #ece0c7; --bark: #7d6339;
    --terracotta: #c46b41; --terracotta-text: #a8532e; --sky: #5b8bb5; --gold: #c99a3a;
    --white: #fffdf8; --navbg: #2a2016; --navbg2: #3a2e1f; --rot: #b3261e; --rot-bg: #fbe4e1; --fest: #b8467a;
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 18px; --radius-pill: 22px;
    --shadow-soft: 0 2px 10px rgba(59,47,30,0.08); --shadow-md: 0 8px 26px rgba(59,47,30,0.2);
  }
  html[data-dark="1"] {
    --soil: #f0e8d8; --moss: #6fae5e; --sage: #9bc98a; --leaf: #cfe3b8;
    --cream: #1e1b16; --parchment: #2b261e; --bark: #c2b393;
    --terracotta: #d9855a; --terracotta-text: #e8a37e; --sky: #7fa8cc; --gold: #dcb158;
    --white: #2f2a22; --navbg: #14100c; --navbg2: #221a12; --rot: #ff8a80; --rot-bg: rgba(179,38,30,0.22); --fest: #e48ab3;
  }
  html[data-farbschema="ozean"] { --navbg: #1c1f24; --navbg2: #2b2f36; --sage: #8fd4c9; --leaf: #8fd4c9; --moss: #4fa89c; }
  html[data-farbschema="schnee"] { --navbg: #1c1f24; --navbg2: #2b2f36; --sage: #c9cdd3; --leaf: #f0f0f2; --moss: #5b5f66; }
  html[data-farbschema="fjord"] { --navbg: #1c1f24; --navbg2: #2b2f36; --sage: #9cc0ec; --leaf: #9cc0ec; --moss: #5b8bc9; }
  html[data-farbschema="bernstein"] { --navbg: #1c1f24; --navbg2: #2b2f36; --sage: #e6c878; --leaf: #e6c878; --moss: #c9a24d; }
  html[data-dark="1"][data-farbschema] { --cream: #191b1f; --parchment: #24262c; --white: #2a2d33; --soil: #eceef0; --bark: #a7acb5; }
  html[data-dark="1"] { --moss-text: var(--sage); --on-moss: #16140f; }
  html[data-dark="1"][data-farbschema="schnee"] { --on-moss: #f4f5f6; }
  html[data-dark="1"] input, html[data-dark="1"] select, html[data-dark="1"] textarea { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--soil); min-height: 100vh; padding-bottom: 70px; }
  button, input, select, textarea { font-family: inherit; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--terracotta); outline-offset: 2px; border-radius: 4px; }

  header.top { position: sticky; top: 0; z-index: 20; background: linear-gradient(135deg, var(--navbg2), var(--navbg)); color: var(--leaf); padding: 8px 12px 8px; }
  header.top::after { content: ''; position: absolute; left: 0; right: 0; bottom: -3px; height: 3px; background: linear-gradient(90deg, #b8467a, var(--gold) 35%, var(--sky) 65%, var(--moss)); opacity: 0.9; }
  .titel-zeile { display: flex; align-items: center; gap: 6px; }
  .titel-zeile h1 { font-family: 'Playfair Display', serif; font-size: 1.15rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kopf-btn { background: transparent; border: 1px solid #4a3a28; color: var(--sage); border-radius: var(--radius-pill); padding: 5px 11px; font-size: 0.76rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .kopf-btn.voll { background: var(--terracotta); border-color: var(--terracotta); color: #fff; }
  .reiter { display: none; gap: 5px; overflow-x: auto; scrollbar-width: none; padding: 8px 0 2px; }
  .reiter.an { display: flex; }
  .reiter::-webkit-scrollbar { display: none; }
  .reiter button { flex: 0 0 auto; background: transparent; border: 1px solid #4a3a28; color: var(--sage); font-size: 0.75rem; font-weight: 700; padding: 6px 11px; border-radius: var(--radius-pill); cursor: pointer; white-space: nowrap; }
  .reiter button.aktiv { background: var(--terracotta); border-color: var(--terracotta); color: #fff; }

  main { padding: 14px; max-width: 760px; margin: 0 auto; }
  h2 { font-family: 'Playfair Display', serif; font-size: 1.2rem; margin: 4px 0 10px; }
  h3 { font-size: 0.95rem; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  h3 .rechts { margin-left: auto; font-size: 0.74rem; font-weight: 700; color: var(--bark); }
  .karte { background: var(--white); border-radius: var(--radius-md); padding: 13px 14px; box-shadow: var(--shadow-soft); margin-bottom: 12px; }
  .klein { font-size: 0.76rem; color: var(--bark); line-height: 1.45; }
  .leer { text-align: center; color: var(--bark); font-size: 0.86rem; padding: 26px 12px; line-height: 1.6; }
  .tipp { background: rgba(201,154,58,0.14); border-radius: var(--radius-sm); padding: 9px 11px; margin: 8px 0; font-size: 0.8rem; line-height: 1.5; }
  .warn { background: var(--rot-bg); border-left: 4px solid var(--rot); border-radius: var(--radius-sm); padding: 8px 11px; margin: 8px 0; font-size: 0.8rem; line-height: 1.5; }
  .warn b { color: var(--rot); }

  .btn { border: none; border-radius: var(--radius-pill); padding: 10px 14px; font-weight: 700; font-size: 0.84rem; cursor: pointer; }
  .btn-primary { background: var(--moss); color: var(--on-moss, #fff); }
  .btn-secondary { background: var(--white); color: var(--soil); border: 1px solid var(--parchment); }
  .btn-klein { padding: 6px 11px; font-size: 0.76rem; }
  .btn-gefahr { background: transparent; color: var(--rot); border: 1px solid var(--rot); }
  .knopf-reihe { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .icon-btn { border: 1px solid var(--parchment); background: var(--cream); color: var(--soil); border-radius: 999px; padding: 3px 8px; font-size: 0.8rem; cursor: pointer; flex-shrink: 0; line-height: 1.3; }
  .weg-btn { border: none; background: none; color: var(--terracotta-text); cursor: pointer; font-size: 0.9rem; padding: 2px 4px; flex-shrink: 0; }

  .feld { margin-bottom: 10px; }
  .feld label, .label { display: block; font-size: 0.68rem; font-weight: 700; color: var(--bark); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .03em; }
  .feld input, .feld select, .feld textarea, .eingabe { width: 100%; padding: 9px 11px; border: 1px solid var(--parchment); border-radius: var(--radius-sm); background: var(--cream); color: var(--soil); font-size: 0.88rem; }
  .feld textarea { resize: vertical; min-height: 54px; }
  .zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .drei { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { border: 1px solid var(--parchment); background: var(--cream); color: var(--soil); border-radius: 999px; padding: 5px 10px; font-size: 0.76rem; font-weight: 600; cursor: pointer; }
  .chip.aktiv { background: var(--moss); border-color: var(--moss); color: var(--on-moss, #fff); }

  /* Liste der Feste */
  .fest-karte { display: flex; gap: 12px; align-items: center; background: var(--white); border-radius: var(--radius-md); padding: 12px 14px; box-shadow: var(--shadow-soft); margin-bottom: 10px; cursor: pointer; border-left: 5px solid var(--fest); }
  .fest-karte .em { font-size: 2rem; line-height: 1; }
  .fest-karte .info { flex: 1; min-width: 0; }
  .fest-karte b { display: block; font-size: 0.95rem; }
  .fest-karte .unter { font-size: 0.76rem; color: var(--bark); margin-top: 2px; }
  .fest-karte .countdown { text-align: center; font-size: 0.68rem; color: var(--bark); font-weight: 700; min-width: 52px; }
  .fest-karte .countdown b { font-size: 1.3rem; color: var(--fest); }
  .fest-karte.vorbei { opacity: 0.75; border-left-color: var(--parchment); }
  .art-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .art-raster button { border: 2px solid var(--parchment); background: var(--white); color: var(--soil); border-radius: var(--radius-md); padding: 12px 8px; cursor: pointer; font-size: 0.82rem; font-weight: 700; }
  .art-raster button .em { display: block; font-size: 1.7rem; margin-bottom: 4px; }
  .art-raster button.aktiv { border-color: var(--fest); background: rgba(184,70,122,0.1); }
  .motto-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .motto-raster button { border: 2px solid var(--parchment); background: var(--white); color: var(--soil); border-radius: var(--radius-sm); padding: 7px 4px; font-size: 0.72rem; font-weight: 600; cursor: pointer; }
  .motto-raster button .em { display: block; font-size: 1.3rem; }
  .motto-raster button.aktiv { border-color: var(--fest); background: rgba(184,70,122,0.1); }

  /* Übersicht */
  .held { text-align: center; padding: 16px 12px; background: linear-gradient(135deg, rgba(184,70,122,0.14), rgba(201,154,58,0.14)); border-radius: var(--radius-lg); margin-bottom: 12px; }
  .held .em { font-size: 2.6rem; }
  .held h2 { margin: 4px 0 2px; }
  .held .unter { font-size: 0.82rem; color: var(--bark); }
  .held .gross { font-size: 1.05rem; font-weight: 700; color: var(--fest); margin-top: 6px; }
  .kacheln { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .kachel { background: var(--white); border-radius: var(--radius-md); padding: 10px 12px; box-shadow: var(--shadow-soft); cursor: pointer; text-align: left; border: none; color: var(--soil); }
  .kachel span { display: block; font-size: 0.7rem; color: var(--bark); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .kachel b { display: block; font-size: 1.1rem; margin: 2px 0; }
  .kachel small { font-size: 0.72rem; color: var(--bark); }
  .jetzt { border: 2px solid var(--fest); }
  .jetzt .label { color: var(--fest); }

  /* Zeilen allgemein */
  .zeile { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--parchment); }
  .zeile:first-child { border-top: none; }
  .zeile .haupt { flex: 1; min-width: 0; font-size: 0.86rem; line-height: 1.4; }
  .zeile .haupt small { display: block; font-size: 0.72rem; color: var(--bark); }
  .zeile input[type=checkbox] { width: 20px; height: 20px; accent-color: #4f6f45; flex-shrink: 0; }
  .zeile.erledigt .haupt > span:first-child { text-decoration: line-through; opacity: 0.6; }
  .status-btn { border: none; border-radius: 999px; padding: 4px 9px; font-size: 0.72rem; font-weight: 700; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .st-eingeladen { background: rgba(91,139,181,0.18); color: var(--sky); }
  .st-zugesagt { background: rgba(79,111,69,0.2); color: var(--moss-text, var(--moss)); }
  .st-abgesagt { background: rgba(127,127,127,0.18); color: var(--bark); }
  .badge-allergie { display: inline-block; background: var(--rot-bg); color: var(--rot); border-radius: 999px; padding: 1px 7px; font-size: 0.68rem; font-weight: 700; margin-left: 4px; }
  .zaehler { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .zaehler span { background: var(--cream); border: 1px solid var(--parchment); border-radius: 999px; padding: 3px 9px; font-size: 0.74rem; font-weight: 600; }
  .zahl-input { width: 62px !important; text-align: center; }

  /* Ablauf */
  .ablauf-zeile { display: grid; grid-template-columns: 96px 1fr auto; gap: 8px; align-items: start; padding: 9px 0; border-top: 1px solid var(--parchment); }
  .ablauf-zeile:first-child { border-top: none; }
  .ablauf-zeile input[type=time] { width: 100%; padding: 6px 4px; border: 1px solid var(--parchment); border-radius: var(--radius-sm); background: var(--cream); color: var(--soil); font-size: 0.84rem; font-weight: 700; }
  .ablauf-zeile .titel-input { width: 100%; padding: 6px 8px; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; color: var(--soil); font-size: 0.88rem; font-weight: 600; }
  .ablauf-zeile .titel-input:focus { border-color: var(--parchment); background: var(--cream); }
  .ablauf-zeile .meta { display: flex; gap: 6px; align-items: center; font-size: 0.72rem; color: var(--bark); padding: 0 8px; flex-wrap: wrap; }
  .ablauf-zeile .meta input { width: 52px; padding: 3px 5px; border: 1px solid var(--parchment); border-radius: 6px; background: var(--cream); color: var(--soil); font-size: 0.74rem; }
  .ablauf-zeile .knoepfe { display: flex; flex-direction: column; gap: 4px; }
  .ablauf-zeile.ist-jetzt { background: rgba(184,70,122,0.1); border-radius: var(--radius-sm); }
  .ablauf-zeile.vorbei .titel-input { opacity: 0.55; }

  /* Spiele */
  .spiel { border-top: 1px solid var(--parchment); padding: 10px 0; }
  .spiel:first-child { border-top: none; }
  .spiel-kopf { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .spiel-kopf .em { font-size: 1.6rem; width: 34px; text-align: center; }
  .spiel-kopf .info { flex: 1; min-width: 0; }
  .spiel-kopf b { font-size: 0.9rem; }
  .spiel-kopf small { display: block; font-size: 0.72rem; color: var(--bark); }
  .spiel-text { font-size: 0.82rem; line-height: 1.5; margin: 6px 0 0 44px; display: none; }
  .spiel.offen .spiel-text { display: block; }
  .spiel-text .material { font-size: 0.76rem; color: var(--bark); margin-top: 4px; }
  .geplant { font-size: 0.7rem; font-weight: 700; color: var(--moss-text, var(--moss)); white-space: nowrap; }
  .suche { width: 100%; padding: 9px 12px; border-radius: var(--radius-pill); border: 1px solid var(--parchment); background: var(--white); color: var(--soil); font-size: 0.86rem; margin-bottom: 8px; }

  /* Schnitzeljagd */
  .station { background: var(--cream); border: 1px solid var(--parchment); border-radius: var(--radius-md); padding: 10px 11px; margin-bottom: 8px; }
  .station-kopf { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .station-nr { width: 28px; height: 28px; border-radius: 50%; background: var(--fest); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 0.84rem; flex-shrink: 0; }
  .station-kopf b { flex: 1; font-size: 0.86rem; }
  .station .eingabe { padding: 7px 9px; font-size: 0.84rem; margin-bottom: 6px; background: var(--white); }
  .station .reihe { display: flex; gap: 6px; align-items: center; }
  .station .reihe select { flex: 1; padding: 6px 8px; border: 1px solid var(--parchment); border-radius: var(--radius-sm); background: var(--white); color: var(--soil); font-size: 0.78rem; }
  .vorschau { font-size: 0.78rem; background: var(--white); border: 1px dashed var(--parchment); border-radius: var(--radius-sm); padding: 6px 9px; margin-top: 6px; color: var(--soil); overflow-wrap: anywhere; }
  .vorschau .spiegel { display: inline-block; transform: scaleX(-1); }
  .vorschau .bild { font-size: 1.6rem; }
  .pfeil { text-align: center; color: var(--bark); font-size: 0.8rem; margin: -2px 0 6px; }

  /* Fotos */
  .fotos { display: flex; gap: 8px; flex-wrap: wrap; }
  .fotos .ft { position: relative; width: 84px; height: 84px; border-radius: var(--radius-sm); overflow: hidden; background: var(--parchment); }
  .fotos .ft img { width: 100%; height: 100%; object-fit: cover; }
  .fotos .ft button { position: absolute; top: 2px; right: 2px; border: none; border-radius: 50%; width: 22px; height: 22px; background: rgba(0,0,0,0.55); color: #fff; cursor: pointer; font-size: 0.7rem; }
  .foto-hinzu { width: 84px; height: 84px; border-radius: var(--radius-sm); border: 2px dashed var(--parchment); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; }
  .foto-hinzu input { display: none; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(42,32,22,0.45); display: none; align-items: flex-end; justify-content: center; z-index: 100; padding-top: 6vh; }
  .modal-bg.zeigen { display: flex; }
  .modal { background: var(--cream); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 18px 18px 24px; width: 100%; max-width: 540px; max-height: 92vh; overflow-y: auto; box-shadow: var(--shadow-md); }
  @media (min-width: 600px) { .modal-bg { align-items: center; } .modal { border-radius: var(--radius-lg); } }
  .modal h2 { margin-top: 0; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }

  /* Druck */
  #druck { display: none; }
  @media print {
    @page { margin: 10mm; }
    body.druck-aktiv { background: #fff !important; color: #000 !important; padding: 0; }
    body.druck-aktiv > *:not(#druck) { display: none !important; }
    body.druck-aktiv #druck { display: block; }
  }
  #druck { font-family: 'Inter', sans-serif; color: #000; }
  #druck h1 { font-family: 'Playfair Display', serif; font-size: 18pt; margin-bottom: 4mm; }
  #druck h2 { font-family: 'Playfair Display', serif; font-size: 13pt; margin: 5mm 0 2mm; }
  #druck table { width: 100%; border-collapse: collapse; font-size: 10pt; }
  #druck td, #druck th { border-bottom: 1px solid #bbb; padding: 1.5mm 2mm; text-align: left; vertical-align: top; }
  .karten { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .dk { border: 1.5px dashed #888; padding: 6mm 6mm; min-height: 88mm; position: relative; break-inside: avoid; page-break-inside: avoid; display: flex; flex-direction: column; }
  .dk .wz { position: absolute; top: 4mm; right: 5mm; font-size: 22pt; opacity: 0.85; }
  .dk .nr { font-family: 'Playfair Display', serif; font-size: 16pt; font-weight: 700; margin-bottom: 3mm; }
  .dk .auf { font-size: 11pt; line-height: 1.45; margin-bottom: 4mm; }
  .dk .anl { font-size: 9pt; font-style: italic; margin-bottom: 2mm; }
  .dk .code { font-size: 15pt; font-weight: 700; letter-spacing: 0.04em; line-height: 1.55; overflow-wrap: anywhere; }
  .dk .code.sym { font-size: 19pt; letter-spacing: 0.08em; }
  .dk .spiegel { display: inline-block; transform: scaleX(-1); }
  .dk .bild { font-size: 64pt; text-align: center; line-height: 1.1; margin: 2mm 0; }
  .dk .fuss { margin-top: auto; font-size: 7.5pt; color: #666; padding-top: 3mm; }
  .tabelle-code { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1.5mm; font-size: 11pt; }
  .tabelle-code div { border: 1px solid #bbb; border-radius: 2mm; padding: 1mm 0.5mm; text-align: center; white-space: nowrap; font-size: 10pt; }
  .schatzkarte svg { width: 100%; height: auto; }
</style>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-storage-compat.js"></script>
<script src="personen.js"></script>
<script src="sync.js"></script>
<script src="fotospeicher.js"></script>
<script src="gemeinsam.js"></script>
<script src="festdaten.js"></script>
</head>
<body>
<div id="tempStatus"></div>
<header class="top">
  <div class="titel-zeile">
    <button type="button" class="kopf-btn" id="btnZurueck" style="display:none" aria-label="Zurück zur Übersicht">←</button>
    <h1 id="kopfTitel">🎉 Feste</h1>
    <button type="button" class="kopf-btn" id="btnSpieleSammlung">🎲 Spiele</button>
    <button type="button" class="kopf-btn voll" id="btnNeu">＋ Neues Fest</button>
  </div>
  <nav class="reiter" id="reiter" role="tablist">
    <button type="button" data-tab="uebersicht">📋 Übersicht</button>
    <button type="button" data-tab="gaeste">👥 Gäste</button>
    <button type="button" data-tab="ablauf">⏱️ Ablauf</button>
    <button type="button" data-tab="spiele">🎲 Spiele</button>
    <button type="button" data-tab="schnitzel">🗺️ Schnitzeljagd</button>
    <button type="button" data-tab="essen">🍰 Essen</button>
    <button type="button" data-tab="aufgaben">✅ Aufgaben</button>
    <button type="button" data-tab="danach">📸 Danach</button>
  </nav>
</header>
<main id="inhalt"></main>
<div id="druck"></div>

<!-- Neues Fest -->
<div class="modal-bg" id="modalNeu">
  <div class="modal">
    <h2>🎉 Neues Fest planen</h2>
    <div class="label">Was wird gefeiert?</div>
    <div class="art-raster" id="neuArten"></div>
    <div class="feld"><label for="nTitel">Name</label><input type="text" id="nTitel" placeholder="z. B. Levs 7. Geburtstag"></div>
    <div class="zwei">
      <div class="feld"><label for="nDatum">Datum</label><input type="date" id="nDatum"></div>
      <div class="feld"><label for="nFuer">Für wen?</label><select id="nFuer"></select></div>
    </div>
    <div class="feld" id="nAlterFeld"><label for="nAlter">Wird … Jahre alt</label><input type="number" id="nAlter" min="1" max="120" inputmode="numeric" class="zahl-input" style="width:90px!important"></div>
    <div id="nMottoFeld"><div class="label">Motto</div><div class="motto-raster" id="nMotto"></div></div>
    <div class="klein" style="margin-top:10px">Ablauf, Aufgaben, Essen und Budget werden aus der Vorlage vorgeschlagen – alles lässt sich danach ändern.</div>
    <div class="modal-btns"><button type="button" class="btn btn-secondary" id="btnNeuAbbrechen">Abbrechen</button><button type="button" class="btn btn-primary" id="btnNeuAnlegen">Fest anlegen</button></div>
  </div>
</div>

<!-- Gast bearbeiten -->
<div class="modal-bg" id="modalGast">
  <div class="modal">
    <h2 id="gastTitel">Gast</h2>
    <div class="feld"><label for="gName">Name</label><input type="text" id="gName"></div>
    <div class="zwei">
      <div class="feld"><label for="gTyp">Kind oder erwachsen?</label><select id="gTyp"><option value="kind">🧒 Kind</option><option value="erw">🧑 Erwachsene/r</option></select></div>
      <div class="feld"><label for="gStatus">Status</label><select id="gStatus"><option value="eingeladen">✉️ eingeladen</option><option value="zugesagt">✅ zugesagt</option><option value="abgesagt">❌ abgesagt</option></select></div>
    </div>
    <div class="feld"><label for="gAllergien">Allergien / Unverträglichkeiten</label><input type="text" id="gAllergien" placeholder="z. B. Nüsse, Laktose, vegetarisch"></div>
    <div class="zwei">
      <div class="feld"><label for="gAbholer">Wer bringt/holt ab?</label><input type="text" id="gAbholer" placeholder="z. B. Mama Sabine"></div>
      <div class="feld"><label for="gTel">Telefon</label><input type="tel" id="gTel"></div>
    </div>
    <div class="feld"><label for="gGeschenk">Geschenk (für den Dank danach)</label><input type="text" id="gGeschenk"></div>
    <div class="feld"><label for="gNotiz">Notiz</label><input type="text" id="gNotiz"></div>
    <div class="modal-btns"><button type="button" class="btn btn-gefahr" id="btnGastLoeschen">Entfernen</button><span style="flex:1"></span><button type="button" class="btn btn-secondary" id="btnGastAbbrechen">Abbrechen</button><button type="button" class="btn btn-primary" id="btnGastSpeichern">Speichern</button></div>
  </div>
</div>

<!-- Eigenes Spiel -->
<div class="modal-bg" id="modalSpiel">
  <div class="modal">
    <h2>🎲 Eigenes Spiel</h2>
    <div class="feld"><label for="spName">Name</label><input type="text" id="spName"></div>
    <div class="drei">
      <div class="feld"><label for="spMin">Ab (Jahre)</label><input type="number" id="spMin" min="1" max="99" value="4"></div>
      <div class="feld"><label for="spMax">Bis (Jahre)</label><input type="number" id="spMax" min="1" max="99" value="12"></div>
      <div class="feld"><label for="spDauer">Minuten</label><input type="number" id="spDauer" min="1" max="240" value="15"></div>
    </div>
    <div class="feld"><label for="spOrt">Wo?</label><select id="spOrt"><option value="beides">drinnen & draußen</option><option value="drinnen">drinnen</option><option value="draussen">draußen</option></select></div>
    <div class="feld"><label for="spMaterial">Material</label><input type="text" id="spMaterial"></div>
    <div class="feld"><label for="spText">So geht's</label><textarea id="spText" rows="4"></textarea></div>
    <div class="modal-btns"><button type="button" class="btn btn-secondary" id="btnSpielAbbrechen">Abbrechen</button><button type="button" class="btn btn-primary" id="btnSpielSpeichern">Speichern</button></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const FD = window.FestDaten;
  const KEY = 'feste_liste';
  const KEY_SPIELE = 'feste_spiele';
  let feste = laden(KEY, []); if (!Array.isArray(feste)) feste = [];
  let eigeneSpiele = laden(KEY_SPIELE, []); if (!Array.isArray(eigeneSpiele)) eigeneSpiele = [];
  let ansicht = 'liste';          // liste | fest | spiele
  let aktivId = null;
  let tab = 'uebersicht';
  const offeneSpiele = new Set();
  let spielFilter = { alter: null, ort: 'alle', motto: false, suche: '' };
  const $ = (id) => document.getElementById(id);
  const esc = escapeHtml;

  // ---------- Helfer ----------
  function personen() { return (window.PLANER_PERSONEN || []).filter(p => p.id !== 'familie'); }
  function personName(id) { const p = (window.PLANER_PERSONEN || []).find(x => x.id === id); return p ? p.label : ''; }
  function plusTage(iso, n) { const d = ausISO(iso); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function tageBis(iso) { return iso ? Math.round((ausISO(iso) - ausISO(heuteISO())) / 864e5) : null; }
  function datumLang(iso) { return iso ? ausISO(iso).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : 'Datum offen'; }
  function datumKurz(iso) { return iso ? ausISO(iso).toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'numeric' }) : ''; }
  function minuten(t) { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? Number(m[1]) * 60 + Number(m[2]) : null; }
  function uhrzeit(min) { min = ((min % 1440) + 1440) % 1440; return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0'); }
  function euro(x) { return (Number(x) || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' }); }
  function zahlAus(v) { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; }
  function countdownText(t) { return t === 0 ? 'heute' : t === 1 ? 'morgen' : t > 1 ? 'in ' + t + ' Tagen' : t === -1 ? 'gestern' : 'vor ' + (-t) + ' Tagen'; }
  function aktiv() { return feste.find(f => f.id === aktivId) || null; }
  function navigiere(modul, aktion, text, ziel) { try { parent.postMessage({ type: 'navigiere', modul, aktion: aktion || '', text: text || '', ziel: ziel || '' }, location.origin); } catch (e) {} }

  function speichernFeste() { speichern(KEY, feste); }
  let speicherTimer = null;
  function spaeterSpeichern() { clearTimeout(speicherTimer); speicherTimer = setTimeout(speichernFeste, 500); }
  function istKinderfest(f) { return f.art === 'kindergeburtstag'; }

  // Wer kommt? (abgesagte zählen nicht; eingeladene ohne Antwort zählen als „vielleicht“)
  function zahlen(f) {
    const g = f.gaeste || [];
    const z = { kinder: 0, erw: 0, zugesagt: 0, eingeladen: 0, abgesagt: 0, sicherKinder: 0, sicherErw: 0 };
    g.forEach(x => {
      z[x.status || 'eingeladen']++;
      if (x.status === 'abgesagt') return;
      const kind = x.typ !== 'erw';
      if (kind) z.kinder++; else z.erw++;
      if (x.status === 'zugesagt') { if (kind) z.sicherKinder++; else z.sicherErw++; }
    });
    z.eigeneKinder = Number(f.eigeneKinder) || 0; z.eigeneErw = Number(f.eigeneErw) || 0;
    z.gesamtKinder = z.kinder + z.eigeneKinder; z.gesamtErw = z.erw + z.eigeneErw;
    return z;
  }

  // ---------- 🗓️ Termine ----------
  let termineSync = null;
  function terminAktualisieren(f, entfernen) {
    const events = laden('termine_events_v1', []);
    const id = 't_fest_' + f.id;
    let rest = events.filter(e => e.id !== id);
    if (!entfernen && f.datum) {
      const art = FD.art(f.art), m = FD.motto(f.motto);
      rest.push({ id, title: (istKinderfest(f) && f.motto ? m.em : art.em) + ' ' + (f.titel || art.name), date: f.datum, allDay: !f.von, startTime: f.von || '', endTime: f.bis || '', wer: f.fuer || 'familie', location: f.ort || '',
        notes: 'Planung im Modul 🎉 Feste', erinnerung: 0, erinnerungVorabend: true, recurrence: { freq: 'keine' } });
    }
    if (rest.length === events.length && entfernen) return;
    try { localStorage.setItem('termine_events_v1', JSON.stringify(rest)); } catch (e) { return; }
    if (termineSync) termineSync.melde();
  }

  // ---------- 🛒 Einkauf ----------
  let einkaufSync = null;
  function zumEinkauf(eintraege) {
    let listen = laden('einkauf_listen', []);
    if (!listen.length) listen = [{ id: neueId('l'), name: 'Wocheneinkauf', items: [] }];
    let aktivListe = ''; try { aktivListe = localStorage.getItem('einkauf_aktiveListe') || ''; } catch (e) {}
    const liste = listen.find(x => x.id === aktivListe) || listen[0];
    liste.items = liste.items || [];
    const neu = [];
    eintraege.forEach(e => {
      if (liste.items.some(i => !i.erledigt && i.name === e.name)) return;
      const item = { id: neueId('i'), name: e.name, menge: e.menge ? String(e.menge).replace('.', ',') : '', einheit: e.einheit || '', kategorie: 'sonstiges', erledigt: false, hinzugefuegtVon: 'feste' };
      liste.items.push(item); neu.push(item.id);
    });
    if (!neu.length) { showTempStatus('Steht schon alles auf „' + liste.name + '“', 3); return; }
    try { localStorage.setItem('einkauf_listen', JSON.stringify(listen)); } catch (e) { alert('Speichern fehlgeschlagen.'); return; }
    if (einkaufSync) einkaufSync.melde();
    showTempStatus('🛒 ' + neu.length + (neu.length === 1 ? ' Artikel' : ' Artikel') + ' auf „' + liste.name + '“', 5, { rueckgaengig: () => {
      const ls = laden('einkauf_listen', []); const z = ls.find(x => x.id === liste.id);
      if (z) { z.items = (z.items || []).filter(i => !neu.includes(i.id)); localStorage.setItem('einkauf_listen', JSON.stringify(ls)); if (einkaufSync) einkaufSync.melde(); }
    } });
  }

  // ---------- 💶 Finanzen ----------
  let finanzSync = null;
  function finanzSpeichern(key, wert) { try { localStorage.setItem(key, JSON.stringify(wert)); } catch (e) {} if (finanzSync) finanzSync.melde(); }
  function finanzBuchen(f, b) {
    const ausgaben = laden('finanzen_ausgaben', []) || [];
    const kategorien = laden('finanzen_kategorien', []) || [];
    if (!kategorien.some(k => k.id === 'kat_feste')) { kategorien.push({ id: 'kat_feste', name: 'Feste & Feiern', icon: '🎉', limit: 0 }); finanzSpeichern('finanzen_kategorien', kategorien); }
    const id = 'fe_' + f.id + '_' + b.id;
    const eintrag = { id, kategorieId: 'kat_feste', betrag: Math.round(zahlAus(b.ausgegeben) * 100) / 100, beschreibung: '🎉 ' + (b.text || 'Fest') + ' – ' + (f.titel || 'Fest'), datum: heuteISO(), quelle: 'feste' };
    const vorhanden = ausgaben.find(a => a.id === id);
    if (vorhanden) Object.assign(vorhanden, eintrag, { datum: vorhanden.datum }); else ausgaben.push(eintrag);
    finanzSpeichern('finanzen_ausgaben', ausgaben);
    b.finanzId = id;
  }
  function finanzLoeschen(id) { finanzSpeichern('finanzen_ausgaben', (laden('finanzen_ausgaben', []) || []).filter(a => a.id !== id)); }

  // ---------- 🎁 Wunschliste (nur lesen) ----------
  function offeneWuensche(f) {
    if (!f.fuer) return [];
    return (laden('termine_wunschliste', []) || []).filter(w => w && w.name && w.person === f.fuer && (w.status || (w.reserviert ? 'reserviert' : 'offen')) === 'offen' && !(w.versteckenVor && w.versteckenVor.length) && (!w.anlass || w.anlass === 'geburtstag'));
  }

  // ---------- Teilen ----------
  async function teilen(titel, text) {
    try { if (navigator.share) { await navigator.share({ title: titel, text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text); showTempStatus('📋 Kopiert – jetzt z. B. in WhatsApp einfügen', 4); }
    catch (e) { prompt('Zum Kopieren:', text); }
  }
  function wirdText(f) { return f.alter ? 'wird ' + f.alter : 'hat Geburtstag'; }
  function einladungText(f) {
    const art = FD.art(f.art), m = FD.motto(f.motto);
    const name = personName(f.fuer) || '';
    let intro;
    if (istKinderfest(f)) intro = m.intro.replace('{name}', name || 'Unser Geburtstagskind').replace('{wird}', wirdText(f));
    else intro = 'Wir feiern ' + (f.titel || art.name) + (name && f.art === 'geburtstag' ? ' – ' + name + (f.alter ? ' wird ' + f.alter : '') : '') + ' und möchten dich herzlich einladen!';
    const em = istKinderfest(f) ? m.em : art.em;
    const zusageBis = f.datum ? plusTage(f.datum, -7) : '';
    const zeilen = [em + ' Einladung ' + em, '', intro, ''];
    if (f.datum) zeilen.push('📅 ' + datumLang(f.datum) + (f.von ? ', ' + f.von + (f.bis ? '–' + f.bis : '') + ' Uhr' : ''));
    if (f.ort) zeilen.push('📍 ' + f.ort);
    if (istKinderfest(f) && m.kleidung) zeilen.push('🎭 ' + m.kleidung);
    if (f.einladungZusatz) zeilen.push(f.einladungZusatz);
    zeilen.push('', 'Bitte sagt ' + (zusageBis && tageBis(zusageBis) > 0 ? 'bis ' + ausISO(zusageBis).toLocaleDateString('de-DE', { day: 'numeric', month: 'long' }) + ' ' : '') + 'Bescheid, ob ihr kommen könnt' + (istKinderfest(f) ? ' – und ob es Allergien gibt.' : '.'), '', 'Wir freuen uns! 🎉');
    return zeilen.join('\n');
  }
  function wunschzettelText(f) {
    const w = offeneWuensche(f);
    if (!w.length) return '';
    return '🎁 Wunschzettel für ' + personName(f.fuer) + (f.datum ? ' (' + ausISO(f.datum).toLocaleDateString('de-DE', { day: 'numeric', month: 'long' }) + ')' : '') + '\n\n' +
      w.map(x => '• ' + x.name + (x.preis ? ' (ca. ' + x.preis + ')' : '') + (x.notiz ? '\n   ' + x.notiz : '')).join('\n') + '\n\nBitte kurz Bescheid geben, was ihr besorgt – damit nichts doppelt kommt. 😊';
  }

  // ---------- Neues Fest ----------
  let neuArt = 'kindergeburtstag', neuMotto = '';
  function neuOeffnen() {
    neuArt = 'kindergeburtstag'; neuMotto = '';
    $('nTitel').value = ''; $('nDatum').value = ''; $('nAlter').value = '';
    $('nFuer').innerHTML = '<option value="">– Familie / niemand Bestimmtes –</option>' + personen().map(p => `<option value="${esc(p.id)}">${esc(p.label)}</option>`).join('');
    neuRendern();
    $('modalNeu').classList.add('zeigen');
  }
  function neuRendern() {
    $('neuArten').innerHTML = FD.ARTEN.map(a => `<button type="button" data-art="${a.id}" class="${a.id === neuArt ? 'aktiv' : ''}"><span class="em">${a.em}</span>${esc(a.name)}</button>`).join('');
    const kinder = neuArt === 'kindergeburtstag';
    $('nMottoFeld').style.display = kinder ? '' : 'none';
    $('nAlterFeld').style.display = kinder || neuArt === 'geburtstag' ? '' : 'none';
    $('nMotto').innerHTML = FD.MOTTOS.map(m => `<button type="button" data-motto="${m.id}" class="${m.id === neuMotto ? 'aktiv' : ''}"><span class="em">${m.em}</span>${esc(m.name)}</button>`).join('');
    $('neuArten').querySelectorAll('[data-art]').forEach(b => b.addEventListener('click', () => { neuArt = b.dataset.art; neuRendern(); titelVorschlag(); }));
    $('nMotto').querySelectorAll('[data-motto]').forEach(b => b.addEventListener('click', () => { neuMotto = b.dataset.motto; neuRendern(); }));
  }
  // Geburtstag aus Termine: Alter vorschlagen
  function geburtsjahr(pid) {
    const p = personName(pid); if (!p) return null;
    const ev = (laden('termine_events_v1', []) || []).find(e => e && e.geburtsjahr && /geburtstag|🎂/i.test(e.title || '') && (e.wer === pid || String(e.title || '').toLowerCase().includes(p.toLowerCase())));
    return ev ? { jahr: Number(ev.geburtsjahr), datum: ev.date } : null;
  }
  function titelVorschlag() {
    const pid = $('nFuer').value, name = personName(pid);
    const gj = geburtsjahr(pid);
    if (gj && (neuArt === 'kindergeburtstag' || neuArt === 'geburtstag')) {
      const jahr = $('nDatum').value ? Number($('nDatum').value.slice(0, 4)) : new Date().getFullYear() + (gj.datum && gj.datum.slice(5) < heuteISO().slice(5) ? 1 : 0);
      if (!$('nAlter').value || $('nAlter').dataset.auto === '1') { $('nAlter').value = jahr - gj.jahr; $('nAlter').dataset.auto = '1'; }
    }
    if ($('nTitel').dataset.selbst === '1' && $('nTitel').value) return;
    const a = FD.art(neuArt);
    const alter = $('nAlter').value;
    $('nTitel').value = (neuArt === 'kindergeburtstag' || neuArt === 'geburtstag') && name ? name + 's ' + (alter ? alter + '. ' : '') + 'Geburtstag' : a.name;
  }
  $('nFuer').addEventListener('change', titelVorschlag);
  $('nDatum').addEventListener('change', titelVorschlag);
  $('nAlter').addEventListener('input', () => { $('nAlter').dataset.auto = ''; titelVorschlag(); });
  $('nTitel').addEventListener('input', () => { $('nTitel').dataset.selbst = '1'; });
  $('btnNeuAbbrechen').addEventListener('click', () => $('modalNeu').classList.remove('zeigen'));
  $('btnNeuAnlegen').addEventListener('click', () => {
    const a = FD.art(neuArt);
    const f = {
      id: neueId('fe'), art: neuArt, titel: $('nTitel').value.trim() || a.name, datum: $('nDatum').value, von: a.von, bis: a.bis, ort: '',
      fuer: $('nFuer').value, alter: Number($('nAlter').value) || null, motto: a.kinder ? neuMotto : '', notiz: '', erstellt: heuteISO(),
      eigeneKinder: a.kinder ? 1 : 0, eigeneErw: a.kinder ? 2 : Math.max(1, personen().length),
      gaeste: [], ablauf: a.ablauf.map(x => ({ id: neueId('a'), zeit: x[0], dauer: x[1], titel: x[2] })),
      aufgaben: a.aufgaben.map(x => ({ id: neueId('t'), text: x[1], tageVorher: x[0], wer: '', erledigt: false })),
      essen: a.essen.map(x => ({ id: neueId('e'), name: x[0], einheit: x[1], proKind: x[2], proErw: x[3] })),
      budget: a.budget.map(x => ({ id: neueId('b'), text: x, geplant: '', ausgegeben: '' })),
      mitgebsel: a.mitgebsel.map(x => ({ id: neueId('m'), text: x, erledigt: false })),
      sj: { stufe: '', stationen: [], schatz: { ort: '', inhalt: [], versteckt: false } },
      danach: { gut: '', besser: '', fotos: [] },
    };
    if (a.kinder) f.sj.stationen = [1, 2, 3, 4].map(() => ({ id: neueId('s'), ort: '', aufgabe: '', raetsel: '', hinweis: '', versteckt: false }));
    feste.push(f); speichernFeste(); terminAktualisieren(f);
    $('modalNeu').classList.remove('zeigen'); $('nTitel').dataset.selbst = '';
    oeffnen(f.id, 'uebersicht');
    showTempStatus('🎉 Angelegt' + (f.datum ? ' – steht auch in Termine' : ''), 3);
  });

  // ---------- Kopieren („wie letztes Mal“) ----------
  function kopieren(f) {
    const k = JSON.parse(JSON.stringify(f));
    k.id = neueId('fe'); k.vorgaengerId = f.id; k.erstellt = heuteISO();
    k.datum = '';
    if (f.datum) { const d = ausISO(f.datum); d.setFullYear(d.getFullYear() + 1); k.datum = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    if (k.alter) k.alter = Number(k.alter) + 1;
    k.titel = String(f.titel || '').replace(/(\d+)\./, (m0, n) => (Number(n) + 1) + '.');
    (k.gaeste || []).forEach(g => { g.status = 'eingeladen'; g.geschenk = ''; g.dankeGesagt = false; g.tuete = false; });
    (k.aufgaben || []).forEach(a => { a.erledigt = false; delete a.erledigtAm; });
    (k.budget || []).forEach(b => { b.ausgegeben = ''; delete b.finanzId; });
    (k.mitgebsel || []).forEach(m => { m.erledigt = false; });
    (k.essen || []).forEach(e => { delete e.erledigt; });
    if (k.sj) { (k.sj.stationen || []).forEach(s => { s.versteckt = false; }); if (k.sj.schatz) { k.sj.schatz.versteckt = false; (k.sj.schatz.inhalt || []).forEach(i => { i.erledigt = false; }); } }
    k.danach = { gut: '', besser: '', fotos: [] };
    feste.push(k); speichernFeste(); terminAktualisieren(k);
    oeffnen(k.id, 'uebersicht');
    showTempStatus('📋 Kopiert – Datum und Motto jetzt anpassen', 4);
  }

  // ---------- Ansichten ----------
  function oeffnen(id, t) { aktivId = id; ansicht = 'fest'; tab = t || 'uebersicht'; spielFilter = { alter: null, ort: 'alle', motto: false, suche: '' }; render(); window.scrollTo({ top: 0 }); }
  function zurListe() { ansicht = 'liste'; aktivId = null; render(); window.scrollTo({ top: 0 }); }
  $('btnZurueck').addEventListener('click', zurListe);
  $('btnNeu').addEventListener('click', neuOeffnen);
  $('btnSpieleSammlung').addEventListener('click', () => { ansicht = 'spiele'; aktivId = null; spielFilter = { alter: null, ort: 'alle', motto: false, suche: '' }; render(); window.scrollTo({ top: 0 }); });
  document.querySelectorAll('#reiter button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(); window.scrollTo({ top: 0 }); }));

  function render() {
    const f = aktiv();
    if (ansicht === 'fest' && !f) ansicht = 'liste';
    $('btnZurueck').style.display = ansicht === 'liste' ? 'none' : '';

  // ---------- Liste ----------

    return { akt, naechst };
  }

  // ---------- 👥 Gäste & Mitgebsel ----------

  function telLink(t) { const n = String(t || '').replace(/[^\d+]/g, ''); return n ? `<a href="tel:${esc(n)}" style="color:var(--sky)">${esc(t)}</a>` : ''; }

  function ablaufSortiert(f) { return (f.ablauf || []).slice().sort((a, b) => (minuten(a.zeit) ?? 9999) - (minuten(b.zeit) ?? 9999)); }

  }

  function codeTabelle(art) {

        <div id="budgetListe">${budget.map(b => `<div class="zeile" data-id="${esc(b.id)}" style="flex-wrap:wrap">
          <input type="text" class="eingabe" data-bf="text" value="${esc(b.text || '')}" style="flex:1 1 100%;padding:6px 8px" aria-label="Posten">
          <span class="klein" style="margin-left:auto">Plan</span><input type="text" inputmode="decimal" class="eingabe" data-bf="geplant" value="${esc(String(b.geplant ?? ''))}" placeholder="€" style="width:64px;padding:6px" aria-label="Geplant">
          <span class="klein">Ist</span><input type="text" inputmode="decimal" class="eingabe" data-bf="ausgegeben" value="${esc(String(b.ausgegeben ?? ''))}" placeholder="€" style="width:64px;padding:6px" aria-label="Ausgegeben">
          <button type="button" class="icon-btn" data-buchen="${esc(b.id)}" title="${b.finanzId ? 'In Finanzen gebucht – antippen zum Entfernen' : 'In Finanzen buchen'}">${b.finanzId ? '✓💶' : '💶'}</button>
          <button type="button" class="weg-btn" data-bweg="${esc(b.id)}" aria-label="Entfernen">✕</button></div>`).join('')}</div>
        <div class="knopf-reihe"><button type="button" class="btn btn-secondary btn-klein" id="btnBudgetNeu">＋ Posten</button></div>
        <div class="klein" style="margin-top:6px">💶 bucht den ausgegebenen Betrag in Finanzen (Kategorie „🎉 Feste &amp; Feiern“).</div>
      </div>`;
    const box = $('aufgabenListe');
    box.querySelectorAll('[data-af]').forEach(el => el.addEventListener('change', () => {
      const a = f.aufgaben.find(x => x.id === el.closest('[data-id]').dataset.id);
      if (el.dataset.af === 'erledigt') { a.erledigt = el.checked; if (el.checked) { a.erledigtAm = heuteISO(); try { a.erledigtVon = localStorage.getItem('planer_geraetIdentitaet') || ''; } catch (e) {} } else { delete a.erledigtAm; delete a.erledigtVon; } }
      else a.wer = el.value;
      speichernFeste(); renderAufgaben(f);
    }));
    box.querySelectorAll('[data-aweg]').forEach(b => b.addEventListener('click', () => { const idx = f.aufgaben.findIndex(x => x.id === b.dataset.aweg), a = f.aufgaben[idx]; f.aufgaben.splice(idx, 1); speichernFeste(); renderAufgaben(f); showTempStatus('Entfernt', 5, { rueckgaengig: () => { f.aufgaben.splice(idx, 0, a); speichernFeste(); renderAufgaben(f); } }); }));
    const neu = () => { const v = $('auNeu').value.trim(); if (!v) return; (f.aufgaben = f.aufgaben || []).push({ id: neueId('t'), text: v, tageVorher: Number($('auWann').value), wer: '', erledigt: false }); speichernFeste(); renderAufgaben(f); $('auNeu').focus(); };
    $('btnAuNeu').addEventListener('click', neu); $('auNeu').addEventListener('keydown', e => { if (e.key === 'Enter') neu(); });
    const bbox = $('budgetListe');
    bbox.querySelectorAll('[data-bf]').forEach(el => {
      el.addEventListener('input', () => { const b = f.budget.find(x => x.id === el.closest('[data-id]').dataset.id); b[el.dataset.bf] = el.value; spaeterSpeichern(); });
      el.addEventListener('change', () => { const b = f.budget.find(x => x.id === el.closest('[data-id]').dataset.id); if (b.finanzId && el.dataset.bf !== 'geplant') finanzBuchen(f, b); speichernFeste(); renderAufgaben(f); });
    });
    bbox.querySelectorAll('[data-buchen]').forEach(btn => btn.addEventListener('click', () => {
      const b = f.budget.find(x => x.id === btn.dataset.buchen);
      if (b.finanzId) { finanzLoeschen(b.finanzId); delete b.finanzId; speichernFeste(); renderAufgaben(f); showTempStatus('Aus Finanzen entfernt', 3); return; }
      if (!(zahlAus(b.ausgegeben) > 0)) { showTempStatus('Erst bei „Ist“ den ausgegebenen Betrag eintragen', 3); return; }
      finanzBuchen(f, b); speichernFeste(); renderAufgaben(f); showTempStatus('💶 ' + euro(zahlAus(b.ausgegeben)) + ' in Finanzen gebucht', 3);
    }));
    bbox.querySelectorAll('[data-bweg]').forEach(btn => btn.addEventListener('click', () => { const b = f.budget.find(x => x.id === btn.dataset.bweg); if (b.finanzId) finanzLoeschen(b.finanzId); f.budget = f.budget.filter(x => x !== b); speichernFeste(); renderAufgaben(f); }));
    $('btnBudgetNeu').addEventListener('click', () => { (f.budget = f.budget || []).push({ id: neueId('b'), text: '', geplant: '', ausgegeben: '' }); speichernFeste(); renderAufgaben(f); const ins = $('budgetListe').querySelectorAll('[data-bf="text"]'); if (ins.length) ins[ins.length - 1].focus(); });
  }

  // ---------- 📸 Danach ----------
  function cloudBereit() { return !!(window.FotoSpeicher && window.FotoSpeicher.verfuegbar && window.FotoSpeicher.verfuegbar()); }
  function fotoSrc(x) { return (x && (x.url || x.bild)) || ''; }
  function bildHash(t) { let h1 = 0x811c9dc5, h2 = 5381; for (let i = 0; i < t.length; i++) { const c = t.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = (Math.imul(h2, 33) + c) | 0; } return (h1 >>> 0).toString(36) + (h2 >>> 0).toString(36); }
  async function vorhandeneCloudDatei(id) {
    try { await window.PlanerSync.authBereit(); const pfad = 'planerFamilien/' + window.PlanerSync.familienId() + '/fotos/' + id + '.jpg'; return { url: await firebase.storage().ref(pfad).getDownloadURL(), pfad }; }
    catch (e) { return null; }
  }
  let uploadLaeuft = false;
  async function fotosHochladen() {
    if (uploadLaeuft || !cloudBereit() || !navigator.onLine) return;
    uploadLaeuft = true; let geaendert = false;
    try {
      for (const f of feste) for (const x of ((f.danach && f.danach.fotos) || [])) {
        if (x.url || typeof x.bild !== 'string' || x.bild.indexOf('data:image') !== 0) continue;
        const daten = x.bild; let erg = null;
        try { erg = await vorhandeneCloudDatei('fe' + bildHash(daten)) || await window.FotoSpeicher.hochladen('fe' + bildHash(daten), daten); } catch (err) { console.warn('Feste: Foto-Upload', err); return; }
        if (x.bild !== daten || !erg) continue;
        x.url = erg.url; x.pfad = erg.pfad; delete x.bild; geaendert = true;
      }
    } finally { uploadLaeuft = false; if (geaendert) { speichernFeste(); if (tab === 'danach') render(); } }
  }
  function renderDanach(f) {
    f.danach = f.danach || { gut: '', besser: '', fotos: [] };
    const d = f.danach, g = (f.gaeste || []).filter(x => x.status !== 'abgesagt');
    const mitGeschenk = g.filter(x => x.geschenk);
    $('inhalt').innerHTML = `
      <div class="karte">
        <h3>📸 Fotos</h3>
        <div class="fotos" id="fotoReihe">${(d.fotos || []).map((x, i) => `<div class="ft"><img src="${esc(fotoSrc(x))}" alt=""><button type="button" data-fweg="${i}" aria-label="Foto entfernen">✕</button></div>`).join('')}<label class="foto-hinzu" title="Foto hinzufügen">📷<input type="file" accept="image/*" id="fFoto" multiple></label></div>
      </div>
      <div class="karte">
        <h3>🎁 Geschenke &amp; Danke<span class="rechts">${mitGeschenk.filter(x => x.dankeGesagt).length}/${mitGeschenk.length} bedankt</span></h3>
        ${g.length ? `<div id="dankListe">${g.map(x => `<div class="zeile${x.dankeGesagt ? ' erledigt' : ''}" data-id="${esc(x.id)}"><input type="checkbox" data-danke ${x.dankeGesagt ? 'checked' : ''} aria-label="Bedankt"><div class="haupt"><span><b>${esc(x.name)}</b></span></div><input type="text" class="eingabe" data-geschenk value="${esc(x.geschenk || '')}" placeholder="Geschenk" style="max-width:52%;padding:6px 8px"></div>`).join('')}</div>
          <div class="klein" style="margin-top:6px">Häkchen = Danke gesagt. Praktisch für Dankeskarten.</div>` : '<div class="klein">Keine Gäste eingetragen.</div>'}
      </div>
      <div class="karte">
        <h3>📝 Rückblick</h3>
        <div class="feld"><label for="dGut">👍 Was lief richtig gut?</label><textarea id="dGut" placeholder="z. B. Schnitzeljagd war der Hit">${esc(d.gut || '')}</textarea></div>
        <div class="feld"><label for="dBesser">🔁 Was machen wir nächstes Mal anders?</label><textarea id="dBesser" placeholder="z. B. weniger Kuchen, mehr Würstchen; 2 Stationen weniger">${esc(d.besser || '')}</textarea></div>
        <div class="klein">Wenn ihr das Fest unter 📋 Übersicht als Vorlage kopiert, erscheint diese Notiz beim nächsten Mal oben.</div>
      </div>`;
    $('fotoReihe').querySelectorAll('[data-fweg]').forEach(b => b.addEventListener('click', () => {
      const idx = +b.dataset.fweg, x = d.fotos[idx]; d.fotos.splice(idx, 1); speichernFeste(); renderDanach(f);
      showTempStatus('Foto entfernt', 6, { rueckgaengig: () => { d.fotos.splice(idx, 0, x); speichernFeste(); renderDanach(f); } });
      if (x && x.pfad && cloudBereit()) setTimeout(() => { if (!feste.some(ff => ((ff.danach && ff.danach.fotos) || []).some(y => y.pfad === x.pfad))) { try { window.FotoSpeicher.loeschen(x.pfad); } catch (e) {} } }, 9000);
    }));
    $('fFoto').addEventListener('change', (e) => {
      const dateien = Array.from(e.target.files || []); e.target.value = '';
      let offen = dateien.length;
      dateien.forEach(datei => {
        const reader = new FileReader();
        reader.onload = (ev) => { const img = new Image(); img.onload = () => {
          const max = cloudBereit() ? 1400 : 700, k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          (d.fotos = d.fotos || []).push({ id: neueId('ff'), bild: c.toDataURL('image/jpeg', cloudBereit() ? 0.8 : 0.6) });
          if (--offen === 0) { speichernFeste(); renderDanach(f); fotosHochladen(); }
        }; img.onerror = () => { if (--offen === 0) { speichernFeste(); renderDanach(f); } }; img.src = ev.target.result; };
        reader.readAsDataURL(datei);
      });
    });
    if ($('dankListe')) $('dankListe').querySelectorAll('[data-id]').forEach(z => {
      const x = f.gaeste.find(y => y.id === z.dataset.id);
      z.querySelector('[data-danke]').addEventListener('change', (e) => { x.dankeGesagt = e.target.checked; speichernFeste(); z.classList.toggle('erledigt', e.target.checked); });
      z.querySelector('[data-geschenk]').addEventListener('input', (e) => { x.geschenk = e.target.value; spaeterSpeichern(); });
    });
    $('dGut').addEventListener('input', () => { d.gut = $('dGut').value; spaeterSpeichern(); });
    $('dBesser').addEventListener('input', () => { d.besser = $('dBesser').value; spaeterSpeichern(); });
  }

  // ---------- Shell-Aufrufe ----------
  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin || !e.data || e.data.type !== 'shortcutAktion') return;
    if (e.data.aktion === 'neu') neuOeffnen();
    if (e.data.aktion === 'zeige' && e.data.ziel && feste.some(f => f.id === e.data.ziel)) oeffnen(e.data.ziel);
  });
  // Escape schließt Dialoge
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.modal-bg.zeigen').forEach(m => m.classList.remove('zeigen')); });
  document.querySelectorAll('.modal-bg').forEach(m => m.addEventListener('click', (e) => { if (e.target === m) m.classList.remove('zeigen'); }));

  render();

  if (window.PlanerSync) {
    window._sync = window.PlanerSync.starteSync({
      modul: 'feste', keys: [KEY, KEY_SPIELE],
      onRemoteChange: function () {
        feste = laden(KEY, []); if (!Array.isArray(feste)) feste = [];
        eigeneSpiele = laden(KEY_SPIELE, []); if (!Array.isArray(eigeneSpiele)) eigeneSpiele = [];
        // Während jemand tippt, nicht neu zeichnen (sonst springt der Cursor)
        const a = document.activeElement;
        if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && !document.querySelector('.modal-bg.zeigen')) { setTimeout(() => { if (!/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) render(); }, 1500); return; }
        render();
      },
    });
    termineSync = window.PlanerSync.starteSync({ modul: 'termine', keys: ['termine_events_v1'] });
    einkaufSync = window.PlanerSync.starteSync({ modul: 'einkauf', keys: ['einkauf_listen'] });
    finanzSync = window.PlanerSync.starteSync({ modul: 'finanzen', keys: ['finanzen_kategorien', 'finanzen_ausgaben'], ersterAbgleichVereinen: true });
    // Wunschliste nur mitlesen (Wunschzettel für das Geburtstagskind)
    window.PlanerSync.starteSync({ modul: 'termine', keys: ['termine_wunschliste'] });
    setTimeout(fotosHochladen, 3000);
    window.addEventListener('online', fotosHochladen);
  }
})();
</script>
</body>
</html>
