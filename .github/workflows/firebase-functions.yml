# Lädt die Server-Funktion (Ordner functions/) automatisch zu Firebase hoch,
# sobald dort etwas geändert wird. Kann unter "Actions" auch von Hand gestartet werden.
name: Firebase-Funktion hochladen

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/firebase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten installieren
        run: npm install --prefix functions
      - name: Zu Firebase hochladen
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only functions --project familyplaner-733de --non-interactive --force
