<!DOCTYPE html>
<html lang="de">
<head>

<title>Vorratskammer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --soil: #3a2e1f; --moss: #4f6f45; --sage: #7fa476; --leaf: #bcd196;
    --cream: #faf6ec; --parchment: #ece0c7; --bark: #7d6339;
    --terracotta: #c46b41; --terracotta-text: #a8532e; --sky: #5b8bb5; --gold: #c99a3a;
    --white: #fffdf8; --navbg: #2a2016;
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 18px; --radius-pill: 22px;
    --shadow-soft: 0 2px 10px rgba(59,47,30,0.08); --shadow-md: 0 8px 26px rgba(59,47,30,0.2);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--soil); min-height: 100vh; padding-bottom: 40px; }

  .theme-btn { background: none; border: none; color: var(--leaf); font-size: 1.1rem; cursor: pointer; padding: 4px 6px; flex-shrink: 0; }
  .theme-popup { display: none; position: absolute; right: 12px; top: 54px; background: var(--white, #fff); border-radius: var(--radius-md, 10px); box-shadow: var(--shadow-md, 0 8px 26px rgba(59,47,30,0.2)); padding: 10px; z-index: 50; }
  .theme-popup.zeigen { display: flex; gap: 8px; }
  .theme-swatch { width: 40px; height: 40px; border-radius: var(--radius-sm, 8px); border: 2px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; background: var(--cream); }
  .theme-swatch.aktiv { border-color: var(--moss); }

36%2C%20-14%2034%2C%20-14%2030%20Z%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    background-repeat: repeat;
  }

  button, input, select, textarea { font-family: inherit; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--terracotta); outline-offset: 2px; border-radius: 4px; }

  header.top { background: var(--navbg); color: var(--leaf); padding: 10px 12px; }
  header.top .titel-zeile { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  header.top h1 { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; }
  .add-btn { background: var(--terracotta); color: var(--white); border: none; border-radius: var(--radius-pill); font-size: 0.82rem; font-weight: 700; padding: 7px 15px; cursor: pointer; }

  .kategorie-tabs { display: flex; gap: 5px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; scrollbar-width: none; }
  .kategorie-tabs::-webkit-scrollbar { display: none; }
  .kat-tab { position: relative; flex: 0 0 auto; background: transparent; border: 1px solid #4a3a28; color: var(--sage); font-size: 0.75rem; font-weight: 600; padding: 6px 14px; border-radius: var(--radius-pill); cursor: pointer; white-space: nowrap; }
  .kat-tab.active { background: var(--moss); color: var(--leaf); border-color: var(--moss); }
  .kat-tab .kt-del { margin-left: 6px; opacity: 0.7; }
  .kat-tab-neu { flex: 0 0 auto; background: transparent; border: 1px dashed #6b5a3e; color: var(--sage); font-size: 0.75rem; font-weight: 600; padding: 6px 14px; border-radius: var(--radius-pill); cursor: pointer; white-space: nowrap; }

  main { padding: 12px 14px; max-width: 680px; margin: 0 auto; }
  @media (min-width: 1000px) {
    main { max-width: 1200px; }
    #vorratListe { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; align-items: start; }
    #vorratListe .vorrat-karte { margin-bottom: 0; }
  }

  .werkzeug-zeile { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .werkzeug-zeile select { padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--parchment); background: var(--white); font-size: 0.8rem; color: var(--soil); }
  .werkzeug-zeile .anzahl-text { font-size: 0.75rem; color: var(--bark); }

  .vorrat-karte { background: var(--white); border-radius: var(--radius-md); padding: 12px; box-shadow: var(--shadow-soft); margin-bottom: 9px; cursor: pointer; position: relative; }
  .vk-kopf { display: flex; align-items: flex-start; gap: 8px; }
  .vk-herz { background: none; border: none; font-size: 1rem; cursor: pointer; opacity: 0.55; flex-shrink: 0; padding: 2px; }
  .vk-herz.aktiv { opacity: 1; color: var(--terracotta-text); }
  .vk-bestand { width: 30px; height: 30px; border-radius: 50%; border: none; font-weight: 800; font-size: 0.78rem; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .vk-titel-block { flex: 1; min-width: 0; }
  .vk-name { font-size: 0.92rem; font-weight: 700; }
  .vk-menge { font-size: 0.78rem; color: var(--bark); font-weight: 600; }
  .vk-cart { background: none; border: none; font-size: 1.1rem; cursor: pointer; opacity: 0.7; flex-shrink: 0; padding: 2px; }
  .vk-meta-reihe { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  .vk-chip { font-size: 0.65rem; font-weight: 600; padding: 2px 9px; border-radius: var(--radius-pill); background: var(--parchment); color: var(--bark); }
  .vk-chip.verfall-ok { background: #e4efe0; color: var(--moss); }
  .vk-chip.verfall-bald { background: #fbe8d3; color: var(--terracotta-text); }
  .vk-chip.verfall-um { background: #f6d9d9; color: #a03e3e; }
  .vk-notiz { font-size: 0.76rem; color: var(--bark); opacity: 0.8; margin-top: 5px; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .sterne-reihe { display: flex; gap: 1px; margin-top: 4px; }
  .sterne-reihe .stern { font-size: 0.8rem; color: var(--parchment); }
  .sterne-reihe .stern.aktiv { color: var(--gold); }
  .sterne-eingabe { display: flex; gap: 4px; }
  .sterne-eingabe button { background: none; border: none; font-size: 1.6rem; color: var(--parchment); cursor: pointer; padding: 0 2px; }
  .sterne-eingabe button.aktiv { color: var(--gold); }

  .leer-hinweis { text-align: center; color: var(--bark); font-size: 0.85rem; padding: 46px 16px; opacity: 0.75; }
  .leer-hinweis .em { font-size: 2.2rem; display: block; margin-bottom: 8px; }

  .modal-bg { position: fixed; inset: 0; background: rgba(42,32,22,0.45); display: none; align-items: flex-end; justify-content: center; z-index: 100; padding-top: 6vh; }
  .modal-bg.zeigen { display: flex; }
  .modal { background: var(--cream); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 18px 18px 24px; width: 100%; max-width: 540px; max-height: 92vh; overflow-y: auto; box-shadow: var(--shadow-md); }
  @media (min-width: 600px) { .modal-bg { align-items: center; } .modal { border-radius: var(--radius-lg); } }
  .modal h2 { font-family: 'Playfair Display', serif; font-size: 1.15rem; margin-bottom: 12px; }

  .feld { margin-bottom: 12px; }
  .feld label { display: block; font-size: 0.7rem; font-weight: 700; color: var(--bark); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
  .feld input, .feld select, .feld textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--parchment); border-radius: var(--radius-sm); font-size: 0.9rem; background: var(--white); color: var(--soil); }
  .feld textarea { resize: vertical; min-height: 46px; }
  .zeile { display: flex; gap: 10px; }
  .zeile .feld { flex: 1; }
  .kategorie-reihe { display: flex; gap: 6px; flex-wrap: wrap; }
  .kategorie-opt { padding: 6px 12px; border-radius: var(--radius-pill); font-size: 0.72rem; font-weight: 600; border: 1px solid var(--parchment); background: var(--white); color: var(--bark); cursor: pointer; }
  .kategorie-opt.aktiv { background: var(--moss); color: var(--white); border-color: var(--moss); }

  .modal-btns { display: flex; gap: 8px; margin-top: 18px; }
  .btn { flex: 1; padding: 11px; border-radius: var(--radius-pill); border: none; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
  .btn-primary { background: var(--moss); color: var(--leaf); }
  .btn-secondary { background: var(--white); color: var(--bark); border: 1px solid var(--parchment); }
  .btn-danger { background: transparent; color: var(--terracotta-text); border: 1px solid var(--terracotta); }

  .temp-status { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--navbg); color: var(--leaf); padding: 10px 18px; border-radius: var(--radius-pill); font-size: 0.85rem; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,0.25); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 500; max-width: 88vw; text-align: center; }
  .temp-status.zeigen { opacity: 1; transform: translate(-50%, 0); }

  /* Sehr breite Bildschirme: Content etwas breiter + dezente Deko-Streifen im Rand */
  .deko-rand { display: none; position: fixed; top: 0; bottom: 0; width: 220px; background-repeat: repeat-y; background-position: center top; pointer-events: none; z-index: -1; }
  .deko-rand.links { left: 0; }
  .deko-rand.rechts { right: 0; transform: scaleX(-1); }

    main { max-width: 1440px; }

%3D%2212%22%20y1%3D%22-14%22%20x2%3D%2212%22%20y2%3D%2216%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.4%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M%20-12%2016%20C%20-12%2020%2C%2012%2020%2C%2012%2016%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.4%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }

<body>
<div class="deko-rand links" aria-hidden="true"></div>
<div class="deko-rand rechts" aria-hidden="true"></div>


<div id="tempStatus" class="temp-status"></div>

<header class="top">
  <div class="titel-zeile">
    <h1>🥫 Vorratskammer</h1>
    <button class="theme-btn" id="btnThemeAuswahl" title="Hintergrundmuster wählen">🎨</button>
    <button class="add-btn" id="btnNeu">＋ Neu</button>
  </div>
  <div class="kategorie-tabs" id="katTabs"></div>
</header>
  <div class="theme-popup" id="themePopup">
<div class="theme-swatch" data-theme="" title="Kein Muster">✕</div>
    <div class="theme-swatch" data-theme="bg-glaeser" title="Vorrat & Gläser">🥫</div>
    <div class="theme-swatch" data-theme="bg-kraeuter" title="Kräuter">🌿</div>
  </div>


<main>
  <div class="werkzeug-zeile">
    <span class="anzahl-text" id="anzahlText"></span>
    <select id="sortAuswahl">
      <option value="alpha">🔤 Alphabetisch</option>
      <option value="lagerort">📍 Lagerort</option>
      <option value="gruppierung">🗂 Gruppierung</option>
      <option value="verfall">⏳ Verfallsdatum</option>
      <option value="bestand">🔴 Bestand (wenig zuerst)</option>
    </select>
  </div>
  <div id="vorratListe"></div>
  <div class="leer-hinweis" id="leerHinweis" style="display:none;">
    <span class="em">🥫</span>
    Noch nichts in dieser Kategorie erfasst.<br>Mit „＋ Neu" den ersten Vorrat anlegen.
  </div>
</main>

<!-- MODAL: Vorrat erfassen/bearbeiten -->
<div class="modal-bg" id="modalItem">
  <div class="modal">
    <h2 id="itemModalTitel">Neuer Vorrat</h2>
    <div class="feld">
      <label for="fName">Name</label>
      <input type="text" id="fName" placeholder="z.B. Nudeln, Kopfschmerztabletten">
    </div>
    <div class="zeile">
      <div class="feld">
        <label for="fMenge">Anzahl / Menge (optional)</label>
        <input type="text" id="fMenge" placeholder="z.B. 3 Packungen, 500 g">
      </div>
    </div>
    <div class="feld">
      <label for="fBestand">Bestand grob (schneller als genau zählen)</label>
      <select id="fBestand">
        <option value="">– keine Angabe –</option>
        <option value="leer">🔴 Kaum/leer</option>
        <option value="mittel">🟡 Mittlere Menge</option>
        <option value="viel">🟢 Viel vorhanden</option>
      </select>
    </div>
    <div class="feld">
      <label>Lagerort</label>
      <div class="kategorie-reihe" id="fLagerortReihe"></div>
    </div>
    <div class="feld">
      <label>Kategorie</label>
      <div class="kategorie-reihe" id="fKategorieReihe"></div>
    </div>
    <div class="feld">
      <label for="fGruppierung">Gruppierung</label>
      <input type="text" id="fGruppierung" list="gruppierungListe" placeholder="z.B. Konserven, Tiefkühl, Schmerzmittel">
      <datalist id="gruppierungListe"></datalist>
    </div>
    <div class="zeile">
      <div class="feld">
        <label for="fGekauft">Gekauft am</label>
        <input type="date" id="fGekauft">
      </div>
    </div>
    <div class="zeile">
      <div class="feld">
        <label for="fVerfall">Verfallsdatum</label>
        <input type="date" id="fVerfall">
      </div>
      <div class="feld">
        <label for="fAufbrauchen">Aufbrauchen bis</label>
        <input type="date" id="fAufbrauchen">
      </div>
    </div>
    <div class="feld">
      <label for="fNotiz">Notizen</label>
      <textarea id="fNotiz" placeholder="z.B. Lieblingsmarke, Aufbewahrungsort"></textarea>
    </div>
    <div class="feld">
      <label>Bewertung</label>
      <div class="sterne-eingabe" id="sterneEingabe"></div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-secondary" id="btnAbbrechen">Abbrechen</button>
      <button class="btn btn-primary" id="btnSpeichern">Speichern</button>
    </div>
    <div class="modal-btns" id="loeschZeile" style="display:none;">
      <button class="btn btn-danger" id="btnLoeschen">Eintrag löschen</button>
    </div>
  </div>
</div>

<!-- MODAL: Neue Kategorie -->
<div class="modal-bg" id="modalKategorie">
  <div class="modal">
    <h2>Neue Kategorie</h2>
    <div class="zeile">
      <div class="feld" style="flex:0 0 70px;">
        <label for="fKatIcon">Symbol</label>
        <input type="text" id="fKatIcon" placeholder="📦" maxlength="4">
      </div>
      <div class="feld">
        <label for="fKatName">Name</label>
        <input type="text" id="fKatName" placeholder="z.B. Getränke, Putzmittel">
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-secondary" id="btnKatAbbrechen">Abbrechen</button>
      <button class="btn btn-primary" id="btnKatSpeichern">Anlegen</button>
    </div>
  </div>
</div>

<script src="gemeinsam.js"></script>
<script>
(function(){
  'use strict';
  const KEY_ITEMS = 'vorratskammer_items';
  const KEY_KATEGORIEN = 'vorratskammer_kategorien';
  const KEY_EINKAUF_LISTEN = 'einkauf_listen';
  const KEY_EINKAUF_AKTIV = 'einkauf_aktiveListe';
  const KEY_SORT = 'vorratskammer_sortierung'; // geräte-lokale Anzeigeeinstellung, bewusst nicht synchronisiert

  const KATEGORIEN_FEST = [
    { id: 'lebensmittel', label: 'Lebensmittel', icon: '🍎', fest: true },
    { id: 'apotheke', label: 'Apotheke', icon: '💊', fest: true },
  ];
  const LAGERORT_OPTIONEN = [
    { id: 'kuehlschrank', label: 'Kühlschrank', icon: '🧊' },
    { id: 'gefrierfach', label: 'Gefrierfach', icon: '❄️' },
    { id: 'vorratsschrank', label: 'Vorratsschrank', icon: '🗄️' },
    { id: 'keller', label: 'Keller', icon: '🏚️' },
    { id: 'sonstiges', label: 'Sonstiges', icon: '📦' },
  ];
  function lagerortInfo(id) { return LAGERORT_OPTIONEN.find(l => l.id === id); }

  // neueId, escapeHtml, heuteISO, ausISO, laden, speichern, showTempStatus: siehe gemeinsam.js

  let items = laden(KEY_ITEMS, []);
  let kategorienEigene = laden(KEY_KATEGORIEN, []);
  let aktiveKategorie = 'lebensmittel';
  let sortierung = localStorage.getItem(KEY_SORT) || 'alpha';
  let bearbeitenId = null;
  let editSterne = 0;
  let editKategorie = 'lebensmittel';
  let editLagerort = '';

  function alleKategorien() { return KATEGORIEN_FEST.concat(kategorienEigene); }
  function kategorieInfo(id) { return alleKategorien().find(k => k.id === id) || KATEGORIEN_FEST[0]; }

  // ---------- KATEGORIE-TABS ----------
  function renderKatTabs() {
    const box = document.getElementById('katTabs');
    box.innerHTML = '';
    alleKategorien().forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'kat-tab' + (k.id === aktiveKategorie ? ' active' : '');
      btn.innerHTML = k.icon + ' ' + escapeHtml(k.label) + (!k.fest && k.id === aktiveKategorie ? ' <span class="kt-del" data-id="' + k.id + '">✕</span>' : '');
      btn.addEventListener('click', (e) => {
        if (e.target.classList.contains('kt-del')) {
          e.stopPropagation();
          kategorieLoeschen(k.id);
          return;
        }
        aktiveKategorie = k.id;
        renderKatTabs();
        renderListe();
      });
      box.appendChild(btn);
    });
    const neuBtn = document.createElement('button');
    neuBtn.className = 'kat-tab-neu';
    neuBtn.textContent = '＋ Kategorie';
    neuBtn.addEventListener('click', () => {
      document.getElementById('fKatIcon').value = '';
      document.getElementById('fKatName').value = '';
      document.getElementById('modalKategorie').classList.add('zeigen');
    });
    box.appendChild(neuBtn);
  }
  function kategorieLoeschen(id) {
    const anzahl = items.filter(i => i.kategorie === id).length;
    const meldung = anzahl
      ? 'Diese Kategorie und alle ' + anzahl + ' zugehörigen Einträge löschen?'
      : 'Diese Kategorie löschen?';
    if (!confirm(meldung)) return;
    kategorienEigene = kategorienEigene.filter(k => k.id !== id);
    items = items.filter(i => i.kategorie !== id);
    speichern(KEY_KATEGORIEN, kategorienEigene);
    speichern(KEY_ITEMS, items);
    aktiveKategorie = 'lebensmittel';
    renderKatTabs();
    renderListe();
  }
  document.getElementById('btnKatAbbrechen').addEventListener('click', () => document.getElementById('modalKategorie').classList.remove('zeigen'));
  document.getElementById('modalKategorie').addEventListener('click', (e) => { if (e.target.id === 'modalKategorie') e.currentTarget.classList.remove('zeigen'); });
  document.getElementById('btnKatSpeichern').addEventListener('click', () => {
    const name = document.getElementById('fKatName').value.trim();
    if (!name) { alert('Bitte einen Namen eingeben.'); return; }
    const icon = document.getElementById('fKatIcon').value.trim() || '📦';
    const id = neueId('kat_');
    kategorienEigene.push({ id, label: name, icon, fest: false });
    speichern(KEY_KATEGORIEN, kategorienEigene);
    aktiveKategorie = id;
    document.getElementById('modalKategorie').classList.remove('zeigen');
    renderKatTabs();
    renderListe();
  });

  // ---------- SORTIERUNG ----------
  function sortiereItems(liste) {
    const arr = liste.slice();
    if (sortierung === 'alpha') {
      arr.sort((a, b) => a.name.localeCompare(b.name, 'de'));
    } else if (sortierung === 'gruppierung') {
      arr.sort((a, b) => (a.gruppierung || '\uffff').localeCompare(b.gruppierung || '\uffff', 'de') || a.name.localeCompare(b.name, 'de'));
    } else if (sortierung === 'lagerort') {
      arr.sort((a, b) => (a.lagerort || '\uffff').localeCompare(b.lagerort || '\uffff', 'de') || a.name.localeCompare(b.name, 'de'));
    } else if (sortierung === 'verfall') {
      arr.sort((a, b) => {
        const da = a.verfallsdatum || a.aufbrauchenBis || '9999-99-99';
        const db = b.verfallsdatum || b.aufbrauchenBis || '9999-99-99';
        return da.localeCompare(db) || a.name.localeCompare(b.name, 'de');
      });
    } else if (sortierung === 'bestand') {
      const rang = { leer: 0, mittel: 1, viel: 2, '': 1.5 };
      arr.sort((a, b) => (rang[a.bestand||''] - rang[b.bestand||'']) || a.name.localeCompare(b.name, 'de'));
    }
    return arr;
  }
  const sortSelect = document.getElementById('sortAuswahl');
  sortSelect.value = sortierung;
  sortSelect.addEventListener('change', () => {
    sortierung = sortSelect.value;
    try { localStorage.setItem(KEY_SORT, sortierung); } catch (e) {}
    renderListe();
  });

  // ---------- VERFALL-BADGE ----------
  function verfallBadge(item) {
    const datum = item.verfallsdatum || item.aufbrauchenBis;
    if (!datum) return '';
    const label = item.verfallsdatum ? 'MHD' : 'Aufbrauchen bis';
    const heute = ausISO(heuteISO());
    const ziel = ausISO(datum);
    const tage = Math.round((ziel - heute) / 86400000);
    let klasse = 'verfall-ok', text;
    if (tage < 0) { klasse = 'verfall-um'; text = label + ': abgelaufen'; }
    else if (tage === 0) { klasse = 'verfall-bald'; text = label + ': heute'; }
    else if (tage <= 7) { klasse = 'verfall-bald'; text = label + ': noch ' + tage + ' Tag' + (tage === 1 ? '' : 'e'); }
    else { text = label + ': ' + ziel.toLocaleDateString('de-DE'); }
    return '<span class="vk-chip ' + klasse + '">' + text + '</span>';
  }

  // ---------- LISTE RENDERN ----------
  const BESTAND_STUFEN = [
    { id: 'leer',   label: '0',  farbe: '#a03e3e', bg: '#f6d9d9', titel: 'Kaum/leer – bald nachkaufen' },
    { id: 'mittel', label: '+',  farbe: '#a8792f', bg: '#fbe8d3', titel: 'Mittlere Menge' },
    { id: 'viel',   label: '++', farbe: '#3d7a3d', bg: '#dcefdc', titel: 'Viel vorhanden' },
  ];
  function bestandInfo(id) { return BESTAND_STUFEN.find(s => s.id === id) || null; }
  function naechsterBestand(id) {
    const idx = BESTAND_STUFEN.findIndex(s => s.id === id);
    return BESTAND_STUFEN[(idx + 1) % BESTAND_STUFEN.length].id;
  }

  function renderListe() {
    const box = document.getElementById('vorratListe');
    const eigene = sortiereItems(items.filter(i => i.kategorie === aktiveKategorie));
    document.getElementById('leerHinweis').style.display = eigene.length ? 'none' : '';
    document.getElementById('anzahlText').textContent = eigene.length + ' Eintrag' + (eigene.length === 1 ? '' : 'e');
    box.innerHTML = '';
    eigene.forEach(item => {
      const karte = document.createElement('div');
      karte.className = 'vorrat-karte';
      const sterneHtml = '<div class="sterne-reihe">' + [1,2,3,4,5].map(i => '<span class="stern' + (i <= (item.sterne||0) ? ' aktiv' : '') + '">★</span>').join('') + '</div>';
      const bi = bestandInfo(item.bestand);
      karte.innerHTML =
        '<div class="vk-kopf">' +
          '<button class="vk-herz' + (item.favorit ? ' aktiv' : '') + '" data-id="' + item.id + '">' + (item.favorit ? '♥' : '♡') + '</button>' +
          '<button class="vk-bestand" data-id="' + item.id + '" style="background:' + (bi ? bi.bg : '#ece5d8') + ';color:' + (bi ? bi.farbe : '#8a7c5f') + '" title="' + (bi ? bi.titel : 'Bestand grob einschätzen – antippen') + '">' + (bi ? bi.label : '?') + '</button>' +
          '<div class="vk-titel-block">' +
            '<span class="vk-name">' + escapeHtml(item.name) + '</span> ' +
            (item.menge ? '<span class="vk-menge">· ' + escapeHtml(item.menge) + '</span>' : '') +
            sterneHtml +
          '</div>' +
          '<button class="vk-cart" data-id="' + item.id + '" title="Zur Einkaufsliste hinzufügen">🛒</button>' +
        '</div>' +
        '<div class="vk-meta-reihe">' +
          (item.lagerort && lagerortInfo(item.lagerort) ? '<span class="vk-chip">' + lagerortInfo(item.lagerort).icon + ' ' + escapeHtml(lagerortInfo(item.lagerort).label) + '</span>' : '') +
          (item.gruppierung ? '<span class="vk-chip">' + escapeHtml(item.gruppierung) + '</span>' : '') +
          verfallBadge(item) +
        '</div>' +
        (item.notiz ? '<div class="vk-notiz">' + escapeHtml(item.notiz) + '</div>' : '');
      karte.addEventListener('click', (e) => {
        if (e.target.closest('.vk-herz')) {
          e.stopPropagation();
          item.favorit = !item.favorit;
          speichern(KEY_ITEMS, items);
          renderListe();
          return;
        }
        if (e.target.closest('.vk-bestand')) {
          e.stopPropagation();
          item.bestand = naechsterBestand(item.bestand);
          speichern(KEY_ITEMS, items);
          renderListe();
          return;
        }
        if (e.target.closest('.vk-cart')) {
          e.stopPropagation();
          zumEinkaufHinzufuegen(item);
          return;
        }
        itemFormOeffnen(item.id);
      });
      box.appendChild(karte);
    });
  }

  // ---------- ZUR EINKAUFSLISTE ----------
  function zumEinkaufHinzufuegen(item) {
    let listen = laden(KEY_EINKAUF_LISTEN, null);
    if (!listen || !listen.length) listen = [{ id: neueId('l'), name: 'Wocheneinkauf', items: [] }];
    let aktivId = localStorage.getItem(KEY_EINKAUF_AKTIV);
    let aktiv = listen.find(l => l.id === aktivId) || listen[0];
    const kandidat = aktiv.items.find(i => !i.erledigt && i.name.trim().toLowerCase() === item.name.trim().toLowerCase());
    if (kandidat) {
      showTempStatus('„' + item.name + '" steht schon in „' + aktiv.name + '".');
      return;
    }
    aktiv.items.push({ id: neueId('i'), name: item.name, menge: '', einheit: '', kategorie: 'sonstiges', erledigt: false, hinzugefuegtVon: 'vorrat:' + item.name });
    speichern(KEY_EINKAUF_LISTEN, listen);
    if (!aktivId) localStorage.setItem(KEY_EINKAUF_AKTIV, aktiv.id);
    showTempStatus('🛒 „' + item.name + '" zu „' + aktiv.name + '" hinzugefügt.');
  }

  // ---------- FORMULAR: ITEM ANLEGEN/BEARBEITEN ----------
  function renderFormLagerortReihe() {
    const box = document.getElementById('fLagerortReihe');
    box.innerHTML = LAGERORT_OPTIONEN.map(l =>
      '<button type="button" class="kategorie-opt' + (l.id === editLagerort ? ' aktiv' : '') + '" data-id="' + l.id + '">' + l.icon + ' ' + escapeHtml(l.label) + '</button>'
    ).join('');
    box.querySelectorAll('.kategorie-opt').forEach(btn => {
      btn.addEventListener('click', () => { editLagerort = (editLagerort === btn.dataset.id) ? '' : btn.dataset.id; renderFormLagerortReihe(); });
    });
  }
  function renderFormKategorieReihe() {
    const box = document.getElementById('fKategorieReihe');
    box.innerHTML = alleKategorien().map(k =>
      '<button type="button" class="kategorie-opt' + (k.id === editKategorie ? ' aktiv' : '') + '" data-id="' + k.id + '">' + k.icon + ' ' + escapeHtml(k.label) + '</button>'
    ).join('');
    box.querySelectorAll('.kategorie-opt').forEach(btn => {
      btn.addEventListener('click', () => { editKategorie = btn.dataset.id; renderFormKategorieReihe(); });
    });
  }
  function renderSterneEingabe() {
    const box = document.getElementById('sterneEingabe');
    box.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = i <= editSterne ? 'aktiv' : '';
      btn.textContent = '★';
      btn.addEventListener('click', () => { editSterne = (editSterne === i) ? 0 : i; renderSterneEingabe(); });
      box.appendChild(btn);
    }
  }
  function aktualisiereGruppierungListe() {
    const dl = document.getElementById('gruppierungListe');
    const werte = {};
    items.forEach(i => { if (i.gruppierung) werte[i.gruppierung.trim().toLowerCase()] = i.gruppierung.trim(); });
    dl.innerHTML = Object.values(werte).sort((a,b) => a.localeCompare(b,'de')).map(n => '<option value="' + escapeHtml(n) + '">').join('');
  }
  function itemFormOeffnen(id) {
    bearbeitenId = id || null;
    const item = id ? items.find(i => i.id === id) : null;
    document.getElementById('itemModalTitel').textContent = item ? 'Vorrat bearbeiten' : 'Neuer Vorrat';
    document.getElementById('fName').value = item ? item.name : '';
    document.getElementById('fMenge').value = item ? (item.menge || '') : '';
    document.getElementById('fBestand').value = item ? (item.bestand || '') : '';
    document.getElementById('fGruppierung').value = item ? (item.gruppierung || '') : '';
    document.getElementById('fGekauft').value = item ? (item.gekauftAm || '') : '';
    document.getElementById('fVerfall').value = item ? (item.verfallsdatum || '') : '';
    document.getElementById('fAufbrauchen').value = item ? (item.aufbrauchenBis || '') : '';
    document.getElementById('fNotiz').value = item ? (item.notiz || '') : '';
    editSterne = item ? (item.sterne || 0) : 0;
    editKategorie = item ? item.kategorie : aktiveKategorie;
    editLagerort = item ? (item.lagerort || '') : '';
    aktualisiereGruppierungListe();
    renderFormLagerortReihe();
    renderFormKategorieReihe();
    renderSterneEingabe();
    document.getElementById('loeschZeile').style.display = item ? '' : 'none';
    document.getElementById('modalItem').classList.add('zeigen');
  }
  document.getElementById('btnNeu').addEventListener('click', () => itemFormOeffnen(null));
  document.getElementById('btnAbbrechen').addEventListener('click', () => document.getElementById('modalItem').classList.remove('zeigen'));
  document.getElementById('modalItem').addEventListener('click', (e) => { if (e.target.id === 'modalItem') e.currentTarget.classList.remove('zeigen'); });
  document.getElementById('btnSpeichern').addEventListener('click', () => {
    const name = document.getElementById('fName').value.trim();
    if (!name) { alert('Bitte einen Namen eingeben.'); return; }
    const daten = {
      name,
      menge: document.getElementById('fMenge').value.trim(),
      bestand: document.getElementById('fBestand').value,
      kategorie: editKategorie,
      lagerort: editLagerort,
      gruppierung: document.getElementById('fGruppierung').value.trim(),
      gekauftAm: document.getElementById('fGekauft').value,
      verfallsdatum: document.getElementById('fVerfall').value,
      aufbrauchenBis: document.getElementById('fAufbrauchen').value,
      notiz: document.getElementById('fNotiz').value.trim(),
      sterne: editSterne,
    };
    if (bearbeitenId) {
      const item = items.find(i => i.id === bearbeitenId);
      Object.assign(item, daten);
    } else {
      items.push(Object.assign({ id: neueId('v'), favorit: false }, daten));
    }
    speichern(KEY_ITEMS, items);
    document.getElementById('modalItem').classList.remove('zeigen');
    aktiveKategorie = editKategorie;
    renderKatTabs();
    renderListe();
  });
  document.getElementById('btnLoeschen').addEventListener('click', () => {
    if (!bearbeitenId) return;
    if (!confirm('Diesen Eintrag wirklich löschen?')) return;
    items = items.filter(i => i.id !== bearbeitenId);
    speichern(KEY_ITEMS, items);
    document.getElementById('modalItem').classList.remove('zeigen');
    renderListe();
  });

  renderKatTabs();
  renderListe();

  if (window.PlanerSync) {
    window._sync = window.PlanerSync.starteSync({
      modul: 'vorratskammer',
      keys: [KEY_ITEMS, KEY_KATEGORIEN],
      onRemoteChange: function () {
        items = laden(KEY_ITEMS, items);
        kategorienEigene = laden(KEY_KATEGORIEN, kategorienEigene);
        renderKatTabs();
        renderListe();
      },
    });
  }
})();
</script>

<script>
(function() {
  var KEY_THEME = 'vorrat_hintergrundThema';
  var klassen = ['bg-glaeser', 'bg-kraeuter'];
  function themeAnwenden(id) {
    document.body.classList.remove.apply(document.body.classList, klassen);
    if (id) document.body.classList.add(id);
    document.querySelectorAll('.theme-swatch').forEach(function(s) { s.classList.toggle('aktiv', s.dataset.theme === id); });
  }
  var aktivesTheme = '';
  try { aktivesTheme = localStorage.getItem(KEY_THEME) || ''; } catch(e) {}
  themeAnwenden(aktivesTheme);
  var btn = document.getElementById('btnThemeAuswahl');
  var popup = document.getElementById('themePopup');
  if (btn && popup) {
    btn.addEventListener('click', function() { popup.classList.toggle('zeigen'); });
    document.querySelectorAll('.theme-swatch').forEach(function(swatch) {
      swatch.addEventListener('click', function() {
        var id = swatch.dataset.theme;
        themeAnwenden(id);
        try { localStorage.setItem(KEY_THEME, id); } catch(e) {}
        popup.classList.remove('zeigen');
      });
    });
    document.addEventListener('click', function(e) {
      if (popup.classList.contains('zeigen') && !popup.contains(e.target) && e.target.id !== 'btnThemeAuswahl') {
        popup.classList.remove('zeigen');
      }
    });
  }
})();
</script>
