<!DOCTYPE html>
<html lang="de">
<head>
<script>(function(){try{var m=localStorage.getItem('planer_darkMode');if(m==='dunkel'||(m==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-dark','1');}var s=localStorage.getItem('planer_schriftgroesse');if(s==='gross'){document.documentElement.style.fontSize='19px';}var f=localStorage.getItem('planer_farbschema');if(f&&f!=='wald'){document.documentElement.setAttribute('data-farbschema',f);}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medien</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --soil: #3a2e1f; --moss: #4f6f45; --sage: #7fa476; --leaf: #bcd196;
    --cream: #faf6ec; --parchment: #ece0c7; --bark: #7d6339;
    --terracotta: #c46b41; --terracotta-text: #a8532e; --sky: #5b8bb5;
    --white: #fffdf8; --navbg: #2a2016; --navbg2: #3a2e1f; --gold: #c99a3a;
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 18px; --radius-pill: 22px;
    --shadow-soft: 0 2px 10px rgba(59,47,30,0.08); --shadow-md: 0 8px 26px rgba(59,47,30,0.2);
  }
  html[data-dark="1"] {
    --soil: #f0e8d8; --moss: #6fae5e; --sage: #9bc98a; --leaf: #cfe3b8;
    --cream: #1e1b16; --parchment: #2b261e; --bark: #c2b393;
    --terracotta: #d9855a; --terracotta-text: #e8a37e; --sky: #7fa8cc; --gold: #dcb158;
    --white: #2f2a22; --navbg: #14100c; --navbg2: #221a12;
  }

  /* ---- Farbschemata (global, familienweit synchronisiert) ---- */
  html[data-farbschema="ozean"] {
    --navbg: #1c1f24; --navbg2: #2b2f36; --sage: #8fd4c9; --leaf: #8fd4c9; --moss: #4fa89c;
  }
  html[data-farbschema="schnee"] {
    --navbg: #1c1f24; --navbg2: #2b2f36; --sage: #c9cdd3; --leaf: #f0f0f2; --moss: #5b5f66;
  }
  html[data-farbschema="fjord"] {
    --navbg: #1c1f24; --navbg2: #2b2f36; --sage: #9cc0ec; --leaf: #9cc0ec; --moss: #5b8bc9;
  }
  html[data-farbschema="bernstein"] {
    --navbg: #1c1f24; --navbg2: #2b2f36; --sage: #e6c878; --leaf: #e6c878; --moss: #c9a24d;
  }
  /* Im Dunkelmodus soll der Hauptbereich bei allen Nicht-Wald-Farbthemen ebenfalls
     neutral-anthrazit statt warm-braun sein, damit Header und Inhalt zusammenpassen. */
  html[data-dark="1"][data-farbschema] {
    --cream: #191b1f; --parchment: #24262c; --white: #2a2d33;
    --soil: #eceef0; --bark: #a7acb5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--soil); min-height: 100vh; padding-bottom: 40px; }

  .theme-btn { background: none; border: none; color: var(--leaf); font-size: 0.95rem; cursor: pointer; padding: 3px 4px; flex-shrink: 0; }
  .theme-popup { display: none; position: absolute; right: 12px; top: 54px; background: var(--white, #fff); border-radius: var(--radius-md, 10px); box-shadow: var(--shadow-md, 0 8px 26px rgba(59,47,30,0.2)); padding: 10px; z-index: 50; }
  .theme-popup.zeigen { display: flex; gap: 8px; flex-wrap: wrap; max-width: 216px; }
  .theme-swatch { width: 40px; height: 40px; border-radius: var(--radius-sm, 8px); border: 2px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; background: var(--cream); }
  .theme-swatch.aktiv { border-color: var(--moss); }
  .theme-farbe-trenner { flex-basis: 100%; height: 1px; background: rgba(0,0,0,0.08); margin: 2px 0; }
  .theme-swatch.farbe { border: 2px solid rgba(0,0,0,0.1); }
  .theme-swatch.farbe.aktiv { border-color: var(--moss); border-width: 3px; }
  .theme-farbe-custom { position: relative; overflow: hidden; background: conic-gradient(red,yellow,lime,cyan,blue,magenta,red); }
  .theme-farbe-custom-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; border: none; padding: 0; }
  .theme-foto-swatch { border: 2px dashed var(--bark); background: var(--cream); position: relative; overflow: hidden; }
  .theme-foto-input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

D%22%235a4832%22%20stroke-width%3D%221.25%22/%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%222%22%20r%3D%222%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2860%2C115%29%20scale%280.6%29%20rotate%286%29%22%3E%3Crect%20x%3D%22-14%22%20y%3D%22-14%22%20width%3D%2228%22%20height%3D%2228%22%20rx%3D%225%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22/%3E%3Ccircle%20cx%3D%22-6%22%20cy%3D%22-6%22%20r%3D%222%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22/%3E%3Ccircle%20cx%3D%226%22%20cy%3D%226%22%20r%3D%222%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22/%3E%3Ccircle%20cx%3D%220%22%20cy%3D%220%22%20r%3D%222%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22/%3E%3Ccircle%20cx%3D%22-6%22%20cy%3D%226%22%20r%3D%222%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22/%3E%3Ccircle%20cx%3D%226%22%20cy%3D%22-6%22%20r%3D%222%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    background-repeat: repeat;
  }
  body.bg-sterne {
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22190%22%20height%3D%22190%22%20viewBox%3D%220%200%20190%20190%22%3E%3Cg%20opacity%3D%220.1%22%3E%3Cg%20transform%3D%22translate%2815%2C15%29%20scale%280.75%29%20rotate%280%29%22%3E%3Cpolygon%20points%3D%220.0%2C-14.0%20-3.5%2C-4.9%20-13.3%2C-4.3%20-5.7%2C1.9%20-8.2%2C11.3%20-0.0%2C6.0%208.2%2C11.3%205.7%2C1.9%2013.3%2C-4.3%203.5%2C-4.9%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22%20stroke-linejoin%3D%22round%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28115%2C25%29%20scale%280.55%29%20rotate%2820%29%22%3E%3Cpolygon%20points%3D%220.0%2C-14.0%20-3.5%2C-4.9%20-13.3%2C-4.3%20-5.7%2C1.9%20-8.2%2C11.3%20-0.0%2C6.0%208.2%2C11.3%205.7%2C1.9%2013.3%2C-4.3%203.5%2C-4.9%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22%20stroke-linejoin%3D%22round%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2860%2C115%29%20scale%280.65%29%20rotate%28-15%29%22%3E%3Cpolygon%20points%3D%220.0%2C-14.0%20-3.5%2C-4.9%20-13.3%2C-4.3%20-5.7%2C1.9%20-8.2%2C11.3%20-0.0%2C6.0%208.2%2C11.3%205.7%2C1.9%2013.3%2C-4.3%203.5%2C-4.9%22%20fill%3D%22none%22%20stroke%3D%22%235a4832%22%20stroke-width%3D%221.25%22%20stroke-linejoin%3D%22round%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");

  button, input, select, textarea { font-family: inherit; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--terracotta); outline-offset: 2px; border-radius: 4px; }

  header.top { position: relative; background: linear-gradient(135deg, var(--navbg2), var(--navbg)); color: var(--leaf); padding: 6px 12px; }

  header.top::after { content: ''; position: absolute; left: 0; right: 0; bottom: -3px; height: 3px; background: linear-gradient(90deg, var(--moss), var(--sage) 35%, var(--leaf) 65%, var(--moss)); opacity: 0.85; z-index: 1; }
  header.top .titel-zeile { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  header.top h1 { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; }
  .add-btn { background: var(--terracotta); color: var(--white); border: none; border-radius: var(--radius-pill); font-size: 0.82rem; font-weight: 700; padding: 7px 15px; cursor: pointer; }
  .suchzeile { display: flex; gap: 8px; margin-bottom: 8px; }
  .suchzeile input { flex: 1; padding: 9px 12px; border-radius: var(--radius-pill); border: none; font-size: 0.85rem; background: #1e160f; color: var(--leaf); }
  .suchzeile input::placeholder { color: #6b7a63; }
  .filter-reihe { display: flex; gap: 5px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; scrollbar-width: none; }
  .filter-reihe::-webkit-scrollbar { display: none; }
  .filter-chip { flex: 0 0 auto; background: transparent; border: 1px solid #4a3a28; color: var(--sage); font-size: 0.72rem; font-weight: 600; padding: 5px 12px; border-radius: var(--radius-pill); cursor: pointer; white-space: nowrap; }
  .filter-chip.active { background: var(--moss); color: var(--leaf); border-color: var(--moss); }

  main { padding: 12px 14px; max-width: 680px; margin: 0 auto; }
  @media (min-width: 1000px) {
    main { max-width: 1200px; }
    .spiel-grid { grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); gap: 14px; }
  }

  .stat-reihe { display: flex; gap: 8px; margin-bottom: 12px; }
  .stat-box { flex: 1; background: var(--white); border-radius: var(--radius-md); padding: 10px; text-align: center; box-shadow: var(--shadow-soft); }
  .stat-box .wert { font-size: 1.1rem; font-weight: 700; color: var(--moss); }
  .stat-box .label { font-size: 0.62rem; color: var(--bark); text-transform: uppercase; letter-spacing: 0.02em; margin-top: 2px; }

  .view-toggle { display: flex; gap: 4px; background: #1e160f; border-radius: var(--radius-pill); padding: 3px; width: fit-content; }
  .view-toggle button { border: none; background: transparent; color: var(--sage); font-size: 0.75rem; font-weight: 600; padding: 6px 14px; border-radius: var(--radius-pill); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .view-toggle button.active { background: var(--moss); color: var(--leaf); }

  .karte { background: var(--white); border-radius: var(--radius-md); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow-soft); }
  .karte h3 { font-family: 'Playfair Display', serif; font-size: 0.95rem; margin-bottom: 10px; color: var(--soil); }

  .add-sport-btn { width: 100%; background: var(--white); border: 1px dashed var(--sage); color: var(--moss); border-radius: var(--radius-md); padding: 10px; font-size: 0.85rem; font-weight: 700; cursor: pointer; margin-bottom: 12px; }

  .chart-balken-reihe { display: flex; align-items: flex-end; gap: 4px; height: 90px; margin-bottom: 6px; }
  .chart-balken-spalte { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 3px; }
  .chart-balken { width: 100%; background: var(--moss); border-radius: 3px 3px 0 0; min-height: 2px; }
  .chart-balken-label { font-size: 0.58rem; color: var(--bark); white-space: nowrap; }
  .chart-leer { font-size: 0.78rem; color: var(--bark); opacity: 0.7; padding: 10px 0; }

  .top-spiel-zeile { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--parchment); }
  .top-spiel-zeile:last-child { border-bottom: none; }
  .top-spiel-rang { font-weight: 700; color: var(--bark); font-size: 0.85rem; min-width: 18px; }
  .top-spiel-name { flex: 1; font-size: 0.85rem; font-weight: 600; }
  .top-spiel-zeit { font-size: 0.75rem; color: var(--moss); font-weight: 700; }

  .verlauf-zeile { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--parchment); font-size: 0.82rem; }
  .verlauf-zeile:last-child { border-bottom: none; }
  .verlauf-datum { font-size: 0.68rem; color: var(--bark); min-width: 64px; }
  .verlauf-loeschen { background: none; border: none; color: var(--parchment); font-size: 0.95rem; cursor: pointer; }
  .verlauf-loeschen:hover { color: var(--terracotta-text); }

  .spiel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
  .spiel-karte { background: var(--white); border-radius: var(--radius-md); padding: 12px; box-shadow: var(--shadow-soft); cursor: pointer; display: flex; flex-direction: column; gap: 6px; border-top: 3px solid var(--moss); }
  .spiel-titel { font-size: 0.88rem; font-weight: 700; line-height: 1.25; }
  .spiel-chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .mini-chip { font-size: 0.6rem; font-weight: 700; padding: 2px 8px; border-radius: var(--radius-pill); white-space: nowrap; }
  .sterne-reihe { display: flex; gap: 1px; margin-top: 2px; }
  .sterne-reihe .stern { font-size: 0.85rem; color: var(--parchment); }
  .sterne-reihe .stern.aktiv { color: var(--gold); }
  .spiel-zeit { font-size: 0.66rem; color: var(--bark); }

  .leer-hinweis { text-align: center; color: var(--soil); font-size: 0.85rem; padding: 46px 16px; opacity: 1; font-weight: 500; }
  .leer-hinweis .em { font-size: 2.2rem; display: block; margin-bottom: 8px; }

  .modal-bg { position: fixed; inset: 0; background: rgba(42,32,22,0.45); display: none; align-items: flex-end; justify-content: center; z-index: 100; }
  .modal-bg.zeigen { display: flex; }
  .modal { background: var(--cream); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 18px 18px 24px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-md); }
  @media (min-width: 560px) { .modal-bg { align-items: center; } .modal { border-radius: var(--radius-lg); } }
  .modal h2 { font-family: 'Playfair Display', serif; font-size: 1.1rem; margin-bottom: 14px; }
  .feld { margin-bottom: 12px; }
  .feld label { display: block; font-size: 0.7rem; font-weight: 700; color: var(--bark); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
  .feld input, .feld select, .feld textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--parchment); border-radius: var(--radius-sm); font-size: 0.9rem; background: var(--white); color: var(--soil); }
  .zeile { display: flex; gap: 10px; }
  .zeile .feld { flex: 1; }
  .opt-reihe { display: flex; gap: 6px; flex-wrap: wrap; }
  .opt { padding: 6px 12px; border-radius: var(--radius-pill); font-size: 0.75rem; font-weight: 600; border: 1px solid var(--parchment); background: var(--white); color: var(--bark); cursor: pointer; }
  .opt.aktiv { color: var(--white); border-color: transparent; }
  .sterne-eingabe { display: flex; gap: 4px; }
  .sterne-eingabe button { background: none; border: none; font-size: 1.6rem; color: var(--parchment); cursor: pointer; padding: 0 2px; }
  .sterne-eingabe button.aktiv { color: var(--gold); }
  /* Teil-gefüllte Sterne (z.B. 3,7): Verlauf gold→leer, auf die Sternform zugeschnitten */
  .stern-teil { background: linear-gradient(90deg, var(--gold) var(--f, 0%), var(--parchment) var(--f, 0%)); -webkit-background-clip: text; background-clip: text; color: transparent !important; }
  .sterne-wert { font-size: 0.68rem; font-weight: 700; color: var(--bark); margin-left: 4px; align-self: center; }
  /* Links: Bild füllt den freien Platz, Felder sitzen unten bündig mit der letzten Bewertungszeile */
  .bew-layout { display: flex; gap: 12px; align-items: stretch; margin-bottom: 12px; }
  .bew-layout .feld-spalte { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .bew-layout .feld-spalte > .feld:last-child, .bew-layout .bewertung-spalte { margin-bottom: 0; }
  .bew-layout .bewertung-spalte { flex: 1.3; min-width: 0; }
  .bild-feld { flex: 1; display: flex; flex-direction: column; }
  .bew-layout .feld-spalte .feld { margin-bottom: 8px; }
  .bew-layout .feld-spalte input, .bew-layout .feld-spalte select { padding: 7px 9px; }
  .bild-box { position: relative; flex: 1; min-height: 80px; border: 1.5px dashed var(--parchment); border-radius: var(--radius-sm); background: var(--white); overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 0.75rem; font-weight: 600; color: var(--bark); }
  .bild-box.hat-bild { border-style: solid; }
  .bild-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .bild-box input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 1; }
  .bild-entfernen { position: absolute; top: 5px; right: 5px; z-index: 2; width: 26px; height: 26px; border-radius: 50%; border: none; background: rgba(42,32,22,0.7); color: #fff; font-size: 0.8rem; cursor: pointer; display: none; }
  .bild-box.hat-bild .bild-entfernen { display: block; }
  .spiel-cover { margin: -12px -12px 2px; height: 96px; background-size: cover; background-position: center; border-radius: 0; }

<script>
(function(){
  'use strict';
  // ---------- HANDY-ZURÜCK-TASTE ABFANGEN ----------
  // Ohne eigene Behandlung navigiert der native Zurück-Knopf des Smartphones durch die
  // Browser-Historie "hindurch" und die App landet auf einer leeren Zwischenseite.
  // Stattdessen: schließt zuerst jedes offene Fenster/Popup; ist nichts offen, passiert
  // bewusst gar nichts (statt die App zu verlassen bzw. leerzuräumen).
  function zurueckTasteUeberlagerungenSchliessen() {
    let geschlossen = false;
    document.querySelectorAll('.modal-bg, .theme-popup').forEach(el => {
      const sichtbar = el.style.display === 'flex' || el.style.display === 'block' || el.classList.contains('zeigen');
      if (sichtbar) { el.style.display = 'none'; el.classList.remove('zeigen'); geschlossen = true; }
    });
    return geschlossen;
  }
  try {
    history.pushState({ zurueckBasis: true }, '', location.href);
    window.addEventListener('popstate', function () {
      zurueckTasteUeberlagerungenSchliessen();
      history.pushState({ zurueckBasis: true }, '', location.href);
    });
  } catch (e) {}
  // ---------- KURZE STATUSMELDUNG (TOAST), optional mit Rückgängig-Aktion ----------
  function showTempStatus(text, sekunden, optionen) {
    optionen = optionen || {};
    let el = document.getElementById('tempStatus');
    if (!el) { el = document.createElement('div'); el.id = 'tempStatus'; document.body.appendChild(el); }
    el.style.cssText =
      'position:fixed;left:50%;bottom:24px;transform:translate(-50%,0);' +
      'background:#2a2016;color:#bcd196;padding:10px 18px;border-radius:22px;' +
      'font-size:0.85rem;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,0.25);' +
      'opacity:1;pointer-events:' + (optionen.rueckgaengig ? 'auto' : 'none') + ';transition:opacity .2s, transform .2s;z-index:9999;' +
      'max-width:88vw;text-align:center;font-family:Inter,system-ui,sans-serif;' +

    el.innerHTML = '';

      btn.style.cssText = 'background:none;border:none;color:#e8c98a;font-weight:700;font-size:0.85rem;cursor:pointer;padding:2px 4px;flex-shrink:0;text-decoration:underline;';
      btn.addEventListener('click', () => {

        el.style.opacity = '0';

  function __pullToRefreshModalOffen() {
    return !!document.querySelector('.modal-bg.zeigen') ||

  }
  // ---------- PULL-TO-REFRESH (von oben nach unten wischen) ----------
  (function () {
    let startY = 0, ziehend = false, ausgeloest = false;
    const SCHWELLE = 130;
    let indikator = null;
    function indikatorZeigen(strecke) {
      if (!indikator) {
        indikator = document.createElement('div');
        indikator.id = '__pullToRefreshIndikator';
        indikator.style.cssText =
          'position:fixed;top:8px;left:50%;transform:translate(-50%,-40px) rotate(0deg);' +
          'width:34px;height:34px;border-radius:50%;background:#2a2016;color:#bcd196;' +
          'display:flex;align-items:center;justify-content:center;font-size:1.1rem;' +
          'z-index:9998;transition:opacity .15s;box-shadow:0 3px 10px rgba(0,0,0,0.25);opacity:0;';
        document.body.appendChild(indikator);
      }
      const anteil = Math.min(1, strecke / SCHWELLE);
      indikator.style.opacity = String(anteil);
      indikator.style.transform = 'translate(-50%,' + (-40 + anteil * 56) + 'px) rotate(' + (anteil * 180) + 'deg)';
      indikator.textContent = anteil >= 1 ? '↻' : '↓';
    }
    function indikatorAusblenden() { if (indikator) indikator.style.opacity = '0'; }
    document.addEventListener('touchstart', (e) => {
      if (window.scrollY > 0 || e.touches.length !== 1 || __pullToRefreshModalOffen()) { ziehend = false; return; }
      startY = e.touches[0].clientY; ziehend = true; ausgeloest = false;
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      if (!ziehend) return;
      const strecke = e.touches[0].clientY - startY;
      if (strecke <= 0) { indikatorAusblenden(); return; }
      if (window.scrollY > 0 || __pullToRefreshModalOffen()) { ziehend = false; indikatorAusblenden(); return; }
      indikatorZeigen(strecke);
      if (strecke >= SCHWELLE) ausgeloest = true;
    }, { passive: true });
    document.addEventListener('touchend', () => {
      if (ziehend && ausgeloest) {
        if (indikator) { indikator.textContent = '↻'; indikator.style.opacity = '1'; }
        location.reload();
      } else { indikatorAusblenden(); }
      ziehend = false;
    }, { passive: true });
  })();

  // Fortschrittszeile auf der Karte, z.B. "Band 7 / 12" mit Balken oder "Staffel 2 · Folge 5"
  function fortschrittHtml(e) {
    const t = typInfo(e.typ);

    }

  // Alles, was von der gewählten Art abhängt (Wo-Liste, Status-Wörter, Fortschritt, Bewertungspunkte)
  function typAbhaengigesRendern() {
    const t = typInfo(editTyp);
    renderEditTypReihe();
    document.getElementById('fWoLabel').textContent = t.lesen ? 'Format' : 'Wo';
    editWo = auswahlFuellen('fWo', t.wo, editWo);
    editStatus = auswahlFuellen('fStatus', statusListe(t.lesen), editStatus);
    const feld = document.getElementById('fFortschrittFeld');
    feld.style.display = t.fort ? '' : 'none';
    if (t.fort) {
      document.getElementById('fFortschrittLabel').textContent = t.fort.label;
      document.getElementById('fFortA').placeholder = t.fort.a;
      document.getElementById('fFortB').placeholder = t.fort.b;
      document.getElementById('fFortTrenner').textContent = t.fort.trenner;
    }
    renderSterneEingabe();
  }
  document.getElementById('fWo').addEventListener('change', (e) => { editWo = e.target.value; });
  document.getElementById('fStatus').addEventListener('change', (e) => { editStatus = e.target.value; });

  function sterneKnoepfe(box, wert, klickbar, onWahl, name) {
    box.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'stern-teil';
      btn.style.setProperty('--f', sternFuellung(wert, i));
      btn.textContent = '★';
      btn.disabled = !klickbar;
      btn.setAttribute('aria-label', name + ': ' + i + (i === 1 ? ' Stern' : ' Sterne'));
      if (klickbar) btn.addEventListener('click', () => onWahl(wert === i ? 0 : i));
      box.appendChild(btn);
    }
  }
  function renderSterneEingabe() {
    const anzahl = bewerteteKriterien(editDetail, editTyp).length;
    const gesamt = gesamtBewertung(editDetail, editBewertung, editTyp);
    sterneKnoepfe(document.getElementById('bewGesamtSterne'), gesamt, anzahl === 0,
      (v) => { editBewertung = v; renderSterneEingabe(); }, 'Gesamt');
    document.getElementById('bewGesamtHinweis').textContent = anzahl
      ? 'Ø ' + bewertungText(gesamt) + ' aus ' + anzahl + (anzahl === 1 ? ' Punkt' : ' Punkten')
      : (editBewertung ? 'Direkt vergeben' : 'Direkt vergeben oder einzeln bewerten');
    const liste = document.getElementById('bewKriterien');
    liste.innerHTML = '';
    typInfo(editTyp).kriterien.forEach(k => {
      const zeile = document.createElement('div');
      zeile.className = 'bew-zeile';
      zeile.innerHTML = '<span>' + k.label + '</span><div class="bew-sterne"></div>';
      sterneKnoepfe(zeile.querySelector('.bew-sterne'), editDetail[k.id] || 0, true, (v) => {
        if (v) editDetail[k.id] = v; else delete editDetail[k.id];
        renderSterneEingabe();
      }, k.label.replace(/\u00ad/g, ''));
      liste.appendChild(zeile);
    });
  }

  // ---------- Bild ----------
  function renderBildFeld() {
    const box = document.getElementById('bildBox');
    const img = document.getElementById('bildVorschau');
    box.classList.toggle('hat-bild', !!editBild);
    img.style.display = editBild ? '' : 'none';
    if (editBild) img.src = editBild; else img.removeAttribute('src');
    document.getElementById('bildPlatzhalter').style.display = editBild ? 'none' : '';
  }
  function bildVerkleinern(datei) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const faktor = Math.min(1, BILD_MAX_KANTE / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * faktor);
          canvas.height = Math.round(img.height * faktor);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = () => reject(new Error('Datei ist kein gültiges Bild.'));
        img.src = ev.target.result;
      };
      reader.onerror = () => reject(new Error('Bild konnte nicht gelesen werden.'));
      reader.readAsDataURL(datei);
    });
  }
  document.getElementById('fBild').addEventListener('change', async (e) => {
    const datei = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!datei) return;
    try { editBild = await bildVerkleinern(datei); renderBildFeld(); }
    catch (err) { alert(err.message); }
  });
  document.getElementById('btnBildEntfernen').addEventListener('click', (e) => {
    e.stopPropagation(); editBild = null; renderBildFeld();
  });

  // ---------- Öffnen / Speichern / Löschen ----------
  function editModalOeffnen(e) {
    bearbeiteId = e ? e.id : null;
    document.getElementById('editKopf').textContent = e ? 'Eintrag bearbeiten' : 'Neuer Eintrag';
    document.getElementById('fTitel').value = e ? e.titel : '';
    document.getElementById('fNotiz').value = e ? (e.notiz || '') : '';
    // Neuer Eintrag: Art aus dem gewählten Reiter übernehmen (Filme/Serien → Film)
    editTyp = e ? e.typ : (typFilter !== 'alle' ? typFilter : 'manga');
    editPerson = e ? e.person : (personFilter !== 'alle' ? personFilter : (PERSONEN[1] ? PERSONEN[1].id : 'familie'));
    editWo = e ? e.wo : typInfo(editTyp).wo[0].id;
    editStatus = e ? e.status : 'wunschliste';
    editDetail = Object.assign({}, (e && e.bewertungDetail) || {});
    editBewertung = e ? (e.bewertungManuell || 0) : 0;
    editBild = e ? (bilder[e.id] || null) : null;
    document.getElementById('fFortA').value = e && e.fortschritt ? (e.fortschritt.a || '') : '';
    document.getElementById('fFortB').value = e && e.fortschritt ? (e.fortschritt.b || '') : '';
    renderEditPersonReihe();
    typAbhaengigesRendern();
    renderBildFeld();
    document.getElementById('loeschZeile').style.display = e ? '' : 'none';
    document.getElementById('modalEdit').classList.add('zeigen');
    if (!e) document.getElementById('fTitel').focus();
  }
  function modalSchliessen() { document.getElementById('modalEdit').classList.remove('zeigen'); }
  document.getElementById('btnNeu').addEventListener('click', () => editModalOeffnen(null));
  document.getElementById('btnAbbrechen').addEventListener('click', modalSchliessen);
  document.getElementById('modalEdit').addEventListener('click', (e) => { if (e.target.id === 'modalEdit') modalSchliessen(); });

  document.getElementById('btnSpeichern').addEventListener('click', () => {
    const titel = document.getElementById('fTitel').value.trim();
    if (!titel) { alert('Bitte einen Titel eingeben.'); return; }
    const t = typInfo(editTyp);
    // Nur Punkte der gewählten Art speichern (nach einem Art-Wechsel fallen fremde weg)
    const detail = {};
    t.kriterien.forEach(k => { const w = editDetail[k.id]; if (w >= 1 && w <= 5) detail[k.id] = w; });
    const alt = bearbeiteId ? eintraege.find(x => x.id === bearbeiteId) : null;
    const neu = Object.assign({}, alt || {}, {
      id: bearbeiteId || neueId('m'),
      titel, typ: editTyp, person: editPerson, wo: editWo, status: editStatus,
      fortschritt: t.fort ? { a: document.getElementById('fFortA').value.trim(), b: document.getElementById('fFortB').value.trim() } : null,
      bewertung: gesamtBewertung(detail, editBewertung, editTyp),
      bewertungDetail: detail,
      bewertungManuell: editBewertung,
      notiz: document.getElementById('fNotiz').value.trim(),
      erstelltAm: alt ? (alt.erstelltAm || new Date().toISOString()) : new Date().toISOString(),
    });
    if (alt) eintraege = eintraege.map(x => x.id === bearbeiteId ? neu : x);
    else eintraege.push(neu);
    speichernEintraege();
    if ((bilder[neu.id] || null) !== editBild) {
      if (editBild) bilder[neu.id] = editBild; else delete bilder[neu.id];
      speichernBilder();
    }
    modalSchliessen();
    renderAlles();
  });

  document.getElementById('btnLoeschen').addEventListener('click', () => {
    if (!bearbeiteId) return;
    const index = eintraege.findIndex(x => x.id === bearbeiteId);
    if (index === -1) return;
    const entfernt = eintraege[index];
    const entferntesBild = bilder[entfernt.id] || null;
    eintraege.splice(index, 1);
    speichernEintraege();
    if (entferntesBild) { delete bilder[entfernt.id]; speichernBilder(); }
    modalSchliessen();
    renderAlles();
    showTempStatus('Gelöscht: „' + entfernt.titel + '"', 6, {
      rueckgaengig: () => {
        eintraege.splice(index, 0, entfernt); speichernEintraege();
        if (entferntesBild) { bilder[entfernt.id] = entferntesBild; speichernBilder(); }
        renderAlles();
      }
    });
  });

  // ---------- Start ----------
  if (!TYP_FILTER.some(f => f.id === typFilter)) typFilter = 'alle';
  if (!PERSONEN.some(p => p.id === personFilter)) personFilter = 'alle';
  renderSortButton();
  renderFilter();
  renderAlles();

  if (window.PlanerSync) {
    window._sync = window.PlanerSync.starteSync({
      modul: 'medien',
      keys: [KEY_EINTRAEGE],
      onRemoteChange: function () { eintraege = laden(KEY_EINTRAEGE, eintraege); renderAlles(); },
    });
    bilderSync = window.PlanerSync.starteSync({
      modul: 'medien_bilder',
      keys: [KEY_BILDER],
      onRemoteChange: function () { bilder = laden(KEY_BILDER, bilder); renderGrid(); },
    });
  }
})();
</script>

<script>
(function() {
  var KEY_THEME = 'medien_hintergrundThema';
  var KEY_FOTO = KEY_THEME.replace('hintergrundThema', 'hintergrundBildEigenes');
  var klassen = ['bg-sterne'];
  function themeAnwenden(id) {
    document.body.classList.remove.apply(document.body.classList, klassen);
    document.body.style.backgroundColor = '';
    document.body.style.backgroundImage = '';
    document.body.style.backgroundSize = '';
    document.body.style.backgroundPosition = '';
    document.body.style.backgroundRepeat = '';
    var eigenesFoto = '';
    try { eigenesFoto = localStorage.getItem(KEY_FOTO) || ''; } catch(e) {}
    if (id === 'foto' && eigenesFoto) {
      document.body.style.backgroundImage = 'linear-gradient(rgba(250,246,236,0.82),rgba(250,246,236,0.82)), url("' + eigenesFoto + '")';
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center';
      document.body.style.backgroundRepeat = 'no-repeat';
    }
    else if (id && id.indexOf('farbe:') === 0) { document.body.style.backgroundColor = id.slice(6) + 'b3'; }
    else if (id) document.body.classList.add(id);
    document.querySelectorAll('.theme-swatch').forEach(function(s) { s.classList.toggle('aktiv', s.dataset.theme === id); });
  }
  var aktivesTheme = '';
  try { aktivesTheme = localStorage.getItem(KEY_THEME) || ''; } catch(e) {}
  themeAnwenden(aktivesTheme);
  var customFarbeInput = document.querySelector('.theme-farbe-custom-input');
  if (customFarbeInput) {
    customFarbeInput.addEventListener('input', function() {
      var neueId = 'farbe:' + customFarbeInput.value;
      themeAnwenden(neueId);
      try { localStorage.setItem(KEY_THEME, neueId); } catch(e) {}
    });
  }
  var fotoInput = document.querySelector('.theme-foto-input');
  if (fotoInput) {
    fotoInput.addEventListener('change', function(e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        var img = new Image();
        img.onload = function() {
          var maxW = 900;
          var scale = Math.min(1, maxW / img.width);
          var canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          var dataUrl = canvas.toDataURL('image/jpeg', 0.65);
          try {
            localStorage.setItem(KEY_FOTO, dataUrl);
            localStorage.setItem(KEY_THEME, 'foto');
          } catch(err) { alert('Foto konnte nicht gespeichert werden (evtl. zu groß oder Speicher voll).'); return; }
          themeAnwenden('foto');
        };
        img.onerror = function() { alert('Datei ist kein gültiges Bild.'); };
        img.src = ev.target.result;
      };
      reader.onerror = function() { alert('Foto konnte nicht gelesen werden.'); };
      reader.readAsDataURL(file);
    });
  }
  var btn = document.getElementById('btnThemeAuswahl');
  var popup = document.getElementById('themePopup');
  if (btn && popup) {
    btn.addEventListener('click', function() { popup.classList.toggle('zeigen'); });
    document.querySelectorAll('.theme-swatch:not(.theme-farbe-custom):not(.theme-foto-swatch)').forEach(function(swatch) {
      swatch.addEventListener('click', function() {
        var id = swatch.dataset.theme;
        themeAnwenden(id);
        try { localStorage.setItem(KEY_THEME, id); } catch(e) {}
        popup.classList.remove('zeigen');
      });
    });
    document.addEventListener('click', function(e) {
      if (popup.classList.contains('zeigen') && !popup.contains(e.target) && e.target.id !== 'btnThemeAuswahl') {
        popup.classList.remove('zeigen');
      }
    });
  }
})();
</script>
